name: Release

on:
  workflow_dispatch:
    inputs:
      major:
        description: "Override major (A) version component"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Dry run — compute version/notes, open no PR"
        required: false
        default: false
        type: boolean
      auto_merge:
        description: "Enable auto-merge on the Release PR when CI is green"
        required: false
        default: false
        type: boolean
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  open-release-pr:
    name: Open Release PR
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install zbuild
        run: ./install.sh

      - name: Build release args
        id: args
        run: |
          args=""
          [[ "${{ inputs.dry_run }}" == "true" ]] && args="$args --dry-run"
          [[ -n "${{ inputs.major }}" ]]           && args="$args --major ${{ inputs.major }}"
          echo "release_args=$args" >> "$GITHUB_OUTPUT"

      - name: Validate — dry-run pass
        id: validate
        run: |
          bash scripts/release.sh --dry-run ${{ inputs.major != '' && format('--major {0}', inputs.major) || '' }} 2>&1 | tee /tmp/dry-run-out.txt
          # Capture version line so we can name the PR
          version=$(grep -oP '(?<=planned tag: )v[\d.]+' /tmp/dry-run-out.txt | head -1 || true)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Abort on dry_run input
        if: inputs.dry_run == true
        run: |
          echo "dry_run=true — skipping PR creation."
          exit 0

      - name: Apply changelog (mutate CHANGELOG.md)
        id: apply
        run: |
          args="${{ steps.args.outputs.release_args }}"
          # Strip --dry-run from args for the real apply pass
          args="${args/--dry-run/}"
          # Capture output; if release.sh exits nonzero (gate refused) we skip PR.
          set +e
          out="$(bash scripts/release.sh $args 2>&1)"
          rc=$?
          set -e
          echo "$out"
          if [[ $rc -ne 0 ]]; then
            echo "release.sh exited $rc — gate refused. Skipping PR creation."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(echo "$out" | grep -oP '(?<=Release )(v[\d.]+)' | head -1 || true)
          [[ -z "$version" ]] && version="${{ steps.validate.outputs.version }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Create release branch and PR
        if: steps.apply.outputs.skip != 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.apply.outputs.version }}"
          branch="release/auto-$(date +%Y%m%d)"
          git checkout -b "$branch"
          git add CHANGELOG.md
          git commit -m "chore: changelog for ${version}" || true
          git push origin "$branch"
          pr_url=$(gh pr create \
            --title "Release ${version}" \
            --body "Automated Release PR for ${version}. Merge to trigger publish." \
            --base main \
            --head "$branch")
          echo "PR: $pr_url"
          if [[ "${{ inputs.auto_merge }}" == "true" ]]; then
            gh pr merge --auto --squash "$pr_url"
          fi

  publish:
    name: Publish Release
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.title, 'Release v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install zbuild
        run: ./install.sh

      - name: Publish release (tag + tarball + gh release create)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/release.sh --force
