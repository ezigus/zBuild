  # ─── Phase 0.5 — GitHub CI Integration (3 issues) ──────────────────────
  - id: ci-1
    title: "[Phase 0.5] Reusable workflow: .github/workflows/zbuild-pipeline.yml"
    milestone: "Phase 0.5 — MVP Pipeline & Distribution"
    labels: [phase-0, foundation, cli-ux]
    body: |
      Ship a reusable GitHub Actions workflow that downstream repos can
      include in their own .github/workflows/ to run zBuild against their
      issues:

        jobs:
          zbuild:
            uses: ezigus/zBuild/.github/workflows/zbuild-pipeline.yml@v1
            with:
              template: security-audit
            secrets:
              ZBUILD_GITHUB_TOKEN: ${{ secrets.ZBUILD_PAT }}
              ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      Scope:
      - Workflow file in this repo, with `on: workflow_call:` trigger
      - Inputs: template (string), issue-number (string, optional)
      - Steps: install zbuild, run pipeline, exit code propagation
      - Documented in docs/CI-INTEGRATION.md
      - Test repo demonstrating consumption (could be a fixture)

      Dependencies: INST-1 (zbuild must be installable via npm/curl first).
  - id: ci-2
    title: "[Phase 0.5] Daemon-in-Actions mode (label-triggered pipeline)"
    milestone: "Phase 0.5 — MVP Pipeline & Distribution"
    labels: [phase-0, foundation, daemon-plugin]
    body: |
      The shipwright daemon's external API is GitHub labels. Replicate the
      pattern as a workflow: when an issue gets the `zbuild` label, an
      Actions workflow picks it up and runs the pipeline (no long-running
      daemon needed).

      Scope:
      - .github/workflows/zbuild-on-label.yml triggered by `issues: labeled`
      - Filters on `label.name == 'zbuild'`
      - Calls the reusable workflow from CI-1 with issue number
      - Posts result back as a comment (via the output plugin from MVP-5)
      - Documented label contract in docs/CI-INTEGRATION.md
      - Sample tested on this repo against a test issue

      Future: Phase 3 daemon plugins (issues #45-55) implement the long-running
      version. CI-2 is the Actions-native variant; both share the label contract.
  - id: ci-3
    title: "[Phase 0.5] Auth + permissions docs (PAT vs GITHUB_TOKEN, secrets)"
