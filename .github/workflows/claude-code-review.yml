name: Claude Code Review

on:
  # Automatic: review every PR as it opens / updates / reopens.
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  # On-demand from the Actions tab: review a specific PR by number.
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string
  # On-demand from the PR itself: comment "/claude-review" on the pull request.
  issue_comment:
    types: [created]

jobs:
  claude-review:
    # Fire on any PR event, a manual dispatch, or a "/claude-review" comment on a
    # PR. (issue_comment fires for issues AND PRs — gate on .pull_request so plain
    # issue comments are ignored.)
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '/claude-review'))

    runs-on: ubuntu-latest
    # Review-only policy: this action MUST leave review comments for a human to
    # address — it MUST NOT commit or push code. `contents: read` is the hard
    # guarantee (the workflow token cannot push); `pull-requests`/`issues: write`
    # let it post the review + comments. Do NOT raise contents to write.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Resolve PR number
        id: pr
        env:
          # Pass event fields through the environment — never inline ${{ }} into
          # the run: body. Validate the resolved value is numeric before use.
          EVENT_NAME: ${{ github.event_name }}
          PR_FROM_PULL: ${{ github.event.pull_request.number }}
          PR_FROM_COMMENT: ${{ github.event.issue.number }}
          PR_FROM_DISPATCH: ${{ github.event.inputs.pr_number }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)      pr="$PR_FROM_PULL" ;;
            issue_comment)     pr="$PR_FROM_COMMENT" ;;
            workflow_dispatch) pr="$PR_FROM_DISPATCH" ;;
            *) echo "::error::unsupported event '$EVENT_NAME'"; exit 1 ;;
          esac
          if [[ ! "$pr" =~ ^[0-9]+$ ]]; then
            echo "::error::could not resolve a numeric PR number (got '$pr')"; exit 1
          fi
          echo "number=$pr" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # --comment makes /code-review POST its findings as inline PR comments +
          # a summary (without it the review runs but posts nothing — the cause of
          # the 0-comment runs). We deliberately do NOT pass --fix: this reviewer
          # comments only, never edits/commits (also enforced by contents: read).
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ steps.pr.outputs.number }} --comment'
          # Grant exactly the tools the code-review plugin needs to post: the
          # inline-comment MCP tool + the gh read/comment commands. Without this
          # allowlist Claude cannot attach line comments (permission_denials).
          # No Edit/Write/git — comment-only by construction. --max-turns lifts the
          # budget so a real multi-file review can complete + post.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Read,Grep,Glob"
            --max-turns 30
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
