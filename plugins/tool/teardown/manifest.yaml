id: teardown
name: Teardown Stage
kind: tool
version: 0.1.0
description: |
  Iterates over all stages that executed in the current pipeline run,
  resolves each stage's plugin directory, and calls plugin_hook_call cleanup
  with scope=release for each. Always returns 0 — cleanup failures are
  recorded via stage.cleanup.release.failed events, never propagated.
  Dispatched by the runner at every pipeline exit path.
  Never dispatches scope=purge — that is operator-only (future CLI subcommand).

hooks:
  run: teardown_run

requires:
  core:
    - event-bus
    - state
  plugins: []

provides:
  role: teardown

inputs: []
outputs: []
