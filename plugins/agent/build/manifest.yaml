id: build
name: Build Stage
kind: agent
version: 0.1.0
# ADR-071: the topics of earlier stages' output its prompt's Previous work holds.
takes:
  - topic: ask
    for: "the design to build"
  - topic: tests
    for: "the tests the change must pass"
  - topic: change
    for: "the change made so far"
  - topic: requirement-findings
    for: "findings against the requirements the change must meet"
  - topic: code-findings
    for: "failing tests and problems found in the code"
description: |
  Build stage agent. Reads the plan.json artifact produced by the plan stage
  and invokes the LLM (T2) to produce a diff.patch and build-summary.json.
  The diff.patch is NEVER applied inside this plugin — it is written as an
  artifact for the downstream test stage to validate and apply.

hooks:
  run: build_stage_run
requires:
  core:
    - redaction
    - event-bus
    - state
    - router
  plugins: []

provides:
  role: builder
  result_contract: 3
  # ADR-001 §"Declared events" (#1717) — this plugin's own events, composed into
  # the engine's known set at load. Adding one here needs no engine-config edit.
  events:
    - build.aborted
    - build.checks.failed
    - build.commit.created
    - build.commit.skipped
    - build.diff.binary_truncation_observed
    - build.diff.empty_after_done_sentinel
    - build.diff.trailing_newline_restored
    - build.discrepancy.detected
    - build.empty_diff
    - build.git_diff_failed
    - build.inert_build
    - build.invariant.diff_is_stub
    - build.invariant.hunk_count_mismatch
    - build.numstat.precondition_failed
    - build.numstat.truncated
    - build.scope.violation
    - build.scope.inscope_preserved
    - build.scope_grant_applied
    - build.scope_injected
    - build.authored_testfiles.restored
    - build.scratch.cleaned

config:
  # #2371: rounds build spends scanning its own change for secrets and going
  # back to its model with where they are; still a secret after the last is
  # outcome fail.
  check_rounds: 3
  tier_default: T2
  # ADR-017 §11 (#1816): build's own budget, previously written only in the
  # template. `max_turns: 0` omits --max-turns — the call is bounded by its
  # time, not by turn. Each try is one model call (#2439); a build that times
  # out is run again by the engine (ADR-054 §6a: `timed_out` → retry, the
  # template's `retry:`, else 1), continuing from its saved work, while each
  # try changes its outputs.
  router:
    timeout_s: 900
    max_turns: 0

outputs:
  - id: diff_patch
    topic: change
    description: "the change build made, as a patch against the base"
    path: "${artifact_dir}/diff.patch"
    type: diff.patch@1
    format: patch
    required: true
  - id: build_summary
    topic: change
    description: "build's result: its outcome, and what it did about each finding it received"
    path: "${artifact_dir}/build-summary.json"
    type: build-summary.json@4
    format: json
    required: true
    # ADR-020 amendment (#507): primary output; .verdict (pass|scope_violation)
    # drives indicator. Added in build-summary schema_version=3.
    primary: true
  # ADR-055 §9: this stage's statement of what it DID. required:true —
  # written on every terminal verdict, so absence means something went wrong.
  - id: build_stage_summary
    topic: change
    description: "build's summary of the change, in words"
    path: "${artifact_dir}/build-summary.md"
    type: build-summary.md@1
    format: markdown
    required: true
    summary: true
state:
  persisted: [last_files_changed, last_lines_added]
  reconstructed: [plan_json]

# ADR-047 §4: capability flags — the orchestrator reads these to replace the
# hardcoded `[[ "$_cm" == "build" ]]` guard with a manifest-driven check.
capabilities:
  # #2174: only a plugin declaring this may edit the target repository.
  writes_repository: true
  produces_commits: true
  empty_diff_legitimate: true
