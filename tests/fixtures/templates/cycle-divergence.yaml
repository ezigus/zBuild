id: cycle-divergence
name: Cycle whose failure_count grows
defaults:
  strategy: fanout
stages:
  - id: build-test
    type: cycle
    stages: [build, test]
    until:
      stage: test
      field: verdict
      op: eq
      value: pass
    max_iterations: 6
    on_max: continue
    divergence:
      window: 2

stage_definitions:
  build:
    roles: [builder]
  test:
    roles: [tester]
