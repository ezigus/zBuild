id: pr-delivery
name: PR Stage
kind: agent
version: 0.1.0
description: |
  PR delivery agent (kind:agent, T2). Reads review.json and refuses if verdict==block.
  Delegates to the pr-open tool plugin (T0) for the actual gh pr create call, passing
  the run's state file through. ZBUILD_DRY_RUN=1 writes mock artifacts instead.
  ADR-018 Pattern 1 (one-shot): verdict guard → pr-open, done — no iteration loop.
  plan.json/design.md are accepted as optional inputs (reserved for future PR-body
  composition; not yet consumed by the one-shot implementation).
  # legacy-citation: pipeline-stages-delivery.sh:81 (stage_pr)

hooks:
  init: pr_stage_init
  run: pr_stage_run
  finalize: pr_stage_finalize
  cleanup: pr_stage_cleanup

requires:
  core:
    - redaction
    - event-bus
    - state
  plugins: []

provides:
  artifact_type: pr-url.txt
  role: pr_delivery
  schema_version: 1

config:
  tier_default: T2

inputs:
  # #1142 follow-up: required:false — standard.yaml provides the `review` stage
  # (review.json), but simple.yaml replaced it with the advisory review-aggregator
  # (review-report.json, consumed below). pr-delivery's verdict guard already
  # no-ops when review.json is absent (plugin.sh `[[ -f "$review_json" ]]`), and
  # the auto_unless_flagged path reads review-report.json. Hard-requiring `review`
  # broke simple.yaml preflight after the C3 lens cutover.
  - id: review
    type: file
    path: "${artifact_dir}/review.json"
    source: stage:review
    required: false
  - id: review_report
    type: file
    path: "${artifact_dir}/review-report.json"
    source: stage:review-aggregator
    required: false
  - id: plan
    type: file
    path: "${artifact_dir}/plan.json"
    source: stage:plan
    required: false
  - id: design
    type: file
    path: "${artifact_dir}/design.md"
    source: stage:design
    required: false

outputs:
  - id: pr_url
    path: ${artifact_dir}/pr-url.txt
    type: pr-url.txt
    required: true
    primary: true
  - id: pr_result
    path: ${artifact_dir}/pr-result.json
    type: pr-result.json
    required: true

state:
  persisted: []
  reconstructed: []
