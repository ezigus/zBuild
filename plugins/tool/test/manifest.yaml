id: test
name: Test Stage
kind: tool
# ADR-040 §5: convergence marker. `gate` = mechanical must-pass gate (in the
# roster-driven gate-aggregator must-pass set). The test-suite verdict is the
# primary mechanical gate.
convergence: gate
version: 0.1.0
description: |
  Rsyncs the repo HEAD (which post-#608 contains the committed iter work)
  into a temporary directory and runs the project test suite. Captures exit
  code and output; always exits 0 so the pipeline engine reads the verdict
  from the artifact rather than the plugin exit code. Never invokes
  route_to_model (T0 tool — no LLM dependency).

  Wave 12-C (#662) removed the historic `git apply diff.patch` step — see
  ADR-020 amendment §A. diff.patch is now consumed only by the review stage
  (LLM context) and operators (audit).

hooks:
  run: test_run
  # cleanup: retired in #2024 (ADR-062 §3). Its two halves are engine-owned
  # now: the suite's process group is registered at spawn and freed by
  # teardown(release), and the staging tree lives under <run>/scratch/ so
  # teardown(purge) removes it as a path. §4 required proving the engine
  # reclaims BEFORE this line came out — see tests/integration/
  # hard-kill-sweep-e2e-test.sh, which kills the runner outright.

requires:
  core:
    - event-bus
    - state
  plugins: []

provides:
  role: tester
  result_contract: 2
  # ADR-001 §"Declared events" (#1717) — this plugin's own events, composed into
  # the engine's known set at load. Adding one here needs no engine-config edit.
  events:
    - test.result_write.fallback
    - test.targeted.confirming
    - test_assessment.acceptance_fail
    - test_assessment.advisory_mode
    - test_assessment.downgrade
    - test_assessment.missing_baseline
    - test_assessment.missing_input

config:
  valid_verdicts:
    - pass
    - fail
    - error
  tier_default: T0
  test_cmd_default: "npm test"
  # #846/ADR-034: targeted re-run command template ({files} placeholder, set via
  # ZBUILD_TEST_CMD_TARGETED). Empty default → the stage auto-uses
  # `scripts/run-tests.sh --files {files}` when the repo has it, else runs full.
  test_cmd_targeted_default: ""

# Wave 12-C (#662): no declared inputs.
# Post-#608 + Wave 12-B (#667), the test stage rsyncs the repo HEAD (which
# already contains the committed iter work) and runs the test suite directly.
# diff.patch is consumed by the review stage (LLM context) and operators
# (audit) — not by test. See ADR-020 amendment §A.
inputs:
  # #2121: the design's declared TESTFILES join the targeted rerun set.
  # Optional: a template without design runs the suite as before.
  - id: design
    required: false

outputs:
  # #2183: this stage's error channel — whatever its subprocesses said when
  # they failed. Published to the other stages' prompts (bounded) when this
  # stage's verdict is a failure; the per-file output of a suite run that failed.
  - id: test_errors
    path: "${artifact_dir}/test-errors.log"
    type: test-errors.log@1
    format: text
    required: false
    errors: true
  - id: test_results
    path: "${artifact_dir}/test-results.json"
    type: test-results.json@1
    format: json
    required: true
    # ADR-020 amendment (#507): primary output drives the runner's
    # stage-complete indicator via the .verdict field.
    primary: true
  # ADR-055 §9 (amended #1988): this stage's SUMMARY. Written on EVERY terminal
  # verdict — pass, fail and error — because absence is not a legitimate state:
  # "ran and found nothing" and "published nothing" are different facts. That
  # makes `required: true` the contract, and the existing missing-output
  # machinery enforces it with no new engine code. This REPLACES the older
  # #511 F2 "missing == empty" semantics, under which a passing run left no file.
  - id: test_failures_summary
    path: "${artifact_dir}/test-failures-summary.md"
    type: test-failures-summary.md@1
    format: markdown
    required: true
    # #1977: `advisory` says no stage CONSUMES it as an input (ADR-020 #1750);
    # `summary` says it is offered as prompt context (#1976). Both hold — the
    # extracted failing assertions are exactly what a re-running build needs.
    summary: true
  # #2110: per-file wall time (`file <ms> <path>`), consumed by the acceptance
  # gate to bound each negctl/reachability run by what this stage MEASURED
  # rather than a flat 60s. Optional: a targeted rerun logs only its subset.
  # #2180: the suite's raw output, for diagnosing a failure that the extraction
  # above cannot explain. Declared so the engine uploads it with the run; NOT
  # `summary: true` — it is far too large for a prompt, and the extraction is
  # what a stage reads. Optional: a stage that died before spawning has none.
  - id: test_output_log
    path: "${artifact_dir}/test-output.log"
    type: test-output.log@1
    format: text
    required: false
  - id: test_timing
    path: "${artifact_dir}/test-timing.log"
    type: test-timing.log@1
    format: text
    required: false

state:
  persisted: [last_verdict, last_exit_code]
  reconstructed: []

# ADR-047 §4: capability flag — the orchestrator reads this to prefer the
# declared artifact's integer field over the generic rc-based failure count.
capabilities:
  detailed_failure_count:
    artifact: test-results.json
    field: failed
