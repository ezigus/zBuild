id: issue-acceptance
name: Issue Acceptance
kind: agent
# #2482 (ADR-001): the ids this stage writes start with it.
id_prefix: IA
version: 0.1.0
# ADR-071: the topics of earlier stages' output its prompt's Previous work holds.
takes:
  - topic: ask
    for: "the issue's requirements, to judge the change against"
  - topic: change
    for: "the change to judge"
  - topic: code-findings
    for: "test results, as evidence of what the change does"
description: |
  Judges the finished change against the ISSUE: every requirement the issue
  states must be met by the diff, with the tests passing. Runs inside
  build_test_cycle after the tests, so an unmet
  requirement keeps the cycle from converging.
  spec-coverage reads the issue once, before any code exists; every later
  check judges the SPECs. A plan or design that narrows a requirement therefore
  produces a run that is green all the way down and still not what was asked —
  #1849 run 36238164552 shipped exactly that. This stage closes the loop at the
  end, against the issue itself.
  Each unmet requirement is a numbered finding; every stage answers it, and
  who fixes it is never this stage's to say (#2271, ADR-068).

hooks:
  run: issue_acceptance_run

requires:
  core:
    - redaction
    - event-bus
    - router

provides:
  role: issue_acceptance
  result_contract: 3
  events:
    - issue_acceptance.judged
    # #2304 (ADR-069 §7): the judge could not tell whether a requirement is met.
    - issue_acceptance.unsure
    - issue_acceptance.unreadable_issue
    - issue_acceptance.result.write_failed
    # #2464, #2466 (ADR-072 §4): a kept answer saved, used instead of a call,
    # or found stale and judged again — one event per item.
    - judge.kept.saved
    - judge.kept.used
    - judge.kept.stale

config:
  tier_default: T2

# ADR-017 §12 (#2507): every model call this stage makes, by name, with its
# tools in zbuild's words; the provider turns them into its own.
# It judges: it reads the change, and changes nothing.
calls:
  main: [read-files, read-git, web-search, subagents]

outputs:
  - id: issue_acceptance_result
    topic: requirement-findings
    description: "whether the change meets each of the issue's requirements; findings: each requirement not met, and why; each part of the change no requirement asks for, by who can undo it"
    path: "${artifact_dir}/issue-acceptance-result.json"
    finding_topics: code-findings requirement-findings change-findings
    type: issue-acceptance-result.json@1
    format: json
    required: true
    primary: true
  - id: issue_acceptance_summary
    topic: requirement-findings
    description: "issue-acceptance's summary of what is met and what is not"
    path: "${artifact_dir}/issue-acceptance-summary.md"
    type: issue-acceptance-summary.md@1
    format: markdown
    required: true
    summary: true