id: merge
name: Auto-Merge Stage
kind: tool
version: 0.1.0
description: |
  Auto-merge tool plugin (ADR-037 §4, I9-B / #1050, I9-C / #1051). When
  merge_policy: auto is active and every loop passed (ZBUILD_RUN_LOOPS_PASSED=yes),
  merges via `gh pr merge --squash --auto`. When merge_policy: auto_unless_flagged,
  pr-delivery additionally requires the engine's word that no review lens was
  flagged (ZBUILD_RUN_FLAGGED=no) before delegating here; no word is fail-closed.
  Falls back to pr_open_run when the loops did not all pass. Refuses on main/master.
  No LLM dependency — T0 tool stage (ADR-013).

# #1849 (ADR-054/055 migration), recorded rather than implied:
#   - router budgets: none. T0 tool, no model call (ADR-037 §3), so there is no
#     router block to resolve from the manifest.
#   - cleanup: no hook. This plugin holds no live resource between calls; the
#     engine records the absence as plugin.cleanup.absent (#1823, #1829).
hooks:
  run: merge_run
requires:
  core:
    - event-bus
    - state

provides:
  result_contract: 3
  role: merge_executor
  events:
    - plugin.result

config:
  tier_default: T0

outputs:
  - id: merge_result
    path: ${artifact_dir}/merge-result.json
    type: merge-result.json@1
    format: json
    required: true
    primary: true
  - id: pr_url
    path: ${artifact_dir}/pr-url.txt
    type: pr-url.txt@1
    format: text
    required: false
  # ADR-055 §9: this stage's statement of what it DID. required:true —
  # written on every terminal verdict, so absence means something went wrong.
  - id: merge_summary
    path: "${artifact_dir}/merge-summary.md"
    type: merge-summary.md@1
    format: markdown
    required: true
    summary: true

state:
  persisted: []
  reconstructed: []
