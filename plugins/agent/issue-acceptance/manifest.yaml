id: issue-acceptance
name: Issue Acceptance
kind: agent
# #2482 (ADR-001): the ids this stage writes start with it.
id_prefix: IA
version: 0.1.0
# ADR-071: the topics of earlier stages' output its prompt's Previous work holds.
takes:
  - topic: ask
    for: "the issue's requirements, to judge the change against"
  - topic: change
    for: "the change to judge"
  # #2569 (ADR-071 §3): the tests and how they ran; it fixes no finding.
  - topic: tests
    for: "the tests and how they ran, as evidence of what the change does"
description: |
  Judges the finished change against the ISSUE: every requirement the issue
  states must be met by the diff, with the tests passing. Runs inside
  build_test_cycle after the tests, so an unmet
  requirement keeps the cycle from converging.
  spec-coverage reads the issue once, before any code exists; every later
  check judges the SPECs. A plan or design that narrows a requirement therefore
  produces a run that is green all the way down and still not what was asked —
  #1849 run 36238164552 shipped exactly that. This stage closes the loop at the
  end, against the issue itself.
  Each unmet requirement is a numbered finding; every stage answers it, and
  who fixes it is never this stage's to say (#2271, ADR-068).

hooks:
  run: issue_acceptance_run

requires:
  core:
    - redaction
    - event-bus
    - router

provides:
  role: issue_acceptance
  result_contract: 3
  events:
    - issue_acceptance.judged
    # #2304 (ADR-069 §7): the judge could not tell whether a requirement is met.
    - issue_acceptance.unsure
    - issue_acceptance.unreadable_issue
    - issue_acceptance.result.write_failed
    # #2464, #2466 (ADR-072 §4): a kept answer saved, used instead of a call,
    # or found stale and judged again — one event per item.
    - judge.kept.saved
    - judge.kept.used
    - judge.kept.stale
    # #2574 (ADR-072 §5): a part handed to another stage waits for it.
    - judge.handoff.waiting
    - judge.handoff.back
    - judge.handoff.capped
    # #2574 review: a pass judged again, refused on no line added since, stands.
    - judge.held

config:
  tier_default: T2

# ADR-017 §12 (#2507): every model call this stage makes, by name, with its
# tools in zbuild's words; the provider turns them into its own.
# It judges: it reads the change, and changes nothing.
calls:
  main: [read-files, read-git, web-search, subagents]
# ADR-051 §2: the persona each call runs as — a call that judges work is
# not run as the persona that wrote it.
personas:
  main: product-owner

outputs:
  # #2556 (ADR-071 §1): its verdict and summary name no topic, so they reach no
  # stage; its findings do, from the three outputs below — one per topic.
  - id: issue_acceptance_result
    description: "whether the change meets each of the issue's requirements; findings: each requirement not met, and each part of the change no requirement asks for — for the reports; stages read them from the outputs by topic"
    path: "${artifact_dir}/issue-acceptance-result.json"
    type: issue-acceptance-result.json@1
    format: json
    required: true
    primary: true
  - id: issue_acceptance_summary
    description: "issue-acceptance's summary of what is met and what is not"
    path: "${artifact_dir}/issue-acceptance-summary.md"
    type: issue-acceptance-summary.md@1
    format: markdown
    required: true
    summary: true
  # #2569: each output is named by what must change, its topic's word.
  - id: issue_acceptance_design
    topic: design-findings
    description: "issue-acceptance's findings the design must fix: a requirement the design misses or gets wrong, one it is not sure is met"
    path: "${artifact_dir}/issue-acceptance-design-result.json"
    type: routed-findings.json@1
    format: json
    required: false
  - id: issue_acceptance_test
    topic: test-findings
    description: "issue-acceptance's findings a test must fix: a part of a test no requirement asks for"
    path: "${artifact_dir}/issue-acceptance-test-result.json"
    type: routed-findings.json@1
    format: json
    required: false
  - id: issue_acceptance_code
    topic: code-findings
    description: "issue-acceptance's findings the code must fix: a requirement the change does not meet yet, a part of the change outside the tests no requirement asks for"
    path: "${artifact_dir}/issue-acceptance-code-result.json"
    type: routed-findings.json@1
    format: json
    required: false