# RETAINED, NOT STAGE-BOUND (#1704). This manifest's `id: pr` once bound the pr
# stage by id-match; pr-delivery now provides `role: pr` and resolve_stage_plugin
# fails closed on a declared role, so the pr stage can no longer reach this
# plugin. It stays because pr-delivery's plugin.sh invokes pr_open_run as its
# internal T0 delivery tool (ADR-013). Do not delete; do not give it a role.
id: pr
name: PR Open Stage
kind: tool
version: 0.1.0
description: |
  Opens a pull request via `gh pr create`. Reads the review.json artifact from
  the prior review stage and refuses to open if verdict == "block". Also refuses
  if the current branch is main or master. Opens non-draft by default; draft mode
  is controlled by _TPL_PR_DRAFT / pr_draft template key.
  No LLM dependency — T0 tool stage (ADR-013).

hooks:
  run: pr_open_run
  cleanup: pr_open_cleanup

requires:
  core:
    - event-bus
    - state

provides:
  # Canonical artifact per ADR-013: pr-url.txt.
  # The plugin also writes pr-result.json (richer status payload, listed in
  # outputs[] below); both are written on success. See ADR-013 Implementation
  # Notes for the canonical vs. secondary artifact convention.
  artifact_type: pr-url.txt
  schema_version: 1
  # ADR-001 §"Declared events" (#1717) — this plugin's own events, composed into
  # the engine's known set at load. Adding one here needs no engine-config edit.
  events:
    - plugin.pr_open.branch_fallback_used
    - plugin.pr_open.preflight_remote_has_work

config:
  # Writes no .verdict on either verdict channel; the engine falls back to
  # pass for a well-formed primary (core/pipeline/verdict.sh). An ABSENT key
  # is a lint failure; the explicit [] is the claim (#1708).
  valid_verdicts: []
  tier_default: T0
  draft: false

inputs:
  # #979 (EPIC #1277): the standard.yaml `review` stage (which produced the
  # blocking review.json) was retired, so its stage:review input is dropped —
  # it dangled (no producing manifest) and tripped the lint-contract graph check.
  # The advisory review-aggregator (review-report.json, below) is now the only
  # review data source. plugin.sh still reads review.json BY PATH if present (a
  # per-repo overlay could still emit one) and falls back to advisory mode when
  # it is absent — behavior unchanged; only the dead stage edge is removed.
  - id: review_report
    required: false

outputs:
  - id: pr_url
    path: ${artifact_dir}/pr-url.txt
    type: pr-url.txt
    format: text
    required: true
    # ADR-020 amendment (#507): canonical primary (non-JSON). Indicator
    # falls back to rc-only: present == pass.
    primary: true
  - id: pr_result
    path: ${artifact_dir}/pr-result.json
    type: pr-result.json
    format: json
    required: true

state:
  persisted: [last_pr_url, last_pr_number]
  reconstructed: []
