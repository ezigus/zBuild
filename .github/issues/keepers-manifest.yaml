# zBuild keepers-manifest.yaml — single source of truth for issue generation
#
# Generator: scripts/generate-issues.sh reads this file and creates issues +
# labels + milestones via the gh CLI. Idempotent: skips issues whose titles
# already exist. Re-run to add new issues; never updates existing ones.
#
# Structure:
#   labels: [{name, color, description}]
#   milestones: [{title, description}]
#   issues: [{id, title, milestone, labels, body, depends_on, blocks}]
#
# Conventions:
#   - title format: "[<section>] <keeper>"
#   - id is internal (not surfaced as GitHub identifier) — used for depends_on/blocks
#   - body uses the KEEPER issue template from KEEPERS §O

schema_version: 1

# ─── Labels (16) ────────────────────────────────────────────────────────────
labels:
  # Phase
  - name: phase-0
    color: "0066ff"
    description: Phase 0 — Core Engine Foundation
  - name: phase-1
    color: "0066ff"
    description: Phase 1 — Pipeline & Intelligence
  - name: phase-2
    color: "0066ff"
    description: Phase 2 — Reliability & Safety Primitives
  - name: phase-3
    color: "0066ff"
    description: Phase 3 — Daemon & Autonomous Ops
  - name: phase-4
    color: "0066ff"
    description: Phase 4 — CLI, UX, Skills, Personas
  - name: phase-5
    color: "0066ff"
    description: Phase 5 — Test Migration & Verification
  # Type
  - name: keeper
    color: "7c3aed"
    description: Behavior preserved from shipwright, with 5-test trial
  - name: wishlist
    color: "7c3aed"
    description: Section L — post-stabilization wishlist (not blocking)
  - name: foundation
    color: "7c3aed"
    description: Phase 0 foundational work (engine, repo, docs)
  - name: legacy-prune
    color: "fef3c7"
    description: Tombstone + git rm of legacy/ source for a verified keeper
  # Plugin kind
  - name: agent-plugin
    color: "00d4ff"
    description: "kind: agent — LLM-driven plugin"
  - name: tool-plugin
    color: "00d4ff"
    description: "kind: tool — non-AI integration"
  - name: recovery-plugin
    color: "00d4ff"
    description: "kind: recovery — error→action mapping"
  - name: orchestrator-plugin
    color: "00d4ff"
    description: "kind: orchestrator — multi-step choreography"
  - name: claim-coordinator
    color: "00d4ff"
    description: "kind: claim-coordinator — cross-machine claim"
  - name: daemon-plugin
    color: "00d4ff"
    description: "kind: daemon — autonomous background ops"
  # Concern (orthogonal)
  - name: safety-primitive
    color: "f87171"
    description: Safety primitive (redaction, validation, atomic state, etc.)
  - name: learning-loop
    color: "4ade80"
    description: Learning loop (UCB1, Thompson, skill registry, etc.)
  - name: test-migration
    color: "fbbf24"
    description: Test infrastructure / specific test file migration
  - name: cli-ux
    color: "a78bfa"
    description: CLI / UX surface

# ─── Milestones (7) ─────────────────────────────────────────────────────────
milestones:
  - title: Phase 0 — Core Engine Foundation
    description: |
      Ships when: redaction chokepoint, CURRENT_ITERATION persistence, plugin
      registry skeleton, event bus, first agent plugin (security lens), new repo,
      and legacy import are all done. See docs/KEEPERS.md §O.
  - title: Phase 1 — Pipeline & Intelligence
    description: |
      Stage handlers wrapped as plugins, compound_quality split into 4 modules,
      audit auto-select working, memory recall live. KEEPERS §A + §B.
  - title: Phase 2 — Reliability & Safety Primitives
    description: |
      9 redaction sites unified through chokepoint, admission-gate ordering
      documented, JSON corruption recovery wired into hot path, disk-space
      check on every artifact write, 7 hidden guards lifted. KEEPERS §C.
  - title: Phase 3 — Daemon & Autonomous Ops
    description: |
      claim-coordinator default plugin live, label-based control plane
      preserved, triage/patrol/health daemon plugins migrated, peer failover
      working. KEEPERS §D.
  - title: Phase 4 — CLI, UX, Skills, Personas
    description: |
      CLI surface matches shipwright's E section, 7 compound-audit lenses
      migrated as agent plugins, skill registry closed-loop preserved, status
      JSON / doctor / live-comment marker intact. KEEPERS §E + §F.
  - title: Phase 5 — Test Migration & Verification
    description: |
      5-test trial passes for every keeper, golden-file diffing added,
      multi-daemon claim race test passes, legacy/ has shrunk to zero. KEEPERS §G.
  - title: Wishlist — Post-stabilization
    description: |
      Behaviors not wired in shipwright today; build after Phase 5 stabilizes.
      KEEPERS §L (11 items).

# ─── Issues ─────────────────────────────────────────────────────────────────
# Body template (markdown) used for every keeper issue. Substitution placeholders:
#   ${spec_cite}      — KEEPERS section
#   ${legacy_cite}    — file:line in legacy/
#   ${behavior}       — one-paragraph behavior description
#   ${plugin_kind}    — agent | tool | recovery | orchestrator | claim-coordinator | daemon | (none for safety)
#   ${depends_on}     — markdown list of dependent issue IDs (resolved to issue numbers by generator)
#   ${blocks}         — markdown list of blocked issue IDs

