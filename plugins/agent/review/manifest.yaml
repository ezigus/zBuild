id: review
name: Review Stage
kind: agent
version: 0.1.0
description: |
  Review stage agent. Examines the diff against the plan and test results to
  produce a structured verdict: approve, request_changes, or block. Closes the
  plan -> build -> test -> review loop before a PR is opened.

hooks:
  init: review_init
  run: review_run
  finalize: review_finalize
  cleanup: review_cleanup

requires:
  core:
    - redaction
    - event-bus
    - state
    - router
  plugins: []

provides:
  artifact_type: review.json
  schema_version: 1

config:
  tier_default: T2
  valid_verdicts:
    - approve
    - request_changes
    - block

inputs:
  - id: scope_manifest
    type: file
    source: stage:intake
    required: true
  - id: plan
    type: file
    path: "${artifact_dir}/plan.json"
    source: stage:plan
    required: true
  - id: diff_patch
    type: file
    path: "${artifact_dir}/diff.patch"
    source: stage:build
    required: true
  - id: test_results
    type: file
    path: "${artifact_dir}/test-results.json"
    source: stage:test
    required: true

outputs:
  - id: review
    path: "${artifact_dir}/review.json"
    type: review.json
    required: true
    # ADR-020 amendment (#507): primary output; .verdict drives indicator.
    primary: true

state:
  persisted:
    - last_verdict
    - last_issues_count
  reconstructed: []
