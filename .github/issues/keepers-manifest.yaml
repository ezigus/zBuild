  - id: b-5
    title: "[B1] Vitals composite as circuit-breaker input"
    milestone: "Phase 1 — Pipeline & Intelligence"
    labels: [phase-1, keeper]
    spec_cite: "KEEPERS §B1.5"
    legacy_cite: "legacy/scripts/lib/loop-convergence.sh:101-132 (check_circuit_breaker); legacy/scripts/lib/sw-pipeline-vitals.sh:56-59 (weights)"
    behavior: |
      check_circuit_breaker reads pipeline_compute_vitals() JSON at :108, branches
