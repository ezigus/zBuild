name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    name: Smoke (CLI sanity + legacy sentinel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: CLI sanity
        run: |
          bash scripts/zbuild --version
          bash scripts/zbuild --help
      - name: Legacy sentinel
        run: bash legacy/scripts/sw 2>&1 | grep -q "disabled" || exit 1

  lint:
    name: Lint (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Shellcheck all scripts
        run: |
          find scripts core plugins -name '*.sh' -not -path '*/legacy/*' -print0 \
            | xargs -0 shellcheck --severity=warning

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run unit tier
        run: |
          export ZBUILD_TEST_TMP="$(mktemp -d)"
          bash scripts/run-tests.sh --tier unit 2>&1 | tee /tmp/zbuild-unit-results.txt
        env:
          ZBUILD_TEST_TMP: ""
      - name: Upload unit results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-results
          path: /tmp/zbuild-unit-results.txt
          if-no-files-found: ignore

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run integration tier
        run: |
          export ZBUILD_TEST_TMP="$(mktemp -d)"
          bash scripts/run-tests.sh --tier integration 2>&1 | tee /tmp/zbuild-integration-results.txt
      - name: Upload integration results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-results
          path: /tmp/zbuild-integration-results.txt
          if-no-files-found: ignore

  e2e-mocked:
    name: E2E (mocked)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run e2e tier (mocked claude+gh)
        run: |
          export ZBUILD_TEST_TMP="$(mktemp -d)"
          # PATH-shadow real claude and gh with mocks
          mkdir -p "$ZBUILD_TEST_TMP/bin"
          printf '#!/usr/bin/env bash\necho "{}"\nexit 0\n' > "$ZBUILD_TEST_TMP/bin/claude"
          printf '#!/usr/bin/env bash\necho "{}"\nexit 0\n' > "$ZBUILD_TEST_TMP/bin/gh"
          chmod +x "$ZBUILD_TEST_TMP/bin/claude" "$ZBUILD_TEST_TMP/bin/gh"
          export PATH="$ZBUILD_TEST_TMP/bin:$PATH"
          bash scripts/run-tests.sh --tier e2e

  golden:
    name: Golden contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run golden tier
        run: bash scripts/run-tests.sh --tier golden

  mutation-lint:
    name: Mutation docs lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run mutation doc validation
        run: bash scripts/run-tests.sh --tier mutation

  lint-no-hardcoded-models:
    name: Lint (no hardcoded model names — ADR-003)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Reject hardcoded model names
        run: |
          # Fail if any hardcoded model names found (ADR-003)
          count=$(grep -rEn 'claude-haiku|claude-sonnet|claude-opus|gpt-[0-9]|llama-[0-9]|mistral-' \
            core/ plugins/ scripts/ \
            --include="*.sh" --include="*.yaml" --include="*.json" \
            --exclude-dir=".git" | wc -l | tr -d ' ')
          if [[ "$count" -gt 0 ]]; then
            echo "ERROR: $count hardcoded model name(s) found (ADR-003 violation)"
            grep -rEn 'claude-haiku|claude-sonnet|claude-opus|gpt-[0-9]|llama-[0-9]|mistral-' \
              core/ plugins/ scripts/ --include="*.sh" --include="*.yaml" --include="*.json"
            exit 1
          fi
          echo "OK: no hardcoded model names in core/plugins/scripts"

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [unit, integration]
    steps:
      - uses: actions/checkout@v6
      - name: Install kcov
        run: |
          sudo apt-get install -y cmake g++ libdw-dev libssl-dev libcurl4-openssl-dev python3
          git clone --depth=1 https://github.com/SimonKagstrom/kcov.git /tmp/kcov-src
          cmake -S /tmp/kcov-src -B /tmp/kcov-build
          sudo cmake --build /tmp/kcov-build --target install -j"$(nproc)"
      - name: Run coverage (unit tests)
        run: |
          export ZBUILD_TEST_TMP="$(mktemp -d)"
          if command -v kcov >/dev/null 2>&1; then
            kcov --include-path=core,scripts/lib coverage-out bash scripts/run-tests.sh --tier unit || true
            echo "Coverage run complete"
          else
            echo "kcov not available — skipping coverage measurement"
          fi
      - name: Enforce coverage floor (issue #372)
        env:
          COVERAGE_FLOOR: "70"
        run: |
          # Coverage floor: core/ + scripts/lib/ statement coverage must be ≥ COVERAGE_FLOOR %.
          # Unit tests only — integration tests are timing-sensitive under kcov instrumentation.
          # Threshold is locked at merge time; documented in CLAUDE.md.
          report="$(find coverage-out -name 'coverage.json' 2>/dev/null | head -1)"
          if [[ -z "$report" || ! -f "$report" ]]; then
            echo "Coverage report not found — kcov may not be installed or failed"
            exit 0
          fi
          echo "Using report: $report"
          pct="$(python3 -c "
          import json
          d = json.load(open('$report'))
          if 'percent_covered' in d:
              print(d['percent_covered'])
          elif isinstance(d.get('total'), dict) and 'percent_covered' in d['total']:
              print(d['total']['percent_covered'])
          else:
              print('0')
          " 2>/dev/null || echo "0")"
          pct_int="${pct%%.*}"
          echo "Coverage: ${pct}% (floor: ${COVERAGE_FLOOR}%)"
          if [[ "$pct_int" -lt "$COVERAGE_FLOOR" ]]; then
            echo "ERROR: coverage ${pct}% is below the ${COVERAGE_FLOOR}% floor (issue #372)"
            exit 1
          fi
          echo "OK: coverage ${pct}% >= ${COVERAGE_FLOOR}%"

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [smoke, lint, unit, integration, e2e-mocked, golden, mutation-lint, lint-no-hardcoded-models, coverage]
    if: always()
    steps:
      - uses: actions/checkout@v6
      - name: Write job summary
        run: |
          echo "## Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tier | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| smoke | ${{ needs.smoke.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| lint | ${{ needs.lint.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| unit | ${{ needs.unit.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| integration | ${{ needs.integration.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| e2e-mocked | ${{ needs.e2e-mocked.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| golden | ${{ needs.golden.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| mutation-lint | ${{ needs.mutation-lint.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| lint-no-hardcoded-models | ${{ needs.lint-no-hardcoded-models.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| coverage | ${{ needs.coverage.result }} |" >> "$GITHUB_STEP_SUMMARY"
