    body: |
      auto-memory-hook.mjs equivalent. SessionStart restores conversation
      memory; SessionEnd flushes new patterns to AgentDB. Required for the
      'pick up where you left off' developer experience.

      ---

      ## ADR-011 / §6.5 cross-reference

      This hook restores **Learning Memory** (patterns, embeddings, skill
      scores from previous pipelines) per
      [ADR-011](../../docs/adr/ADR-011-pluggable-backends.md). It is **NOT**
      Pipeline-Resume Memory (which is handled by bootstrap-cache per
      [ADR-010](../../docs/adr/ADR-010-ci-cli-parity.md) and #209). The
      restoration is backend-agnostic: works the same with sqlite default
      (#216) or ruflo optional (#217) via the `memory_search` contract.
