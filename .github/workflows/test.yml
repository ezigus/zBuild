name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install bash 5 (Ubuntu ships with 5.x already)
        run: bash --version

      - name: Install jq + shellcheck
        run: sudo apt-get install -y jq shellcheck

      - name: zbuild --version
        run: ./scripts/zbuild --version

      - name: zbuild --help
        run: ./scripts/zbuild --help

      - name: Legacy sentinel guard refuses to run
        run: |
          set +e
          bash legacy/scripts/sw status
          status=$?
          if [[ $status -ne 64 ]]; then
            echo "ERROR: legacy sw should have exited 64 (sentinel), got $status"
            exit 1
          fi
          echo "OK: legacy sentinel guard works"

      - name: Shellcheck
        # SC1091 (info: couldn't follow sourced file) is excluded because we
        # use dynamic source paths that shellcheck can't statically resolve.
        # Severity floor: warning. Info-level findings don't fail CI.
        run: |
          shellcheck --severity=warning scripts/zbuild
          shellcheck --severity=warning scripts/lib/helpers.sh
          shellcheck --severity=warning scripts/lib/compat.sh
          shellcheck --severity=warning install.sh
          shellcheck --severity=warning core/redaction/scope-redaction.sh
          shellcheck --severity=warning core/state/atomic.sh
          shellcheck --severity=warning core/state/resume.sh
          shellcheck --severity=warning core/plugin-registry/registry.sh
          shellcheck --severity=warning core/event-bus/event-bus.sh
          shellcheck --severity=warning plugins/agent/security-lens/plugin.sh
          shellcheck --severity=warning scripts/generate-issues.sh

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install jq
        run: sudo apt-get install -y jq
      - name: Run unit tests
        run: |
          if [[ -x tests/run-unit.sh ]]; then
            bash tests/run-unit.sh
          else
            echo "tests/run-unit.sh not yet implemented (Phase 0 step 5+)"
          fi
