id: design
name: Design Stage
kind: agent
version: 0.1.0
description: |
  Design stage agent. Reads plan.json produced by the plan stage and invokes
  the LLM (T2) to produce an ADR-style design.md containing a fenced ```scope
  block whose entries are a superset of plan.json's files[]. The scope block
  becomes the authoritative scope source consumed by the build stage.
  # legacy-citation: pipeline-stages-intake.sh:1004 (stage_design)
  # legacy-citation: pipeline-stages.sh:38-71 (_extract_scope_from_design)

hooks:
  run: design_stage_run
requires:
  core:
    - redaction
    - event-bus
    - state
    - router
  plugins: []

provides:
  role: designer
  result_contract: 3
  # ADR-001 §"Declared events" (#1717) — this plugin's own events, composed into
  # the engine's known set at load. Adding one here needs no engine-config edit.
  events:
    - design.stray.conflict
    - design.stray.recovered
    - design.timeout.design_kept
    - design.timeout.no_design

config:
  tier_default: T2
  router:
    timeout_s: 600
    max_turns: 45

outputs:
  - id: design
    path: "${artifact_dir}/design.md"
    type: design.md@1
    format: markdown
    required: true
  # ADR-054 §5 (#1844): the v2 result file is the primary output, so the engine
  # reads design's verdict, disposition and reason (a timed-out design is seen
  # as timed_out, not as "design.md present"). Written on every exit and cleared
  # at the start of every run (plugin.sh), so it is never stale.
  - id: design_result
    path: "${artifact_dir}/design-verdict.json"
    type: design-verdict.json@1
    format: json
    required: true
    primary: true
  # ADR-055 §9: this stage's statement of what it DID. required:true —
  # written on every terminal verdict, so absence means something went wrong.
  - id: design_summary
    path: "${artifact_dir}/design-summary.md"
    type: design-summary.md@1
    format: markdown
    required: true
    summary: true
state:
  persisted: []
  reconstructed: []
