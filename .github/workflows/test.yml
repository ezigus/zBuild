name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    name: Smoke (CLI sanity + legacy sentinel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: CLI sanity
        run: |
          bash scripts/zbuild --version
          bash scripts/zbuild --help
      - name: Legacy sentinel
        run: bash legacy/scripts/sw 2>&1 | grep -q "disabled" || exit 1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Forbidden model names (ADR-003)
        # ONE definition, shared with `npm run lint` (#1682). Do not inline the
        # grep here again — the duplicate copies are what drifted.
        run: bash scripts/lib/lint-model-names.sh
      - name: Shellcheck (.sh files)
        if: always()
        run: |
          sudo apt-get install -y shellcheck
          find scripts core plugins -name '*.sh' -not -path '*/legacy/*' -print0 \
            | xargs -0 shellcheck -x --severity=warning
        # -x matches `npm run lint` (#1682): follow `source` directives so a
        # sourced-only defect cannot pass CI and fail locally, or vice versa.

  unit:
    name: Unit tests
    # B1b (#995): run the unit tier on Linux AND macOS to catch BSD-vs-GNU and
    # Bash-3.2-vs-5 divergences invisible to Linux-only CI. Unit tier only (cost);
    # mutation/e2e stay Linux. fail-fast: false so a macOS-only failure still lets
    # the ubuntu leg report (and vice versa).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Ensure Bash 5 + flock + coreutils (macOS)
        if: runner.os == 'macOS'
        # macOS ships Bash 3.2 (suite needs Bash 5, install.sh), no `flock` (the
        # local-fs claim backend needs it), and no `timeout` — coreutils provides
        # `gtimeout`, which scripts/run-tests.sh uses to bound a hung test file
        # (without it the per-file timeout silently no-ops and a hang runs forever,
        # #996). Clean runners lack all three. Mirror
        # install.sh's macOS prereqs so the unit tier runs the same on both OSes.
        run: |
          brew install bash flock coreutils
          # Prepend Homebrew's bin so subsequent run: steps deterministically use
          # Bash 5 — PATH precedence vs the system /bin/bash 3.2 varies across
          # macOS runner images/arches (Copilot review #1031).
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          bash --version | head -1
      - name: Run unit tier
        run: |
          # Explicit mktemp template (cf. core/router/route.sh:823): macOS's
          # templateless `mktemp -d` ignores $TMPDIR and uses /var/folders, so an
          # explicit template keeps the temp dir consistent across OSes (#1031).
          export ZBUILD_TEST_TMP="$(mktemp -d "${TMPDIR:-/tmp}/zbuild-unit.XXXXXX")"
          # #629: `| tee` masks the script's non-zero exit under GHA's default
          # `bash -e {0}` (no pipefail). Use PIPESTATUS to preserve test rc.
          bash scripts/run-tests.sh --tier unit 2>&1 | tee /tmp/zbuild-unit-results.txt
          exit "${PIPESTATUS[0]}"
        env:
          ZBUILD_TEST_TMP: ""
          ZBUILD_TEST_TIMING_FILE: /tmp/zbuild-unit-timing.txt
      - name: Upload unit results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          # Per-OS name: two matrix legs uploading the same artifact name collide
          # on upload-artifact@v4+. Nothing downloads this (coverage re-runs).
          name: unit-results-${{ matrix.os }}
          path: |
            /tmp/zbuild-unit-results.txt
            /tmp/zbuild-unit-timing.txt
          if-no-files-found: ignore

  integration:
    name: Integration tests
    # B1c (#996): run the integration tier on Linux AND macOS now that it is
    # parallel + hermetic (A3d #991, which bounds macOS runner-minutes) and the
    # OS-gating helpers exist (B1a #994). The integration tier exercises the
    # subprocess/flock/mktemp/signal surface where BSD-vs-GNU divergences bite,
    # so it's worth the same matrix the unit job already runs (B1b #995).
    # fail-fast: false so a macOS-only failure still lets ubuntu report (and vice versa).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Ensure Bash 5 + flock + coreutils (macOS)
        if: runner.os == 'macOS'
        # macOS ships Bash 3.2 (suite needs Bash 5, install.sh), no `flock` (the
        # local-fs claim backend needs it), and no `timeout` — coreutils provides
        # `gtimeout`, which scripts/run-tests.sh uses to bound a hung test file
        # (without it the per-file timeout silently no-ops and a hang runs forever,
        # #996). Clean runners lack all three. Mirror
        # install.sh's macOS prereqs so the tier runs the same on both OSes.
        run: |
          brew install bash flock coreutils
          # Prepend Homebrew's bin so subsequent run: steps deterministically use
          # Bash 5 — PATH precedence vs the system /bin/bash 3.2 varies across
          # macOS runner images/arches (Copilot review #1031).
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          bash --version | head -1
      - name: Run integration tier
        run: |
          # Explicit mktemp template (cf. the unit job, #1031): macOS's
          # templateless `mktemp -d` ignores $TMPDIR and uses /var/folders, so an
          # explicit template keeps the temp dir consistent across OSes.
          export ZBUILD_TEST_TMP="$(mktemp -d "${TMPDIR:-/tmp}/zbuild-integration.XXXXXX")"
          # #629: `| tee` masks the script's non-zero exit under GHA's default
          # `bash -e {0}` (no pipefail). Use PIPESTATUS to preserve test rc.
          bash scripts/run-tests.sh --tier integration 2>&1 | tee /tmp/zbuild-integration-results.txt
          exit "${PIPESTATUS[0]}"
        env:
          ZBUILD_TEST_TIMING_FILE: /tmp/zbuild-integration-timing.txt
      - name: Upload integration results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          # Per-OS name: two matrix legs uploading the same artifact name collide
          # on upload-artifact@v4+ (cf. the unit job).
          name: integration-results-${{ matrix.os }}
          path: |
            /tmp/zbuild-integration-results.txt
            /tmp/zbuild-integration-timing.txt
          if-no-files-found: ignore

  e2e-mocked:
    name: E2E (mocked)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run e2e tier (mocked claude+gh)
        run: |
          export ZBUILD_TEST_TMP="$(mktemp -d)"
          # PATH-shadow real claude and gh with mocks
          mkdir -p "$ZBUILD_TEST_TMP/bin"
          printf '#!/usr/bin/env bash\necho "{}"\nexit 0\n' > "$ZBUILD_TEST_TMP/bin/claude"
          printf '#!/usr/bin/env bash\necho "{}"\nexit 0\n' > "$ZBUILD_TEST_TMP/bin/gh"
          chmod +x "$ZBUILD_TEST_TMP/bin/claude" "$ZBUILD_TEST_TMP/bin/gh"
          export PATH="$ZBUILD_TEST_TMP/bin:$PATH"
          bash scripts/run-tests.sh --tier e2e

  golden:
    name: Golden contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run golden tier
        run: bash scripts/run-tests.sh --tier golden

  mutation-lint:
    name: Mutation docs lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run mutation doc validation
        run: |
          output="$(bash scripts/run-tests.sh --tier mutation 2>&1)" && rc=0 || rc=$?
          echo "$output"
          score_line="$(echo "$output" | grep '^mutation:' | tail -1)"
          if [[ -n "$score_line" ]]; then
            echo "## Mutation Pass-Rate" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "\`$score_line\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $rc

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [unit, integration]
    steps:
      - uses: actions/checkout@v7
      - name: Run coverage (unit tests)
        env:
          # Floor is 25% — reflects measured baseline (kcov never produced data).
          # Raised to 29% in Wave 4 (#372). Target: 70% after further test depth work.
          COVERAGE_FLOOR: "29"
        run: bash scripts/check-coverage.sh

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [smoke, lint, unit, integration, e2e-mocked, golden, mutation-lint, coverage]
    if: always()
    steps:
      - uses: actions/checkout@v7
      - name: Write job summary
        run: |
          echo "## Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tier | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| smoke | ${{ needs.smoke.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| lint | ${{ needs.lint.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| unit | ${{ needs.unit.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| integration | ${{ needs.integration.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| e2e-mocked | ${{ needs.e2e-mocked.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| golden | ${{ needs.golden.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| mutation-lint | ${{ needs.mutation-lint.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| coverage | ${{ needs.coverage.result }} |" >> "$GITHUB_STEP_SUMMARY"
