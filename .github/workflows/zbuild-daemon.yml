name: zbuild daemon (label-triggered pipeline)
run-name: "zbuild · issue #${{ github.event.issue.number }} — ${{ github.event.issue.title }}"

# Daemon-in-Actions mode — issue #92.
#
# Watches for issues labeled `zbuild-run` and invokes the reusable
# zbuild-pipeline workflow automatically.  After the pipeline completes
# (success or failure) the label is removed so the issue can be re-triggered
# by adding the label again, and a comment with the run URL is posted.
#
# The trigger label is configurable via the ZBUILD_TRIGGER_LABEL env var.
# Model selection is governed by config/models.json + core/router — no model
# names are hardcoded here (ADR-003).
#
# Debugging note: this file is usually NOT the problem. It calls
# zbuild-pipeline.yml, and an error THERE (a duplicate key, a `runner.*`
# expression at job level) makes GitHub reject the composition at STARTUP — the
# run reports `failure` with ZERO jobs, no step logs, and no annotation naming a
# cause. The Actions list then shows this workflow by PATH instead of by name,
# because the name could not be read. Both symptoms point here while the fault
# is in the called workflow; check that one first, and `actionlint` both
# (tests/unit/write-boundary-diagnostic-wired-test.sh SPEC-7 gates it).

on:
  issues:
    types: [labeled]

env:
  ZBUILD_TRIGGER_LABEL: zbuild-run

permissions:
  contents: write # pr-open pushes the work branch (CI-3 #1002)
  issues: write
  pull-requests: write

# ─── Job 1: guard — only proceed when the correct label was applied ───────────
jobs:
  trigger:
    name: "Trigger guard — check label"
    runs-on: ubuntu-latest
    if: github.event.label.name == 'zbuild-run'
    outputs:
      issue_number: ${{ github.event.issue.number }}
    steps:
      - name: Confirm trigger label matched
        run: |
          echo "Issue #${{ github.event.issue.number }} labeled '${{ github.event.label.name }}' — proceeding."

  # ─── Job 2: run the reusable zbuild pipeline ─────────────────────────────────
  pipeline:
    name: "Pipeline — issue #${{ needs.trigger.outputs.issue_number }}"
    needs: trigger
    uses: ./.github/workflows/zbuild-pipeline.yml
    with:
      issue_number: ${{ fromJson(needs.trigger.outputs.issue_number) }}
      dry_run: false
      # Label-triggered runs use the `simple` template: it wraps build+test in
      # build_test_cycle (max_iterations:3), so a test failure (e.g. the #1015
      # SIGPIPE guard catching a generated test) feeds back to build for a fix
      # instead of aborting, and emits #972's merge-readiness report. (The old
      # `standard` template was retired; #976's objective build↔test convergence
      # landed in `simple`, so it is now the self-healing default.)
      template: simple
    secrets: inherit

  # ─── Job 3: post-run cleanup — remove label and post comment ─────────────────
  post-run:
    name: "Post-run — remove label + comment"
    needs: pipeline
    runs-on: ubuntu-latest
    # Run when the pipeline FAILED (so the label is still removed), but NOT when
    # it was SKIPPED. `always()` fires on a skipped dependency too, and this
    # workflow triggers on ANY label added to ANY issue — so every unrelated
    # label change ran this job, stripped the `zbuild-run` trigger, and commented
    # that the pipeline had ended `skipped` on an issue where nothing ran.
    # Observed on #1957, #1959 and #1961 (#1966 F4).
    if: always() && needs.pipeline.result != 'skipped'
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      PIPELINE_RESULT: ${{ needs.pipeline.result }}
      ABORT_REASON: ${{ needs.pipeline.outputs.abort_reason }}
      ABORT_DETAIL: ${{ needs.pipeline.outputs.abort_detail }}
    steps:
      # #2145: the run-status comment's tail loop dies with the pipeline job at
      # the 360-minute ceiling and leaves the header saying "running". This
      # step needs the renderer from the engine checkout to finish it.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/lib
          sparse-checkout-cone-mode: false

      - name: Finalize the run-status comment
        # Advisory: a comment that cannot be finalized never fails the job.
        run: |
          source scripts/lib/run-status-comment.sh
          # #2166: `cancelled` is GitHub's word for the ceiling AND for a hand
          # cancel; the run's start time lets the renderer tell them apart.
          STARTED="$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" --jq '.run_started_at // empty' 2>/dev/null || true)"
          echo "STARTED=${STARTED}" >> "$GITHUB_ENV"
          rsc_finalize_issue "$RUNNER_TEMP" "${{ github.repository }}" "${ISSUE_NUMBER}" "${PIPELINE_RESULT}" "${STARTED}" || true

      - name: Remove zbuild-run label
        run: |
          gh api \
            --method DELETE \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/labels/zbuild-run" \
            || echo "Label already removed or not present — continuing."

      - name: Post run-completion comment
        # #2330 (ADR-068 §8): the comment says why the run ended and names each
        # open item with what would settle it, in plain words — never a bare
        # result word or the engine's codes. One builder, tested on its own.
        env:
          OPEN_ITEMS: ${{ needs.pipeline.outputs.open_items }}
          END_WORDS: ${{ needs.pipeline.outputs.end_words }}
        run: |
          source scripts/lib/run-open-items.sh
          source scripts/lib/run-status-comment.sh
          body="$(run_completion_body "$PIPELINE_RESULT" "$ABORT_REASON" "$ABORT_DETAIL" "$RUN_URL" "${STARTED:-}" "${OPEN_ITEMS:-}" "${END_WORDS:-}")"
          gh issue comment "${ISSUE_NUMBER}" \
            --repo "${{ github.repository }}" \
            --body "$body"
