id: standard
name: Standard Pipeline
extends: null
defaults:
  strategy: fanout

# ─── Flow ───────────────────────────────────────────────────────────────
# Top-level execution order. Per ADR-027 (recursive flow format), `flow:`
# is the single ordered stage list and every ID below resolves to a
# top-level stage section. Cycles are first-class stages — `review_cycle`
# is the outer review-remediation cycle (ADR-026) whose own `flow:`
# references `build_test_cycle` (the inner build/test convergence cycle)
# and `review` (the LLM verdict gate, ADR-019). Both `build_test_cycle`
# and `review` remain top-level sections below; `review_cycle` references
# them by ID per ADR-027's recursive symmetry rule.
flow:
  - intake
  - plan_impact_cycle
  - review_cycle

# ─── intake (leaf) ──────────────────────────────────────────────────────
intake:
  gate: auto
  roles: [intake]
  io:
    destinations: [file, stdout]
    tail_lines: 200

# ─── plan_impact_cycle (Wave 19-J, #744) ────────────────────────────────
# Wraps plan + impact in a 3-iter cycle. impact verifies plan.files[] is
# scope-complete (no missing test/config files that exercise modified
# surfaces). On verdict=incomplete, the cycle re-runs plan with the prior
# impact's gap report as feedback via prior_impact_feedback.txt. On
# verdict=complete OR max_iterations=3 with on_max=continue, the cycle
# exits and the downstream review_cycle runs.
plan_impact_cycle:
  type: cycle
  # Members: plan (LLM: strategic decomposition) + impact (LLM: dependency
  # tracing + scope-completeness check). Comments stay outside the YAML list
  # because the template parser's awk doesn't strip inline `#` comments.
  flow:
    - plan
    - impact
  exit_when:
    stage: impact
    field: verdict
    op: eq
    value: complete
  max_iterations: 3
  on_max: continue
  feedback:
    - from:
        stage: impact
        output: impact_feedback_md
      to:
        stage: plan
        input: prior_impact_feedback
        required: false

# ─── plan (leaf, cycle member) ──────────────────────────────────────────
plan:
  gate: auto
  roles: [planner]
  io:
    destinations: [file, stdout]
    tail_lines: 200
  router:
    timeout_s: 300
    max_turns: 25

# ─── impact (leaf, cycle member) ────────────────────────────────────────
impact:
  gate: auto
  roles: [impact_analyzer]
  io:
    destinations: [file, stdout]
    tail_lines: 200
  router:
    timeout_s: 180
    # #763: raised from 20 → 25 to match template-wide norm. impact does
    # open-ended symbol tracing whose cost scales with the symbol count;
    # the 20-turn cap was the lowest in the template and had no rationale
    # for being lower than other read-only stages. Hitting the cap produces
    # subtype=error_max_turns surfaced to the operator (per #762), but the
    # operator pain is wasted iters and re-runs — raising the floor avoids
    # that on legitimately large-PR symbol-tracing work.
    max_turns: 25

# ─── review_cycle (outer remediation cycle, ADR-026) ────────────────────
# Outer cycle wrapping the inner build_test_cycle + the review stage. On
# review.verdict=approve, exit_when fires and control returns to the next
# sibling in the OUTER scope's flow (none — pipeline ends successfully).
# On review.verdict=block, abort_when fires (rc=6 cycle_abort, ADR-025) and
# propagates outward to terminate the pipeline. On review.verdict=
# request_changes, the cycle re-iterates: the inner build_test_cycle re-
# runs, this time with the prior review.review_md piped to build's
# prior_review_feedback input via the feedback edge below (consumed by
# plugins/agent/build whose manifest declares the matching source:
# cycle_feedback input — Wave 18-B). max_iterations: 2 caps worst-case
# remediation spend; on_max: continue matches ADR-019's fall-through to
# operator (the unconverged verdict still records, the pipeline ends with
# _RUNNER_CYCLE_UNCONVERGED set per ADR-021 v2 #527/#528). Plan is NOT
# wrapped — re-running plan on review feedback is a deferred decision
# (ADR-026 Alternative (c)).
#
# NB (Wave 18-B): the feedback `to:` MUST use block form. The Wave 17-B
# template translator (_tpl_translate_new_shape, core/pipeline/template.sh)
# handles block form of `to:` (multi-line stage/input/required) but does
# NOT yet handle the inline single-line `to: { stage, input, required }`
# form. Using inline form here would silently drop the feedback edge.
# Today's build_test_cycle below uses inline `from:` (handled) + block
# `to:` (handled); review_cycle follows the same convention.
review_cycle:
  type: cycle
  flow:
    - build_test_cycle
    - review
  exit_when:
    stage: review
    field: verdict
    op: eq
    value: approve
  abort_when:
    stage: review
    field: verdict
    op: eq
    value: block
  max_iterations: 2
  on_max: continue
  feedback:
    - from:
        stage: review
        output: review_md
      to:
        stage: build
        input: prior_review_feedback
        required: false

# ─── build_test_cycle (cycle stage with mini-flow) ──────────────────────
# ADR-021 + ADR-022 (#568): build/test/test_assessment outer cycle. The cycle
# converges on the LLM-issued test_assessment verdict (Pattern 1 stage from
# #567), not on the raw test rc. When the assessment is not `pass`, the cycle
# re-enters build with the prior assessment markdown injected as a prompt
# preamble (wired via `feedback.to.input=prior_test_assessment`, consumed by
# `plugins/agent/build` whose manifest declares the matching `source:
# cycle_feedback` input — renamed in #571). On termination via max_iterations,
# plateau, or divergence, the runner CONTINUES to review so the ADR-019
# fail-closed gate runs as the final arbiter.
# ADR-027 (#704): cycle is declared as a top-level stage section with
# `type: cycle` and its own `flow:` listing member stage IDs. Member stages
# (build, test, test_assessment) live as their own top-level sections below
# — recursive symmetry, one language. The `until:` predicate from ADR-021 v2
# is renamed `exit_when:` to make the break-out contract explicit (it ends
# THIS cycle and returns control to the next sibling in the outer `flow:`).
build_test_cycle:
  type: cycle
  flow:
    - build
    - test
    - test_assessment
  exit_when:
    stage: test_assessment
    field: verdict
    op: eq
    value: pass
  max_iterations: 3
  on_max: continue
  feedback:
    - from:
        stage: test_assessment
        output: test_assessment_md
      to:
        stage: build
        input: prior_test_assessment
        required: false

# ─── build (leaf, cycle member) ─────────────────────────────────────────
build:
  gate: auto
  roles: [builder]
  io:
    destinations: [file, stdout]
    tail_lines: 200
  router:
    timeout_s: 900
    # ADR-018 sentinel amendment (Wave 19-M, #762): 0 = omit --max-turns flag.
    # Build is the only stage that mutates files via Edit/Write/Bash; tool
    # budget scales with the plan's file count. Dogfood #754 hit the 25
    # ceiling at 10K output tokens / $1.21 cost. Defer to claude CLI default.
    max_turns: 0

# ─── test (leaf, cycle member) ──────────────────────────────────────────
test:
  gate: auto
  roles: [tester]
  io:
    destinations: [file, stdout]
    tail_lines: 200

# ─── test_assessment (leaf, cycle member) ───────────────────────────────
test_assessment:
  gate: auto
  roles: [test_assessment]
  io:
    destinations: [file, stdout]
    tail_lines: 200
  router:
    timeout_s: 300
    max_turns: 25

# ─── review (leaf) ──────────────────────────────────────────────────────
review:
  gate: auto
  roles: [reviewer]
  io:
    destinations: [file, stdout]
    tail_lines: 200
  router:
    timeout_s: 300
    max_turns: 25
