      kill-on-shutdown, restart-on-crash. Required for #26 (memory recall) to
      work reliably. Legacy: ruflo-adapter.sh lifecycle helpers.
  - id: ruf-2
    title: "[Phase 1] Ruflo MCP bridge wrapper (ruflo-mcp-call.sh)"
    milestone: "Phase 1 — Pipeline & Intelligence"
    labels: [phase-1, keeper]
    body: |
      Shell wrapper that handles MCP request/response framing, timeouts,
      retries. Single chokepoint for all ruflo calls (similar to redaction
      chokepoint pattern).
  - id: ruf-3
    title: "[Phase 1] Ruflo timeout / fault tolerance (circuit breaker)"
    milestone: "Phase 1 — Pipeline & Intelligence"
    labels: [phase-1, keeper]
    body: |
      Open circuit on repeated ruflo failures; fall back to native TF-IDF
      memory recall. Emit ruflo.degraded event; recover when ruflo comes back.
      Avoids cascading failure when MCP layer is flaky.
  - id: ruf-4
    title: "[Phase 1] Ruflo per-repo namespace isolation (zbuild-* vs legacy shipwright-*)"
    milestone: "Phase 1 — Pipeline & Intelligence"
