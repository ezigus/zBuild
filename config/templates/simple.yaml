id: simple
name: Simple Pipeline
extends: null

# ADR-037 §4: per-template merge policy. Wired to runtime behavior in #975.
merge_policy: auto_unless_flagged

defaults:
  strategy: fanout

# ─── Flow ────────────────────────────────────────────────────────────────────
# Flat 7-stage simplified pipeline (ADR-037 EPIC #966 I2).
# Omits: impact, test_assessment, acceptance-gate, cq-* stages (targeted for
# removal in #979). Starts closer to the intended final shape so subsequent
# issues (#969-#979) can build the new pipeline here while standard.yaml
# continues to serve production.
#
# Future insertion points (per ADR-037 §3):
#   After plan:   objective-gate stages land here (#969, #970, #971)
#   After test:   evidence-fed review stages land here (#972, #973, #974)
flow:
  - intake
  - plan
  # TODO #969: insert objective-gate (pre-build) here
  - design
  - build
  - test
  # TODO #972: insert evidence-collection stage here
  - review
  - pr

# ─── intake (leaf) ───────────────────────────────────────────────────────────
intake:
  gate: auto
  roles: [intake]
  io:
    destinations: [file, stdout]
    tail_lines: 200

# ─── plan (leaf) ─────────────────────────────────────────────────────────────
plan:
  gate: auto
  roles: [planner]
  io:
    destinations: [file, stdout]
    tail_lines: 200
  router:
    timeout_s: 300
    max_turns: 25

# ─── design (leaf) ───────────────────────────────────────────────────────────
design:
  gate: auto
  roles: [designer]
  io:
    destinations: [file, stdout]
    tail_lines: 200
  router:
    timeout_s: 600
    max_turns: 0

# ─── build (leaf) ────────────────────────────────────────────────────────────
build:
  gate: auto
  roles: [builder]
  io:
    destinations: [file, stdout]
    tail_lines: 200
  router:
    timeout_s: 900
    max_turns: 0

# ─── test (leaf) ─────────────────────────────────────────────────────────────
test:
  gate: auto
  roles: [tester]
  io:
    destinations: [file, stdout]
    tail_lines: 200

# ─── review (leaf) ───────────────────────────────────────────────────────────
# TODO #974: wire evidence-fed review inputs here
review:
  gate: auto
  roles: [reviewer]
  io:
    destinations: [file, stdout]
    tail_lines: 200
  router:
    timeout_s: 300
    max_turns: 25

# ─── pr (leaf) ───────────────────────────────────────────────────────────────
# T0 tool stage (ADR-013): opens the pull request; no LLM call.
pr:
  gate: auto
  roles: [pr]
  io:
    destinations: [file, stdout]
    tail_lines: 200
