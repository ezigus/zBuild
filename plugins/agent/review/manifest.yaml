id: review
name: Review Stage
kind: agent
version: 0.1.0
description: |
  Review stage agent. Examines the diff against the plan and test results to
  produce a structured verdict: approve, request_changes, or block. Closes the
  plan -> build -> test -> review loop before a PR is opened.

hooks:
  init: review_init
  run: review_run
  finalize: review_finalize
  cleanup: review_cleanup

requires:
  core:
    - redaction
    - event-bus
    - state
    - router
  plugins: []

provides:
  artifact_type: review.json
  schema_version: 1

config:
  tier_default: T2
  valid_verdicts:
    - approve
    - request_changes
    - block

inputs:
  - id: scope_manifest
    type: file
    source: stage:intake
    required: true
  # 843-I (#924): review degrades to diff-only when plan.json is absent
  # (plugin.sh: "using empty"), so the contract is honestly optional rather
  # than required:true with silent degradation (prior contract-code mismatch).
  - id: plan
    type: file
    path: "${artifact_dir}/plan.json"
    source: stage:plan
    required: false
  - id: diff_patch
    type: file
    path: "${artifact_dir}/diff.patch"
    source: stage:build
    required: true
  - id: test_results
    type: file
    path: "${artifact_dir}/test-results.json"
    source: stage:test
    required: true
  # ADR-020 / #663: review consumes test-assessment.json when present (see
  # plugin.sh:78); optional because graceful fallback to test-results.json
  # exists when test_assessment stage is not wired into the template.
  - id: test_assessment
    type: file
    path: "${artifact_dir}/test-assessment.json"
    source: stage:test_assessment
    required: false
  # Wave 19-G (#739): the original issue body (intake.md). Review checks
  # the diff against the issue's Definition of done — not just the plan.
  # Optional so direct _review_run_inner callers (tests) and flows where
  # intake.md isn't populated still produce the legacy prompt shape.
  - id: intake_goal
    type: file
    path: "${state_dir}/intake.md"
    source: stage:intake
    required: false

outputs:
  - id: review
    path: "${artifact_dir}/review.json"
    type: review.json
    required: true
    # ADR-020 amendment (#507): primary output; .verdict drives indicator.
    primary: true
  # ADR-026 / Wave 18-B (#707): markdown rendering of review.json that the
  # outer review_cycle feeds back into build's prior_review_feedback input
  # via _cycle_apply_feedback. Mirrors test_assessment_md shape. Optional so
  # legacy templates that DO NOT wire review_cycle continue to work; the
  # review plugin always writes the file when review.json is written (the
  # rendering is cheap), but consumers that don't reference it pay nothing.
  - id: review_md
    path: "${artifact_dir}/review.md"
    type: markdown
    required: false

state:
  persisted:
    - last_verdict
    - last_issues_count
  reconstructed: []
