id: two-cycles
name: Two cycles fixture
extends: null
# Owned fixture (#979; renamed from route-back-cycles in #2271, which retired
# route_back). Tests that fully stub cycle_orchestrator_run/cycle_dispatch_stage
# key the mock on the dispatch-unit names — `design_impact_cycle` and a second
# cycle — so the template only needs to declare these two cycle dispatch units
# in order, after a leaf.
defaults:
  strategy: fanout

flow:
  - intake
  - plan
  - design_impact_cycle
  - build_review_cycle
  - pr

intake:
  roles: [intake]

plan:
  roles: [planner]

design_impact_cycle:
  type: cycle
  description: Discover post-design consequences until impact is complete
  flow:
    - design
    - impact
  exit_when:
    stage: impact
    field: verdict
    op: eq
    value: complete
  max_iterations: 3
  on_max: continue

build_review_cycle:
  type: cycle
  description: Build and review until approved
  flow:
    - build
    - review-aggregator
  exit_when:
    stage: review-aggregator
    field: verdict
    op: eq
    value: approve
  max_iterations: 3
  on_max: continue

design:
  roles: [designer]

impact:
  roles: [impact_analyzer]

build:
  roles: [builder]

review-aggregator:
  roles: [review_aggregator]

pr:
  roles: [pr]
