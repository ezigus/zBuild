  # ─── Phase 0.5 — MVP Pipeline (5 issues) ────────────────────────────────
  - id: mvp-1
    title: "[Phase 0.5] Pipeline runner (core/pipeline/runner.sh)"
    milestone: "Phase 0.5 — MVP Pipeline & Distribution"
    labels: [phase-0, foundation]
    state: closed
    closed_reason: |
      MVP runner shipped (core/pipeline/runner.sh, ~158 LoC). Body was
      revised post-merge to require ADR-009 role-based templates + resolver;
      that scope is tracked separately in #208 (mvp-1b). This issue closes
      as the MVP-skeleton portion complete.
    body: |
      Implement the orchestration loop that reads a pipeline template
      (config/templates/<name>.yaml), reads detected platforms from
      state/platforms.json, resolves each stage's roles → plugins via the
      ADR-009 resolver, and calls plugin hooks (init → run → finalize).

      Scope:
      - core/pipeline/runner.sh with run_pipeline(template, goal) entry point
      - Reads stage list from template YAML (role-based per ADR-009)
      - Reads state/platforms.json for detected platforms
      - Per stage: resolves roles via plat-3, dispatches per stage strategy
        (fanout / composite / sequential — see plat-9/10/11)
      - Handles failure: classifies via recovery-plugin, decides retry/abort
      - Writes state via core/state/atomic.sh on every stage transition
      - Emits pipeline.{start,end,abort} + stage.{start,complete,fail} events

      Minimal template (config/templates/security-audit.yaml):
        stages:
          - id: intake
            roles: [intake]
          - id: audit
            roles: [security-auditor]
            strategy: fanout
          - id: output
            roles: [findings-reporter]

      Dependencies: plat-1 (manifest fields), plat-2 (template schema),
      plat-3 (resolver). Otherwise plugin-registry + event-bus + state (done).

      Dependencies: plugin-registry (done), event-bus (done), state (done).
      Blocks: MVP-3, MVP-4, MVP-5.

      Tests: tests/core-pipeline-runner-test.sh with a fixture template
      and 2 mock plugins; verify hook ordering, state writes, event emission.
  - id: mvp-2
    title: "[Phase 0.5] Model router stub (core/router/route.sh)"
    milestone: "Phase 0.5 — MVP Pipeline & Distribution"
    labels: [phase-0, foundation]
    state: closed
    closed_reason: "Merged via PR #228 (2026-05-24). Delivered core/router/route.sh, config/models.json (ADR-003 schema T0-T4), and 18-assertion test suite. All CI green."
    body: |
      Phase 0.5 stub of the model router. Selects a model from
      config/models.json based on requested tier (T0-T4), shells out to the
      `claude` CLI with the (already-redacted) prompt, parses the response.

      Scope:
      - core/router/route.sh exporting route_to_model(tier, prompt) → response
      - Reads config/models.json (ADR-003 schema; minimal version OK)
      - Phase 0.5: no UCB1/Thompson; just pick first candidate in tier
      - Shells to `claude` CLI; logs model.route event
      - Returns raw response text (caller parses)

      Real UCB1 (#29) and Thompson (#30) routers replace the picker logic
      later; the shell-to-claude transport stays.

      Tests: tests/core-router-route-test.sh with a mocked `claude` binary
      via PATH-shadow (test-helpers pattern). Verify tier resolution, env
      passing, event emission.
  - id: mvp-3
    title: "[Phase 0.5] Intake stage plugin (plugins/agent/intake/)"
    milestone: "Phase 0.5 — MVP Pipeline & Distribution"
    labels: [phase-0, foundation, agent-plugin]
    state: closed
    closed_reason: "Merged via PR #230 (2026-05-24). Delivered plugins/agent/intake/ with goal sanitization (legacy sentinel port), platform-aware scope, injection guard, and 26-assertion test suite."
    body: |
      First STAGE of every pipeline run. Captures the goal (from --goal CLI
      arg or GitHub issue) and writes the initial state file + scope manifest.

      NOTE: Platform DETECTION happens in core/detect/ (plat-4), NOT here.
      By the time intake runs, state/platforms.json already exists. Intake
      reads it to default scope to detected-platform folders.

      Scope:
      - plugins/agent/intake/{manifest.yaml,plugin.sh,prompts/intake.md}
      - run() takes goal-text + optional issue-number, writes:
        - state/scope-manifest.md (fenced block; default = detected-platform
          folders, override via --scope flag, --platform-override forces all)
        - state/intake.md (sanitized goal via goal-sanitize)
      - Reads state/platforms.json for detected-platform folder defaults
      - Apply goal-sanitization sentinels at the capture boundary
      - Emit stage.complete with goal summary + platforms

      Dependencies: MVP-1 (runner), redaction chokepoint (done), plat-4 (detect).
      Blocks: MVP-5 (output needs intake state).

      Tests: tests/plugin-intake-test.sh with --goal "test goal" and
      verify state files created, sentinels applied, scope manifest readable.
    state: closed
    closed_reason: 'Closed via GitHub (live state: closed at 2026-05-25T00:29:01Z). Recorded by manifest-sync.'
