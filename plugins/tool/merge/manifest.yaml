id: merge
name: Auto-Merge Stage
kind: tool
version: 0.1.0
description: |
  Auto-merge tool plugin (ADR-037 §4, I9-B / #1050, I9-C / #1051). When
  merge_policy: auto is active and gate-aggregator-result.json verdict is pass,
  merges via `gh pr merge --squash --auto`. When merge_policy: auto_unless_flagged,
  pr-delivery additionally requires review-report.json merge_readiness to be ready
  or advisory before delegating here; absent review-report is fail-closed (PR path).
  Falls back to pr_open_run when gate is absent or verdict != pass. Refuses on main/master.
  No LLM dependency — T0 tool stage (ADR-013).

# #1849 (ADR-054/055 migration), recorded rather than implied:
#   - router budgets: none. T0 tool, no model call (ADR-037 §3), so there is no
#     router block to resolve from the manifest.
#   - cleanup: no hook. This plugin holds no live resource between calls; the
#     engine records the absence as plugin.cleanup.absent (#1823, #1829).
hooks:
  run: merge_run
requires:
  core:
    - event-bus
    - state

provides:
  result_contract: 2
  role: merge_executor
  events:
    - plugin.result

config:
  valid_verdicts:
    - pass
    - error
  tier_default: T0

inputs:
  - id: gate_aggregator_result
    required: false
  # #979 (EPIC #1277): the standard.yaml `review` stage was retired. Its
  # stage:review input dangled (no producing manifest) and tripped the
  # lint-contract data-dependency graph check. merge_run's ADR-001/#358
  # fail-closed guard still reads review.json BY PATH at runtime (absent →
  # route to the PR fallback path, which itself fail-closes) — behavior
  # unchanged; only the dead producer edge is removed from the contract graph.
  # #1849: gate_aggregator_result is read from the engine's index only — no
  # fallback path. review.json stays a by-path read for the reason above.

outputs:
  - id: merge_result
    path: ${artifact_dir}/merge-result.json
    type: merge-result.json@1
    format: json
    required: true
    primary: true
  - id: pr_url
    path: ${artifact_dir}/pr-url.txt
    type: pr-url.txt@1
    format: text
    required: false
  # ADR-055 §9: this stage's statement of what it DID. required:true —
  # written on every terminal verdict, so absence means something went wrong.
  - id: merge_summary
    path: "${artifact_dir}/merge-summary.md"
    type: merge-summary.md@1
    format: markdown
    required: true
    summary: true

state:
  persisted: []
  reconstructed: []
