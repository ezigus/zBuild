id: simple
name: Simple Pipeline
extends: null

# ADR-037 §4: per-template merge policy. Wired to runtime behavior in #975.
merge_policy: auto_unless_flagged

defaults:
  strategy: fanout

# ─── Flow ────────────────────────────────────────────────────────────────────
# 6-unit simplified pipeline (ADR-037 EPIC #966 I10 / #976).
# build, test, and objective-gate are wrapped in build_test_cycle, which exits
# when the T0 objective-gate returns verdict=pass (deterministic convergence
# signal — no LLM judgment). standard.yaml retains its test_assessment-driven
# cycle untouched (ABS-3).
#
# Dispatch units: intake, plan, design, build_test_cycle, review, pr.
# _TPL_STAGES still enumerates 8 leaf stages (cycle members expand individually).
flow:
  - intake
  - plan
  - design
  - build_test_cycle
  # #972: the `review` stage emits the evidence-fed multi-lens merge-readiness
  # report (no new flow stage — it is bound to a dedicated plugin by role).
  # #973 feeds each lens distinct mechanical evidence.
  - review
  - pr

# ─── build_test_cycle (cycle — EPIC #966 I10 / #976) ────────────────────────
# Wraps build + test + objective-gate in a convergence loop. Exits when the T0
# objective-gate returns verdict=pass (deterministic signal — no LLM judgment).
# On max_iterations=5 with on_max=continue, falls through to review so the
# advisory review stage still runs. velocity_plateau.window=2 abandons early
# when failure_count shows no improvement for 2 consecutive iters.
# scope_policy mirrors standard.yaml's build_test_cycle (ADR-030 / #840):
# auto-grant low-risk collateral, escalate structural asks, abandon on deny.
build_test_cycle:
  type: cycle
  description: Build and test loop until objective-gate passes
  flow:
    - build
    - test
    - objective-gate
  exit_when:
    stage: objective-gate
    field: verdict
    op: eq
    value: pass
  max_iterations: 5
  on_max: continue
  velocity_plateau:
    window: 2
  scope_policy:
    expandable: true
    auto_grant: [collateral_tests, collateral_config, collateral_docs]
    escalate: structural
    on_deny: abandon

# ─── intake (leaf) ───────────────────────────────────────────────────────────
intake:
  gate: auto
  roles: [intake]
  io:
    destinations: [file, stdout]
    tail_lines: 200

# ─── plan (leaf) ─────────────────────────────────────────────────────────────
plan:
  gate: auto
  roles: [planner]
  io:
    destinations: [file, stdout]
    tail_lines: 200
  router:
    timeout_s: 300
    max_turns: 25

# ─── objective-gate (leaf) ───────────────────────────────────────────────────
# T0 tool stage (ADR-013, ADR-037 §1, issue #969): runs the test suite +
# lint/shellcheck; hard-blocks on any failure; no LLM call.
objective-gate:
  gate: auto
  roles: [objective-gate]
  io:
    destinations: [file, stdout]
    tail_lines: 200

# ─── design (leaf) ───────────────────────────────────────────────────────────
design:
  gate: auto
  roles: [designer]
  io:
    destinations: [file, stdout]
    tail_lines: 200
  router:
    timeout_s: 600
    max_turns: 0

# ─── build (leaf) ────────────────────────────────────────────────────────────
build:
  gate: auto
  roles: [builder]
  io:
    destinations: [file, stdout]
    tail_lines: 200
  router:
    timeout_s: 900
    max_turns: 0

# ─── test (leaf) ─────────────────────────────────────────────────────────────
test:
  gate: auto
  roles: [tester]
  io:
    destinations: [file, stdout]
    tail_lines: 200

# ─── review (leaf) ───────────────────────────────────────────────────────────
# ADR-038 (#972): advisory multi-lens merge-readiness report. Bound by role to
# plugins/agent/review-report (provides.role: review_report) — NOT the legacy
# `review` verdict plugin (which standard.yaml still uses). Never coerces a
# merge decision; never hard-blocks. #974 rehomes the full cq+persona lens roster.
review:
  gate: auto
  roles: [review_report]
  io:
    destinations: [file, stdout]
    tail_lines: 200
  router:
    timeout_s: 300
    max_turns: 25

# ─── pr (leaf) ───────────────────────────────────────────────────────────────
# T0 tool stage (ADR-013): opens the pull request; no LLM call.
pr:
  gate: auto
  roles: [pr]
  io:
    destinations: [file, stdout]
    tail_lines: 200
