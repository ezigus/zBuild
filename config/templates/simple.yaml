id: simple
name: Simple Pipeline
extends: null

# ADR-037 §4: per-template merge policy. Wired to runtime behavior in #975.
merge_policy: auto_unless_flagged

defaults:
  strategy: fanout

# ─── Flow ────────────────────────────────────────────────────────────────────
# Simplified pipeline (ADR-037 EPIC #966 / ADR-040 EPIC #1129): 7 top-level flow
# units — intake, plan, design, build_test_cycle, review_lenses, review-aggregator,
# pr — where build_test_cycle groups the build/test leaves plus the decomposed
# mechanical gate stages, and review_lenses is the advisory lens group.
#
# I10-A..C historically wrapped build/test/objective-gate in build_test_cycle.
# B6 (#1138, ADR-040 — amends ADR-013/ADR-021/ADR-019; executes ADR-037 §6) CUT
# OVER convergence from the retired monolithic objective-gate to the composable
# mechanical gates + gate-aggregator; the objective-gate plugin was then removed
# in B7 (#1139). The single merge-blocking construct is the gate-aggregator
# verdict (ADR-040 §5), reached via the cycle's exit_when.
#
# C3 (#1142, ADR-040 §3 — supersedes ADR-038's single-stage fan-out; ADR-039
# parallel group; follows ADR-030 scope governance) CUTS OVER the lens side: the
# monolithic `review` stage (ADR-038's hand-rolled review-report fan-out, now
# UNREFERENCED here) is replaced by `review_lenses` — a `type: parallel`
# `aggregate: advisory` group of first-class lens stages — followed by
# `review-aggregator`, which merges the per-lens results into ONE advisory
# merge-readiness report. The lens group is ADVISORY: it NEVER feeds the cycle's
# exit_when/convergence (that remains the gate-aggregator, ADR-040 §5) and never
# blocks merge. The B5 no-LLM-on-convergence-path invariant therefore holds.
flow:
  - intake
  - plan
  - design
  - build_test_cycle
  - review_lenses
  - review-aggregator
  - pr

# ─── build_test_cycle (cycle) ────────────────────────────────────────────────
# B6 (#1138, ADR-040 §2/§5): the cycle re-runs build/test then the decomposed
# mechanical gates (shape-floor, acceptance-gate, lint, coverage, mutation,
# secret-scan) and finally the gate-aggregator, which collapses every must-pass
# gate into ONE convergence verdict. exit_when fires on gate-aggregator.verdict
# == pass — the ADR-019 fail-closed contract re-expressed as a single composable
# construct (ADR-040 §5). The individual gates are NON-blocking (no blocking:true):
# they emit verdict-in-artifact (ADR-004) and the cycle iterates-to-fix; the loop
# converges via exit_when, never via per-gate hard-blocks. max_iterations: 5 with
# on_max: continue (ADR-019 fall-through to operator — the unconverged verdict
# still records, the pipeline continues to review).
build_test_cycle:
  type: cycle
  description: Build, test, and run the mechanical gates until gate-aggregator passes
  flow:
    - build
    - test
    - shape-floor
    - acceptance-gate
    - lint
    - coverage
    - mutation
    - secret-scan
    - gate-aggregator
  exit_when:
    stage: gate-aggregator
    field: verdict
    op: eq
    value: pass
  max_iterations: 5
  on_max: continue
  # Feedback edges so the cycle can CONVERGE instead of spinning
  # build(no-op)→…→gate-aggregator(fail). Both reuse build's EXISTING
  # cycle_feedback inputs (the build plugin already splices these into its prompt).
  # required:false — a producer is ABSENT when the corresponding gate self-skips
  # or no failure occurred (missing==empty semantics), and a missing producer must
  # NOT abort the cycle. NB (Wave 18-B): the `to:` MUST use block form (the
  # template translator handles block `to:`, not the inline `to: { ... }` form).
  feedback:
    # #1117 edge (retained): the test stage's failure summary carries into the
    # next-iter build prompt via build's prior_test_assessment input.
    - from:
        stage: test
        output: test_failures_summary
      to:
        stage: build
        input: prior_test_assessment
        required: false
    # B6 (#1138) NEW edge: the acceptance-gate's coverage finding (untagged SPEC
    # ids) feeds build directly + structured, so build adds missing [SPEC-n] tags
    # inside the cycle. This is an acceptance-gate→build edge mirroring the Layer-2
    # edge already proven in standard.yaml's build_review_cycle (#951) — it is NOT
    # a revival of the retired ADR-026/#951 build_review_cycle review→build edge.
    # from.output MUST be the manifest output id `gate_result` (NOT a filename) —
    # _cycle_resolve_from_path looks it up in acceptance-gate's outputs[].
    - from:
        stage: acceptance-gate
        output: gate_result
      to:
        stage: build
        input: prior_acceptance_feedback
        required: false

# ─── intake (leaf) ───────────────────────────────────────────────────────────
intake:
  gate: auto
  roles: [intake]
  io:
    destinations: [file, stdout]
    tail_lines: 200

# ─── plan (leaf) ─────────────────────────────────────────────────────────────
plan:
  gate: auto
  roles: [planner]
  io:
    destinations: [file, stdout]
    tail_lines: 200
  router:
    timeout_s: 300
    max_turns: 25

# ─── design (leaf) ───────────────────────────────────────────────────────────
design:
  gate: auto
  roles: [designer]
  io:
    destinations: [file, stdout]
    tail_lines: 200
  router:
    timeout_s: 600
    max_turns: 0

# ─── build (leaf, cycle member) ──────────────────────────────────────────────
build:
  gate: auto
  roles: [builder]
  io:
    destinations: [file, stdout]
    tail_lines: 200
  router:
    timeout_s: 900
    max_turns: 0

# ─── test (leaf, cycle member) ───────────────────────────────────────────────
test:
  gate: auto
  roles: [tester]
  io:
    destinations: [file, stdout]
    tail_lines: 200

# ─── shape-floor (leaf, cycle member) ────────────────────────────────────────
# T0 tool gate (ADR-040, #1134): un-gameable shape-floor check. verdict-in-artifact.
shape-floor:
  gate: auto
  roles: [shape_floor]
  io:
    destinations: [file, stdout]
    tail_lines: 200

# ─── acceptance-gate (leaf, cycle member) ────────────────────────────────────
# Mechanical (non-LLM) acceptance-contract gate (ADR-036, #922). No-op pass when
# the design acceptance block is absent (its design input is required:false in the
# manifest — design already emits the SPEC/WIRING block). Its gate_result feeds
# the acceptance→build feedback edge above.
acceptance-gate:
  gate: auto
  roles: [acceptance_gate]
  io:
    destinations: [file, stdout]
    tail_lines: 200
  router:
    timeout_s: 600
    max_turns: 10

# ─── lint (leaf, cycle member) ───────────────────────────────────────────────
# T0 read-out gate (ADR-040, #1135): maps the shared test-results.json lint block
# to a verdict; never re-runs the linter. verdict-in-artifact.
lint:
  gate: auto
  roles: [lint_gate]
  io:
    destinations: [file, stdout]
    tail_lines: 200

# ─── coverage (leaf, cycle member) ───────────────────────────────────────────
# T0 read-out gate (ADR-040, #1135): maps the shared test-results.json coverage
# block to a verdict; never re-runs coverage. verdict-in-artifact.
coverage:
  gate: auto
  roles: [coverage_gate]
  io:
    destinations: [file, stdout]
    tail_lines: 200

# ─── mutation (leaf, cycle member) ───────────────────────────────────────────
# T0 read-out gate (ADR-040, #1135): maps the shared test-results.json mutation
# block to a verdict; never re-runs the mutation harness. verdict-in-artifact.
mutation:
  gate: auto
  roles: [mutation_gate]
  io:
    destinations: [file, stdout]
    tail_lines: 200

# ─── secret-scan (leaf, cycle member) ────────────────────────────────────────
# T0 tool gate (ADR-040, #1136): blocks hardcoded secrets/.env in the diff.
# verdict-in-artifact (skip on empty diff).
secret-scan:
  gate: auto
  roles: [secret_scan]
  io:
    destinations: [file, stdout]
    tail_lines: 200

# ─── gate-aggregator (leaf, cycle member) ────────────────────────────────────
# T0 convergence aggregator (ADR-040 §2/§5, #1137): collapses the must-pass gate
# set into ONE verdict. This is the cycle's exit_when source and the single
# merge-blocking construct in the decomposed pipeline. verdict-in-artifact.
gate-aggregator:
  gate: auto
  roles: [gate_aggregator]
  io:
    destinations: [file, stdout]
    tail_lines: 200

# ─── review_lenses (parallel group, ADVISORY) ────────────────────────────────
# C3 (#1142, ADR-040 §3 / ADR-039): advisory multi-lens merge-readiness review.
# Each lens is a first-class `kind: agent` stage (plugins/agent/review-lens, bound
# by role review_lens) running ONE isolated, redacted LLM call over evidence it is
# fed (ADR-038 §2 isolated-call discipline, preserved). The lens id derives from
# the member stage name (the review-lens plugin strips the `lens-` prefix:
# lens-security→security, lens-red-team→red-team, lens-scope→scope, …).
#
# aggregate: advisory — this group is NEVER on a merge-blocking path: it has no
# exit_when, drives no convergence, and never hard-blocks (a failed/unparseable
# lens degrades to an empty result and the member still returns 0, ADR-040 §4).
# Convergence is owned by the build_test_cycle's gate-aggregator exit_when above;
# the B5 (#1137) no-LLM-on-convergence-path invariant therefore holds.
review_lenses:
  type: parallel
  flow:
    - lens-security
    - lens-performance
    - lens-red-team
    - lens-correctness
    - lens-scope
  max_parallel: 4
  on_member_error: continue
  aggregate: advisory

# ─── lens-* (leaf, review_lenses members) ────────────────────────────────────
# All five bind by role to the SAME review-lens plugin (provides.role: review_lens);
# they differ only by the lens id derived from the stage name (its charter +
# preferred evidence artifact). Advisory T2 agent stages — no blocking contract.
lens-security:
  gate: auto
  roles: [review_lens]
  io:
    destinations: [file, stdout]
    tail_lines: 200
  router:
    timeout_s: 300
    max_turns: 25

lens-performance:
  gate: auto
  roles: [review_lens]
  io:
    destinations: [file, stdout]
    tail_lines: 200
  router:
    timeout_s: 300
    max_turns: 25

lens-red-team:
  gate: auto
  roles: [review_lens]
  io:
    destinations: [file, stdout]
    tail_lines: 200
  router:
    timeout_s: 300
    max_turns: 25

lens-correctness:
  gate: auto
  roles: [review_lens]
  io:
    destinations: [file, stdout]
    tail_lines: 200
  router:
    timeout_s: 300
    max_turns: 25

# lens-scope (ADR-030): WARN-ONLY scope-advisory lens — compares the declared
# scope manifest against the diff and flags out-of-scope edits or in-scope files
# left untouched. Never blocks (advisory member of the advisory group).
lens-scope:
  gate: auto
  roles: [review_lens]
  io:
    destinations: [file, stdout]
    tail_lines: 200
  router:
    timeout_s: 300
    max_turns: 25

# ─── review-aggregator (leaf, ADVISORY) ──────────────────────────────────────
# C2 (#1141, ADR-040 §3/§4): merges the review_lenses members' lens-*.json results
# (glob from the shared artifacts dir) into ONE advisory merge-readiness report
# (review-report.json + review-report.md). Does NO LLM call — it merges lens JSON
# only. Bound by role review_aggregator to plugins/agent/review-aggregator. Always
# writes the report and returns 0; never recommends a merge action, never blocks.
# The report.json filename is unchanged, so merge / pr-delivery consume it as before.
review-aggregator:
  gate: auto
  roles: [review_aggregator]
  io:
    destinations: [file, stdout]
    tail_lines: 200

# ─── pr (leaf) ───────────────────────────────────────────────────────────────
# T0 tool stage (ADR-013): opens the pull request; no LLM call.
pr:
  gate: auto
  roles: [pr]
  io:
    destinations: [file, stdout]
    tail_lines: 200
