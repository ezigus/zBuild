id: standard
name: Standard Pipeline
extends: null
defaults:
  strategy: fanout

stages:
  - id: intake
    gate: auto
    roles: [intake]
    io:
      destinations: [file, stdout]
      tail_lines: 200
  - id: plan
    gate: auto
    roles: [planner]
    io:
      destinations: [file, stdout]
      tail_lines: 200
    router:
      timeout_s: 300
  - id: build
    gate: auto
    roles: [builder]
    io:
      destinations: [file, stdout]
      tail_lines: 200
    router:
      timeout_s: 900
  - id: review
    gate: auto
    roles: [reviewer]
    io:
      destinations: [file, stdout]
      tail_lines: 200
    router:
      timeout_s: 300
