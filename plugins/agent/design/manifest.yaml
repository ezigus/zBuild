id: design
name: Design Stage
kind: agent
version: 0.1.0
description: |
  Design stage agent (ADR-013 T2, ADR-018 Pattern 1). Reads plan.json from
  the plan stage, extracts steps[].files[] as the minimum scope, routes to
  T2 via route_to_model_loop, and produces design.md containing a ```scope
  fenced block listing the authoritative file scope (strict superset of the
  plan.json files). The build stage reads design.md scope as its
  authoritative allowlist (fallback: plan.json when design stage is absent).

  Legacy citations (5-test trial requirement):
    pipeline-stages-intake.sh:1004 — stage_design
    pipeline-stages.sh:38-71       — _extract_scope_from_design

hooks:
  init: design_stage_init
  run: design_stage_run
  finalize: design_stage_finalize
  cleanup: design_stage_cleanup

requires:
  core:
    - redaction
    - event-bus
    - state
    - router
  plugins: []

provides:
  artifact_type: design.md
  schema_version: 1

config:
  tier_default: T2

inputs:
  - id: scope_manifest
    type: file
    source: stage:intake
    required: true
  - id: plan
    type: file
    path: "${artifact_dir}/plan.json"
    source: stage:plan
    required: true

outputs:
  - id: design_md
    path: "${artifact_dir}/design.md"
    type: text/markdown
    required: true
    primary: true

state:
  persisted: [scope_file_count]
  reconstructed: []
