id: simple
name: Simple Pipeline
extends: null

# ADR-037 §4: per-template merge policy. Wired to runtime behavior in #975.
merge_policy: auto_unless_flagged

defaults:
  strategy: fanout

# ─── Flow ────────────────────────────────────────────────────────────────────
# Simplified pipeline (ADR-037 EPIC #966 I2+I3+I4): 6 top-level flow units —
# intake, plan, design, build_test_cycle, review, pr — where build_test_cycle
# groups the build/test/objective-gate leaves (8 leaf stages total).
# Omits: impact, test_assessment, acceptance-gate, cq-* stages (targeted for
# removal in #979). Starts closer to the intended final shape so subsequent
# issues (#969-#979) can build the new pipeline here while standard.yaml
# continues to serve production.
#
# Stage order (issue #970): objective-gate runs after test (now inside
# build_test_cycle) so post-build artifacts (coverage report, git diff) are
# available for the coverage-floor and scope-adherence gates.
#   After test:   objective-gate (#970) then evidence-fed review stages (#972, #973, #974)
#
# I10-A (#976): build/test/objective-gate wrapped in build_test_cycle (ADR-021).
# The exit_when predicate is concrete and parsed, but not yet load-bearing for
# convergence — see the cycle block below. I10-B makes it drive looping.
flow:
  - intake
  - plan
  - design
  - build_test_cycle
  # #972: the `review` stage emits the evidence-fed multi-lens merge-readiness
  # report (no new flow stage — it is bound to a dedicated plugin by role).
  # #973 feeds each lens distinct mechanical evidence.
  - review
  - pr

# ─── build_test_cycle (cycle) ────────────────────────────────────────────────
# I10-B (#1089): max_iterations raised to 5 so the exit_when predicate is
# load-bearing for convergence. Cycle re-runs build/test/objective-gate until
# objective-gate emits verdict:pass or max_iterations is exhausted.
#
# I10-C: test_assessment is permanently retired as convergence driver for this
# template. Convergence is owned exclusively by objective-gate via exit_when
# below. The empty_diff/coercion convergence class in test_assessment/plugin.sh
# is not applicable here — simple.yaml does not include test_assessment in this
# cycle at all. If test_assessment is ever wired in as an advisory stage in a
# future issue, set ZBUILD_TEST_ASSESSMENT_ADVISORY=1 in the stage env so the
# pass-invariant coercion is suppressed (ADR-022 Amendment v6).
build_test_cycle:
  type: cycle
  flow:
    - build
    - test
    - objective-gate
  exit_when:
    stage: objective-gate
    field: verdict
    op: eq
    value: pass
  max_iterations: 5
  on_max: continue

# ─── intake (leaf) ───────────────────────────────────────────────────────────
intake:
  gate: auto
  roles: [intake]
  io:
    destinations: [file, stdout]
    tail_lines: 200

# ─── plan (leaf) ─────────────────────────────────────────────────────────────
plan:
  gate: auto
  roles: [planner]
  io:
    destinations: [file, stdout]
    tail_lines: 200
  router:
    timeout_s: 300
    max_turns: 25

# ─── objective-gate (leaf) ───────────────────────────────────────────────────
# T0 tool stage (ADR-013, ADR-037 §1, issue #969): runs the test suite +
# lint/shellcheck; hard-blocks on any failure; no LLM call.
objective-gate:
  gate: auto
  roles: [objective-gate]
  io:
    destinations: [file, stdout]
    tail_lines: 200

# ─── design (leaf) ───────────────────────────────────────────────────────────
design:
  gate: auto
  roles: [designer]
  io:
    destinations: [file, stdout]
    tail_lines: 200
  router:
    timeout_s: 600
    max_turns: 0

# ─── build (leaf) ────────────────────────────────────────────────────────────
build:
  gate: auto
  roles: [builder]
  io:
    destinations: [file, stdout]
    tail_lines: 200
  router:
    timeout_s: 900
    max_turns: 0

# ─── test (leaf) ─────────────────────────────────────────────────────────────
test:
  gate: auto
  roles: [tester]
  io:
    destinations: [file, stdout]
    tail_lines: 200

# ─── review (leaf) ───────────────────────────────────────────────────────────
# ADR-038 (#972): advisory multi-lens merge-readiness report. Bound by role to
# plugins/agent/review-report (provides.role: review_report) — NOT the legacy
# `review` verdict plugin (which standard.yaml still uses). Never coerces a
# merge decision; never hard-blocks. #974 rehomes the full cq+persona lens roster.
review:
  gate: auto
  roles: [review_report]
  io:
    destinations: [file, stdout]
    tail_lines: 200
  router:
    timeout_s: 300
    max_turns: 25

# ─── pr (leaf) ───────────────────────────────────────────────────────────────
# T0 tool stage (ADR-013): opens the pull request; no LLM call.
pr:
  gate: auto
  roles: [pr]
  io:
    destinations: [file, stdout]
    tail_lines: 200
