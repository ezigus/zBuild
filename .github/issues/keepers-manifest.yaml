  # ─── Phase 1 — Ruflo MCP integration depth (5 issues) ──────────────────
  - id: ruf-1
    title: "[Phase 1] Ruflo daemon lifecycle (spawn / kill / restart)"
    milestone: "Phase 1 — Pipeline & Intelligence"
    labels: [phase-1, keeper]
    body: |
