id: review
name: Review Stage
kind: agent
version: 0.1.0
description: |
  Review stage agent. Examines the diff against the plan and test results to
  produce a structured verdict: approve, request_changes, or block. Closes the
  plan -> build -> test -> review loop before a PR is opened.

hooks:
  init: review_stage_init
  run: review_stage_run
  finalize: review_stage_finalize
  cleanup: review_stage_cleanup

requires:
  core:
    - redaction
    - event-bus
    - state
    - router
  plugins: []

provides:
  artifact_type: review.json
  schema_version: 1

config:
  tier_default: T2
  valid_verdicts:
    - approve
    - request_changes
    - block

inputs:
  - name: scope_manifest
    type: file
  - name: plan
    type: file
    path: "${artifact_dir}/plan.json"
  - name: diff_patch
    type: file
    path: "${artifact_dir}/diff.patch"
  - name: test_results
    type: file
    path: "${artifact_dir}/test-results.json"

outputs:
  - name: review
    path: "${artifact_dir}/review.json"
    type: review.json

state:
  persisted:
    - last_verdict
    - last_issues_count
  reconstructed: []
