id: cycle-blocked
name: Cycle where test stage hits structural error (verdict=error) on iter 1
defaults:
  strategy: fanout
stages:
  - id: build-test
    type: cycle
    stages: [build, test]
    until:
      stage: test
      field: verdict
      op: eq
      value: pass
    max_iterations: 5
    on_max: continue

stage_definitions:
  build:
    roles: [builder]
  test:
    roles: [tester]
