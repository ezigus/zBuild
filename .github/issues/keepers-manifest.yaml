    body: |
      Use namespace zbuild-repo-{hash} and zbuild-{hash}-{ISSUE_NUMBER} so
      zbuild doesn't read/write into the legacy shipwright-* namespaces. Hash
      = sha256 of repo origin URL (unify the multiple repo-hash schemes per
      KEEPERS §I).
  - id: ruf-5
    title: "[Phase 1] Multi-server MCP orchestration (.mcp.json with 4 servers)"
    milestone: "Phase 1 — Pipeline & Intelligence"
    labels: [phase-1, keeper]
    body: |
      Connect to multiple MCP servers (claude-flow, ruv-swarm, flow-nexus,
      agentic-flow) per .mcp.json. Handle server lifecycle, health checks,
      version pinning, error propagation, fallback routing when one's down.
  # ─── Phase 3 — Daemon adaptive subsystems (12 issues) ──────────────────
  - id: adapt-1
    title: "[Phase 3] Adaptive poll intervals (queue depth + cost-per-job)"
    milestone: "Phase 3 — Daemon & Autonomous Ops"
    labels: [phase-3, keeper, daemon-plugin, learning-loop]
    body: |
      POLL_INTERVAL adapts in 30s-120s range based on queue depth and rolling
      cost-per-job. Avoids polling-storms when nothing's queued and CPU spend
      when work is bursty. Legacy: daemon-adaptive.sh.
  - id: adapt-2
    title: "[Phase 3] Progress-based health verdicts (healthy/slowing/stalled/stuck ladder)"
    milestone: "Phase 3 — Daemon & Autonomous Ops"
    labels: [phase-3, keeper, daemon-plugin]
    body: |
      Compute verdict from progress signals (stage transitions, iteration
      advance, git diff growth, file changes, child CPU). Distinct from #L-3
      (wishlist: wire to KILL behavior); this issue computes the gradient and
      emits events. Verdict consumers (kill steering, statusline) follow.
  - id: adapt-3
    title: "[Phase 3] Patrol limit adaptation (learn PATROL_MAX_ISSUES by hit rate)"
    milestone: "Phase 3 — Daemon & Autonomous Ops"
    labels: [phase-3, keeper, daemon-plugin, learning-loop]
    body: |
      If patrol consistently hits the max-issues limit, increase it; if it
      finds 0, decrease. Prevents resource waste on low-yield scans.
  - id: adapt-4
    title: "[Phase 3] Cost-aware auto-scaling (success rate at parallelism)"
    milestone: "Phase 3 — Daemon & Autonomous Ops"
    labels: [phase-3, keeper, daemon-plugin, learning-loop]
    body: |
      Track success rate per parallelism level; lower MAX_PARALLEL when
      success rate drops at higher concurrency (i.e., over-subscription).
      Extends #49 (five ceilings) with a learning input.
  - id: adapt-5
    title: "[Phase 3] PID reuse detection (command signature + start time)"
    milestone: "Phase 3 — Daemon & Autonomous Ops"
    labels: [phase-3, keeper, daemon-plugin]
    body: |
      Before killing a stuck process, verify the PID's command signature still
      matches the job AND the start time is consistent. Prevents killing
      unrelated processes after PID recycling.
  - id: adapt-6
    title: "[Phase 3] Per-stage heartbeat timeouts via policy.json"
    milestone: "Phase 3 — Daemon & Autonomous Ops"
    labels: [phase-3, keeper, daemon-plugin]
    body: |
      Operator-configurable timeouts: daemon.stage_timeouts.build=300s,
      .test=180s, .review=180s, .lint=60s. Extends #55 (mechanism) with the
      configuration surface.
  - id: adapt-7
    title: "[Phase 3] Auto-resume from pause flag (operator-pauseable daemon)"
    milestone: "Phase 3 — Daemon & Autonomous Ops"
    labels: [phase-3, keeper, daemon-plugin]
    body: |
      Pause flag with resume_after timestamp; daemon checks each cycle and
      auto-clears when time passes. Enables maintenance windows without
      manual restart.
  - id: adapt-8
    title: "[Phase 3] Failure class taxonomy + per-class retry policy"
    milestone: "Phase 3 — Daemon & Autonomous Ops"
    labels: [phase-3, keeper, recovery-plugin]
    body: |
      Classify failures into 5+ classes (auth_error, api_error, invalid_issue,
      context_exhaustion, build_failure); per-class max retries and backoff.
      Distinct from #47 circuit breaker — this is classification, that's policy.
  - id: adapt-9
    title: "[Phase 3] Consecutive-failure auto-pause (5m→40m→320m, cap 8h)"
    milestone: "Phase 3 — Daemon & Autonomous Ops"
    labels: [phase-3, keeper, daemon-plugin]
    body: |
      On 3+ consecutive failures in same class, auto-pause with exponential
      resume. Prevents thrashing on persistent flakes (e.g., flaky external API).
      Consumes adapt-8 classifier output.
  - id: adapt-10
    title: "[Phase 3] Checkpoint-based recovery (--resume from last good state)"
    milestone: "Phase 3 — Daemon & Autonomous Ops"
    labels: [phase-3, keeper, daemon-plugin]
    body: |
      daemon-failure checks for pipeline-artifacts/checkpoints/ and passes
      --resume on retry. Faster than restart-from-scratch when pipeline got
      most of the way through.

      ---

      ## Cross-reference: complementary to resume-1

      This covers **daemon-driven** checkpoint recovery (after-failure re-entry
      via `--resume` flag). It complements #225 (operator-triggered resume CLI
      + auto-resume policy in bootstrap). Both consume the same
      [ADR-006](../../docs/adr/ADR-006-resume-contract.md) Pipeline-Resume
      Memory contract; the difference is trigger (daemon vs. operator vs.
      auto-detect in #209 bootstrap).
  - id: adapt-11
    title: "[Phase 3] Intelligence-powered triage (semantic complexity/risk extraction)"
    milestone: "Phase 3 — Daemon & Autonomous Ops"
    labels: [phase-3, keeper, daemon-plugin, learning-loop]
    body: |
      Call intelligence_analyze_issue() to extract complexity (1-10),
      risk_level, success_probability, issue_type from issue body. Export as
      INTELLIGENCE_COMPLEXITY for downstream stage decisions. Extends #48
      label-based scoring.
  - id: adapt-12
    title: "[Phase 3] 10-part proactive patrol (sec-audit + deps + dead-code + ...)"
    milestone: "Phase 3 — Daemon & Autonomous Ops"
    labels: [phase-3, keeper, daemon-plugin]
    body: |
      Patrol substance for #51. Each check is a small plugin: security vuln
      scan (npm/pip/cargo audit + Dependabot), stale deps (>2 major versions),
      dead code (no importers), test coverage gaps, doc staleness, perf
      regression, recurring failures, DORA degradation, untested scripts,
      retry exhaustion patterns.
  # ─── Phase 3 — Self-optimize learning loop wiring (3 issues) ───────────
  - id: opt-1
    title: "[Phase 3] Outcome → routing feedback loop (record_model_outcome wiring)"
    milestone: "Phase 3 — Daemon & Autonomous Ops"
    labels: [phase-3, keeper, learning-loop]
    body: |
      After each stage, record (model, tokens, cost, quality_score, success)
      into the cost ledger and feed back into UCB1/Thompson posterior. Closes
      the loop on #29/#30 routers (they have the algorithm; this is the data
      pipeline that makes them learn).
  - id: opt-2
    title: "[Phase 3] Risk keyword learning (optimize_learn_risk_keywords)"
    milestone: "Phase 3 — Daemon & Autonomous Ops"
    labels: [phase-3, keeper, learning-loop]
    body: |
      Mine event-log for keywords that correlate with failure; update
      classifier-rule weights so future issues get correctly tagged as
      high-risk earlier. Feeds adapt-8 (failure classifier).
  - id: opt-3
    title: "[Phase 3] Memory evolution feedback (optimize_evolve_memory)"
    milestone: "Phase 3 — Daemon & Autonomous Ops"
    labels: [phase-3, keeper, learning-loop]
    body: |
      Prune stale skill-recommendation patterns; promote ones that correlated
      with recent successes; feed updates back into the skill registry
      (#22/#67) so older patterns decay rather than dominate.
  # ─── Phase 3 — AgentDB multi-table persistence (6 issues) ──────────────
  - id: db-1
    title: "[Phase 3] AgentDB tables: pipeline_runs + pipeline_stages"
    milestone: "Phase 3 — Daemon & Autonomous Ops"
    labels: [phase-3, keeper]
    body: |
      Persist run history and per-stage outcomes. Enables status dashboards,
      DORA computation, replay. Schema from legacy/scripts/sw-db.sh.
  - id: db-2
    title: "[Phase 3] AgentDB tables: cost_entries + budgets"
    milestone: "Phase 3 — Daemon & Autonomous Ops"
    labels: [phase-3, keeper]
    body: |
      Cost ledger backing store with per-budget tracking. Feeds opt-1 and
      ccli-5 (token-limit enforcement). Extends #28 ledger spec with the
      persistence layer.

      ---

      ## Cost-ecosystem cross-reference

      This is the **persistence layer** for the cost ledger spec defined in
      #28 (cost ledger + baselines feeding routing). Schema must support
      per-(stage, platform) cost tracking per #203 (per-platform ceilings) —
      add `platform` column to both `cost_entries` and `budgets` tables for
      composite-key enforcement. Reads/writes happen through the #28 ledger
      logic, not direct SQL from plugins.
  - id: db-3
    title: "[Phase 3] AgentDB tables: heartbeats (daemon state)"
    milestone: "Phase 3 — Daemon & Autonomous Ops"
    labels: [phase-3, keeper]
    body: |
      Persisted heartbeat history. Survives daemon restart (so patient-kill
      can verify staleness across restarts). Backing for adapt-2/adapt-7.
  - id: db-4
    title: "[Phase 3] AgentDB tables: memory_patterns + memory_decisions + memory_embeddings"
    milestone: "Phase 3 — Daemon & Autonomous Ops"
    labels: [phase-3, keeper, learning-loop]
    state: closed
    closed_reason: |
      Subsumed into the memory-backend abstraction (ADR-011): memory_patterns,
      memory_decisions, memory_embeddings are the substrate that the
      memory-sqlite default backend (#216) and memory-ruflo optional backend
      (#217) implement via the memory_put/get/search contract. The specific
      table designs become implementation details of #216; vector embeddings
      are handled by #217 in ruflo HNSW namespaces rather than a local table.
      Closed to avoid two parallel specs for the same substrate.
    body: |
      Three tables for the learning loop substrate: extracted patterns,
      architectural decisions, ONNX embeddings. memory_failures (#32) is the
      4th; this issue covers the other three.

      **Status: closed — superseded by ADR-011 backend abstraction (#216, #217).**
  - id: db-5
    title: "[Phase 3] AgentDB tables: daemon_queue (durable job queue)"
    milestone: "Phase 3 — Daemon & Autonomous Ops"
    labels: [phase-3, keeper, daemon-plugin]
    body: |
      Persisted job queue so dispatched-but-not-completed jobs survive daemon
      restart. Foundation for the daemon's correctness story.
  - id: db-6
    title: "[Phase 3] AgentDB cross-device HTTP sync (_sync_log + _sync_metadata)"
    milestone: "Phase 3 — Daemon & Autonomous Ops"
    labels: [phase-3, keeper]
    body: |
      Replicate learned state across machines via HTTP sync. Enables fleet
      operations (multiple developer machines share learned patterns).

      ---

      ## ADR-011 cross-reference

      Learning-memory cross-device sync depends on the selected backend (per
      [ADR-011](../../docs/adr/ADR-011-pluggable-backends.md)). SQLite default
      (#216) requires a cache backend (#211/#212 `cache_pull/push`) for
      cross-runner persistence. Ruflo backend (#217) has its own MCP remote.
      This is **distinct** from pipeline-resume cache transport (ADR-010
      covers that for ADR-006 state); these two memory models' transports are
      decoupled by design.
