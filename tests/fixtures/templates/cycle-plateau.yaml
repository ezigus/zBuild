id: cycle-plateau
name: Cycle that plateaus
defaults:
  strategy: fanout
stages:
  - id: build-test
    type: cycle
    stages: [build, test]
    until:
      stage: test
      field: verdict
      op: eq
      value: pass
    max_iterations: 6
    on_max: continue
    plateau:
      window: 3

stage_definitions:
  build:
    roles: [builder]
  test:
    roles: [tester]
