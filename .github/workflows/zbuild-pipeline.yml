name: zbuild pipeline
run-name: "zbuild · issue #${{ inputs.issue_number || 'goal' }}"

# Reusable workflow: call from other workflows via `uses:` with workflow_call.
# Manual trigger available via workflow_dispatch for one-off runs.
#
# Issue #91 — stub that wires the zbuild CLI to GitHub Actions.
# Daemon-mode scheduling (#92) is separate.

on:
  workflow_call:
    inputs:
      issue_number:
        description: "GitHub issue number to run the pipeline for"
        required: true
        type: number
      goal:
        description: "Optional free-text goal (passed to --goal instead of --issue)"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Pass --dry-run to zbuild (no side effects)"
        required: false
        type: boolean
        default: false
      template:
        description: "Pipeline template id (e.g. simple, deployed). Empty = zbuild default (simple)."
        required: false
        type: string
        default: ""
    # NOTE: do not declare `secrets: GITHUB_TOKEN` here — GITHUB_TOKEN is a
    # reserved name auto-provided to every workflow. Declaring it makes the
    # workflow file invalid, which causes GitHub to emit a phantom "workflow
    # file issue" failure on every push to the default branch.

  workflow_dispatch:
    inputs:
      issue_number:
        description: "GitHub issue number to run the pipeline for"
        required: true
        type: number
      goal:
        description: "Optional free-text goal"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Dry run (no side effects)"
        required: false
        type: boolean
        default: false
      template:
        description: "Pipeline template id (e.g. simple, deployed). Empty = zbuild default (simple)."
        required: false
        type: string
        default: ""

permissions:
  contents: write # pr-open pushes the work branch (CI-3 #1002)
  issues: write
  pull-requests: write

jobs:
  pipeline:
    name: "Pipeline — issue #${{ inputs.issue_number }}"
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ZBUILD_WORKSPACE_BRANCH: zbuild/issue-${{ inputs.issue_number }}-ci
      # Model selection is governed by config/models.json + core/router — never hardcoded here.

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure git identity
        # CI-7 (#999): the build stage commits work with `git commit --author`,
        # but git ALSO needs a committer identity (user.name/user.email). A fresh
        # runner has none, so the commit fails → build.commit.skipped commit_failed
        # → the generated work is never committed and is lost. Set a bot identity.
        run: |
          git config --global user.name  "zbuild-pipeline[bot]"
          git config --global user.email "zbuild-pipeline[bot]@users.noreply.github.com"

      - name: Install Claude CLI
        # Pinned for reproducible CI (CI-2 #1001); the router shells out to `claude`.
        run: npm install -g @anthropic-ai/claude-code@2.1.183

      - name: Install zbuild
        run: bash install.sh

      - name: Fetch prior work + state branches (ADR-050 #1581)
        # Prior-work reuse: a fresh runner's shallow checkout has neither the
        # issue's work branch (zbuild/issue-N-ci) nor its state branch
        # (zbuild/state/issue-N). Fetch both into remote-tracking refs so intake
        # can ADOPT the existing work branch (its gate checks refs/remotes/origin/…)
        # and the runner can RESTORE prior artifacts from the state branch. Guarded
        # so a first-ever run (no such branch on origin) is a clean no-op. Skipped
        # for goal-only runs (no issue number → no deterministic branch name).
        if: ${{ inputs.issue_number != '' }}
        run: |
          n="${{ inputs.issue_number }}"
          work="zbuild/issue-${n}-ci"
          state="zbuild/state/issue-${n}"
          git fetch origin "refs/heads/${work}:refs/remotes/origin/${work}" 2>/dev/null \
            && echo "::notice::fetched prior work branch '${work}'" \
            || echo "::notice::no prior work branch '${work}' on origin (first run)"
          git fetch origin "refs/heads/${state}:refs/remotes/origin/${state}" 2>/dev/null \
            && echo "::notice::fetched prior state branch '${state}'" \
            || echo "::notice::no prior state branch '${state}' on origin (first run)"

      - name: Run pipeline
        # CI-2 (#1001): scope the API key to this step only (not all steps) + fail
        # fast with a clear error when the secret is missing.
        env:
          # CI-6 (#999): prefer the Claude subscription OAuth token (no per-token
          # API billing for dogfoods); fall back to a raw API key if that's all
          # that's configured. `claude setup-token` mints CLAUDE_CODE_OAUTH_TOKEN.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # CI-5: pin state to the workspace so runner state, events, and the
          # router's stage-io diagnostics land under ./state/ — which the Upload
          # step captures. Default is $HOME/.zbuild/state (= /home/runner/...),
          # which the workspace-relative upload path can never see.
          ZBUILD_STATE_DIR: ${{ github.workspace }}/state
        run: |
          if [[ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]]; then
            # OAuth token present → unset the API key so claude uses the
            # subscription, not pay-per-token billing (which also re-introduces
            # the "Credit balance is too low" failure mode).
            unset ANTHROPIC_API_KEY
          elif [[ -z "${ANTHROPIC_API_KEY:-}" ]]; then
            echo "::error::Neither CLAUDE_CODE_OAUTH_TOKEN nor ANTHROPIC_API_KEY is set — the LLM stages cannot authenticate. Set one in repo Settings → Secrets (run 'claude setup-token' for the OAuth token)."
            exit 1
          fi
          args=()
          if [[ -n "${{ inputs.goal }}" ]]; then
            args+=(--goal "${{ inputs.goal }}")
          else
            args+=(--issue "${{ inputs.issue_number }}")
          fi
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi
          if [[ -n "${{ inputs.template }}" ]]; then
            args+=(--template "${{ inputs.template }}")
          fi
          bash scripts/zbuild pipeline start "${args[@]}"

      - name: Push work branch (preserve work on pass OR fail)
        # CI-7 (#999): push the pipeline's work branch to origin no matter the
        # outcome, so a CI dogfood's output is never lost when the runner is torn
        # down. On failure the branch is there to inspect; on success it's ready
        # for a PR. Only pushes when the branch exists and carries commits.
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="${ZBUILD_WORKSPACE_BRANCH}"
          # Plain --force (not --force-with-lease): this is a disposable,
          # pipeline-owned branch (zbuild/issue-N-ci) that each run regenerates.
          # Last-writer-wins is the intended behavior here — the current run's
          # work is always what we want on origin (#947 CI-7 fix).
          if ! git rev-parse --verify --quiet "refs/heads/$branch" >/dev/null; then
            echo "::warning::work branch '$branch' not found — pipeline aborted before intake created it; nothing to push"
          else
            new_commits="$(git rev-list --count "$branch" ^"${{ github.sha }}" 2>/dev/null || echo 0)"
            if [[ "$new_commits" -eq 0 ]]; then
              echo "::notice::'$branch' has no commits beyond base — build produced nothing to push"
            else
              git push --force origin "refs/heads/$branch:refs/heads/$branch" \
                && echo "::notice::pushed '$branch' ($new_commits commit(s)) to origin" \
                || { echo "::error::failed to push '$branch'"; exit 1; }
            fi
          fi

          # ADR-050 (#1581): also push the STATE branch (durable prior-run
          # artifacts: design.md/plan.json/etc.) pass OR fail, so completed-stage
          # work survives the torn-down runner and the next run restores it. This
          # branch is never merged into the work branch or main (it's a sibling),
          # so it can't pollute the PR diff. Pushed independently of the work
          # branch above — artifacts can exist even when build produced no commit.
          if [[ -n "${{ inputs.issue_number }}" ]]; then
            state_branch="zbuild/state/issue-${{ inputs.issue_number }}"
            if git rev-parse --verify --quiet "refs/heads/$state_branch" >/dev/null; then
              git push --force origin "refs/heads/$state_branch:refs/heads/$state_branch" \
                && echo "::notice::pushed state branch '$state_branch' to origin" \
                || echo "::warning::failed to push state branch '$state_branch'"
            fi
          fi

      - name: Upload pipeline artifacts
        # CI-5: upload on FAILURE too — a failed run is exactly when the router's
        # diagnostic stderr (route.sh:459, *.raw-claude-stderr.txt) is needed.
        # Capture the whole state/ tree (run dirs, events, stage-io diags), not
        # just state/artifacts/, so model-call failures are debuggable from CI.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: "pipeline-artifacts-issue-${{ inputs.issue_number }}-${{ github.run_id }}"
          path: state/
          if-no-files-found: ignore
