name: Claude Code Review

on:
  # Automatic: review every PR as it opens / updates / reopens.
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  # On-demand from the Actions tab: review a specific PR by number.
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string
  # On-demand from the PR itself: comment "/claude-review" on the pull request.
  issue_comment:
    types: [created]

jobs:
  claude-review:
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '/claude-review'))

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Resolve PR number
        id: pr
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_FROM_PULL: ${{ github.event.pull_request.number }}
          PR_FROM_COMMENT: ${{ github.event.issue.number }}
          PR_FROM_DISPATCH: ${{ github.event.inputs.pr_number }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)      pr="$PR_FROM_PULL" ;;
            issue_comment)     pr="$PR_FROM_COMMENT" ;;
            workflow_dispatch) pr="$PR_FROM_DISPATCH" ;;
            *) echo "::error::unsupported event '$EVENT_NAME'"; exit 1 ;;
          esac
          if [[ ! "$pr" =~ ^[0-9]+$ ]]; then
            echo "::error::could not resolve a numeric PR number (got '$pr')"; exit 1
          fi
          echo "number=$pr" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: 'github-actions[bot]'
          show_full_output: true
          # track_progress only works on PR/issue events, not workflow_dispatch
          track_progress: ${{ github.event_name != 'workflow_dispatch' }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ steps.pr.outputs.number }}

            Review this pull request for the zBuild pipeline project. Focus on:

            1. **Bugs** — logic errors, off-by-one, null/empty handling, rc/exit-code handling
            2. **Shell correctness** — shellcheck violations, unquoted variables, pipefail hazards
            3. **Security** — path traversal, command injection, unredacted secrets reaching LLM calls
            4. **CLAUDE.md compliance** — files over 500 lines, docs committed to root, secrets hardcoded
            5. **Test coverage** — new code paths without corresponding test assertions

            Post specific issues as inline comments. Use a top-level comment only for a summary.
            If no significant issues are found, say so clearly — do not invent findings.

            End your review comment with `<!-- verdict: findings -->` if you found significant
            issues, or `<!-- verdict: clean -->` if you found none.
          claude_args: |
            --model claude-sonnet-4-6
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Read,Grep,Glob"
            --max-turns 40

      - name: Post review outcome comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
          REVIEW_OUTCOME: ${{ steps.claude-review.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/lib/ci-review-outcome.sh
          source "${GITHUB_WORKSPACE}/scripts/lib/ci-review-outcome.sh"
          post_review_outcome
