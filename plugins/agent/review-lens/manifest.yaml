id: review-lens
name: Review Lens (single, advisory)
kind: agent
# #2482 (ADR-001): the ids this stage writes start with it.
id_prefix: RL
version: 0.1.0
# ADR-071: the topics of earlier stages' output its prompt's Previous work holds.
takes:
  - topic: ask
    for: "what the change is meant to do"
  - topic: change
    for: "the change to review"
description: |
  A single advisory review lens as its OWN isolated LLM stage (ADR-040 §3,
  EPIC #1129 C1). One isolated, redacted route_to_model call asks ONE lens's
  question over evidence it is fed, then writes a normalized lens-<name>.json
  ({name, score, findings[]}). Advisory only: it never recommends a merge
  action and never gates the pipeline — a failed or unparseable lens degrades
  to an empty result and the stage still returns 0.

  Parametrized per lens: the SAME plugin serves security / performance /
  red-team / correctness / scope etc. The lens id is read from
  ZBUILD_REVIEW_LENS_ID, else ZBUILD_CURRENT_STAGE, else config.lens. Packaged
  as a member of the ADR-039 `aggregate: advisory` lens group; the engine sums
  the group up and says whether a lens was flagged (#2368). This evolves
  ADR-038's single-stage fan-out into composable lens stages while keeping its
  evidence-fed, isolated-call contract (ADR-038 §2).

hooks:
  run: review_lens_run
requires:
  core:
    - redaction
    - event-bus
    - state
    - router
  plugins: []

# Bound by ROLE (resolver.sh reads provides.role). This stage is advisory: it
# used to opt out of contracts.sh's blocking contract-violated machinery by
# declining to declare provides.artifact_type. #1906 retired both the field and
# that check; artifact enforcement is now outputs[].required alone. It always
# writes lens-<name>.json, so it stays green.
provides:
  role: review_lens
  result_contract: 3
  # ADR-001 §"Declared events" (#1717) — this plugin's own events, composed into
  # the engine's known set at load. Adding one here needs no engine-config edit.
  events:
    - review_lens.failed
    - review_lens.redaction_failed
    - review_lens.unparseable
    # #2464, #2466 (ADR-072 §4): a kept answer saved, used instead of a call,
    # or found stale and judged again — one event per item.
    - judge.kept.saved
    - judge.kept.used
    - judge.kept.stale

config:
  # One outcome (#2366): fail when the lens found a high or critical problem
  # the change introduced, else pass; otherwise how it failed to finish. No
  # loop's exit rule names a lens, so a failing lens never gates the pipeline.
  tier_default: T2
  # Default lens identity when neither ZBUILD_REVIEW_LENS_ID nor
  # ZBUILD_CURRENT_STAGE is set (e.g. a bare manual invocation).
  lens: correctness
  router:
    # #1654: sized from measured runs. A lens reads around the change
    # (#2215/#2216); #1846 run 36433206388 had a lens call at 295s against the
    # old 300s ceiling (#1845's diff-only prompt peaked at 162s).
    timeout_s: 600
    max_turns: 20
    # #2464 (ADR-072 §1): it judges — it reads and searches files, and changes none.
    tools: read

outputs:
  # #2491 (ADR-071 §1): the verdict, summary and replies name no topic, so they
  # reach no stage — their findings already do, numbered, from the two outputs
  # below; on #1805 run 42439063480 each lens finding reached build three times.
  # The run-status comment reads the summaries by path.
  - id: lens_result
    description: "one review lens's verdict on the change; findings: each problem the lens found in the code"
    path: "${artifact_dir}/lens-${ZBUILD_REVIEW_LENS_ID}.json"
    finding_topics: none
    type: review-lens.json@1
    format: json
    required: true
    primary: true
  # ADR-055 §9: this stage's statement of what it DID. required:true —
  # written on every terminal verdict, so absence means something went wrong.
  - id: review_lens_summary
    description: "the lens's summary"
    path: "${artifact_dir}/lens-${ZBUILD_REVIEW_LENS_ID}-summary.md"
    type: review-lens-summary.md@1
    format: markdown
    required: true
    summary: true
  # #2433 (ADR-071 §1): one output per topic the lens writes findings to —
  # those that send the run back, numbered; each passes when it holds none.
  # #2491: a finding the code must fix names change-findings, so it reaches
  # build only, not test-author or issue-acceptance; one a test must fix keeps
  # code-findings.
  - id: review_lens_code
    topic: code-findings
    description: "the lens's findings that send the run back and that the code or a test must fix; one the code must fix goes to change-findings"
    path: "${artifact_dir}/lens-${ZBUILD_REVIEW_LENS_ID}-code-result.json"
    finding_topics: change-findings
    type: review-lens-routed.json@1
    format: json
    required: false
  - id: review_lens_design
    topic: requirement-findings
    description: "the lens's findings that send the run back and that the design must fix, or that say the issue itself is wrong"
    path: "${artifact_dir}/lens-${ZBUILD_REVIEW_LENS_ID}-design-result.json"
    finding_topics: none
    type: review-lens-routed.json@1
    format: json
    required: false
  # ADR-060 §6: every reply the lens got, in order — a reply that could not be
  # used is kept beside the one that was.
  - id: review_lens_replies
    description: "every reply the lens got, in order, including any that could not be used"
    path: "${artifact_dir}/lens-${ZBUILD_REVIEW_LENS_ID}-reply.txt"
    type: review-lens-reply.txt@1
    format: text
    required: false
state:
  persisted:
    - last_lens
    - last_score
  reconstructed: []

# hooks.cleanup is intentionally absent: this plugin holds no live resources
# that require teardown — ADR-054 §7 (#1829). The stub review_lens_cleanup in
# plugin.sh is a reference marker only.
