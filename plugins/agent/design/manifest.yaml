id: design
name: Design Stage
kind: agent
version: 0.1.0
# ADR-071: the topics of earlier stages' output its prompt's Previous work holds.
takes:
  - topic: ask
    for: "the issue and its requirements, to design against"
  - topic: requirement-findings
    for: "findings against the requirements or the design: what its acceptance contract, scope or WIRING gets wrong"
description: |
  Design stage agent. Invokes the LLM (T2) to produce an ADR-style design.md
  with a fenced ```scope block (the authoritative scope the build stage works
  to), a ```steps block of ordered work items (#2445: the plan stage is gone)
  and the acceptance contract.
  # legacy-citation: pipeline-stages-intake.sh:1004 (stage_design)
  # legacy-citation: pipeline-stages.sh:38-71 (_extract_scope_from_design)

hooks:
  run: design_stage_run
requires:
  core:
    - redaction
    - event-bus
    - state
    - router
  plugins: []

provides:
  role: designer
  result_contract: 3
  # ADR-001 §"Declared events" (#1717) — this plugin's own events, composed into
  # the engine's known set at load. Adding one here needs no engine-config edit.
  events:
    - design.stray.conflict
    - design.stray.recovered
    - design.checks.failed

config:
  tier_default: T2
  router:
    timeout_s: 600
    max_turns: 45

outputs:
  - id: design
    topic: ask
    description: "the design: its decisions, its acceptance contract (requirements, WIRING, test files) and its scope"
    path: "${artifact_dir}/design.md"
    type: design.md@1
    format: markdown
    required: true
  # #2445: the design's ordered work steps, from its ```steps block — the work
  # plan build and pr-open find by what it contains (a `steps` list).
  - id: work_steps
    topic: ask
    description: "the ordered work items that deliver the change, each with the files it touches"
    path: "${artifact_dir}/design-steps.json"
    type: design-steps.json@1
    format: json
    required: false
  # ADR-068 §8: the working copy the model writes. It becomes design.md when it
  # passes design's checks; one still on disk is a try that did not pass, and
  # the next run starts from it.
  - id: design_draft
    topic: ask
    description: "design's working copy, before its checks pass"
    path: "${artifact_dir}/design-draft.md"
    type: design.md@1
    format: markdown
    required: false
  # ADR-054 §5 (#1844): the v2 result file is the primary output, so the engine
  # reads design's verdict, disposition and reason (a timed-out design is seen
  # as timed_out, not as "design.md present"). Written on every exit after
  # the model call (plugin.sh), so it is never stale.
  - id: design_result
    topic: requirement-findings
    description: "design's checks on the design; findings: a missing scope or acceptance block, a requirement with no status or test file, a WIRING file that is missing or is one of the test files, an issue requirement no SPEC covers"
    path: "${artifact_dir}/design-verdict.json"
    type: design-verdict.json@1
    format: json
    required: true
    primary: true
  # ADR-055 §9: this stage's statement of what it DID. required:true —
  # written on every terminal verdict, so absence means something went wrong.
  - id: design_summary
    topic: requirement-findings
    description: "design's summary of the round, and what it did about each finding"
    path: "${artifact_dir}/design-summary.md"
    type: design-summary.md@1
    format: markdown
    required: true
    summary: true
state:
  persisted: []
  reconstructed: []
