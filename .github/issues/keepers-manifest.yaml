  - id: wf-8
    title: "[Phase 3] Workflow: pipeline-resume.yml (resume after failure)"
    milestone: "Phase 3 — Daemon & Autonomous Ops"
    labels: [phase-3, keeper]
    body: |
      Resume a failed pipeline from its last checkpoint (works with adapt-10).
      Operator-trigger or automatic-after-flake.

      ---

      ## Cross-reference: resume orchestration

      This workflow uses **Pipeline-Resume Memory** per
      [ADR-006](../../docs/adr/ADR-006-resume-contract.md). Operator-triggered
      resume-from-failure via `zbuild pipeline resume` (#225). Integrated into
      CI lifecycle via #209 bootstrap (auto-resume detection) and #210
      teardown (status marking: complete/interrupted/aborted). Daemon-triggered
      counterpart: #120 (checkpoint-based recovery).
