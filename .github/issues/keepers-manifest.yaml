  - id: b-3
    title: "[B1] Skill registry success-rate self-improvement (closed loop)"
    milestone: "Phase 4 — CLI, UX, Skills, Personas"
    labels: [phase-4, keeper, learning-loop]
    spec_cite: "KEEPERS §B1.3, §F"
    legacy_cite: "legacy/scripts/lib/skill-memory.sh:144-176 (record + sort); legacy/scripts/sw-pipeline.sh:1703 (recommendations consumed); legacy/scripts/lib/pipeline-state.sh:325/608"
