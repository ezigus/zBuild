id: impact
name: Impact Analyzer Stage
kind: agent
version: 0.1.0
description: |
  Post-design adversarial consequence-finder (#842). Reads design.md's
  ```scope block (the exhaustive enumeration produced by the design stage)
  and finds files that the change touches, invalidates, or requires updating
  but that are MISSING from that scope block. Emits impact.json with a
  structured verdict (complete | incomplete) plus missing[]
  rendered for cycle feedback wiring back into the design stage. plan.json
  retained as secondary input for the deterministic shape-change prefilter.

hooks:
  run: impact_run
  cleanup: impact_cleanup

requires:
  core:
    - redaction
    - event-bus
    - state
    - router
  plugins: []

provides:
  role: impact_analyzer
  # ADR-001 §"Declared events" (#1717) — this plugin's own events, composed into
  # the engine's known set at load. Adding one here needs no engine-config edit.
  events:
    - impact.contract.violation
    - impact.envelope.malformed
    - impact.envelope.recovered
    - impact.hallucination.filtered
    - impact.scope.expanded
    - impact.scope.plateau
    - impact.verdict.complete
    - impact.verdict.error
    - impact.verdict.incomplete

config:
  # T2 (sonnet), not T1 (haiku): impact is the most tool-heavy agentic stage
  # (Reads every design-scope file + repo-wide greps; max_turns 45). On T1 its
  # per-turn latency × tool-turns blew past the then-180s router timeout once the
  # design scope grew (rc=124, run 20260619082915-41231). Aligns impact with its
  # T2 reasoning siblings (design/plan/review/build/test_assessment). (#960)
  # #1242: the T2 tier's higher per-turn latency also drove the wall-clock budget
  # up — router.timeout_s is now 600 (matching `design`), not the old 180.
  tier_default: T2
  valid_verdicts:
    - complete
    - incomplete
    # #1708: impact ALSO writes verdict=error on a non-timeout router failure
    # (plugin.sh:342) so the cycle's blocked-predicate can flag it. The original
    # declaration omitted it — the one manifest that adopted valid_verdicts was
    # itself incomplete, which is the case for enforcing it rather than trusting it.
    - error

inputs:
  - id: scope_manifest
    required: true
  - id: design
    required: true
  # Secondary: plan.json retained for the deterministic shape-change prefilter.
  - id: plan
    required: false

outputs:
  - id: impact
    path: "${artifact_dir}/impact.json"
    type: impact.json@1
    format: json
    required: true
    primary: true

state:
  persisted:
    - last_verdict
  reconstructed: []
