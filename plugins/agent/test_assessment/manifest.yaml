id: test_assessment
name: Test Assessment Stage
kind: agent
version: 0.1.0
description: |
  Pattern 1 LLM stage (#567). Consumes test-results.json, plan.json, and
  build-summary.json; emits test-assessment.json with a structured verdict
  (pass|fail|error|inconclusive), a root-cause diagnosis, required_changes[],
  agrees_with_build_complete, and an LLM-authored failure_summary_md. The
  rendered markdown sibling (test-assessment.md) is the build cycle's
  prior_test_assessment feedback source.

hooks:
  init: test_assessment_init
  run: test_assessment_run
  finalize: test_assessment_finalize
  cleanup: test_assessment_cleanup

requires:
  core:
    - redaction
    - event-bus
    - state
    - router
  plugins: []

provides:
  artifact_type: test-assessment.json
  schema_version: 1

config:
  tier_default: T2
  valid_verdicts:
    - pass
    - fail
    - error
    - inconclusive

inputs:
  - id: test_results
    type: file
    path: "${artifact_dir}/test-results.json"
    source: stage:test
    required: true
  - id: plan
    type: file
    path: "${artifact_dir}/plan.json"
    source: stage:plan
    required: true
  - id: build_summary
    type: file
    path: "${artifact_dir}/build-summary.json"
    source: stage:build
    required: false
  # 843-I (#924): test_assessment reads intake-baseline-ref.txt to compute the
  # cumulative branch numstat. Declared here (was an UNDECLARED dependency) so
  # the contract is honest. required:false mirrors intake's opt-out output
  # (ZBUILD_INTAKE_SKIP_BRANCH) + build's same input; the plugin still
  # fail-closes (rc=2) when the ref is absent rather than silently falling back
  # — that fail-closed is intentional (preserves the #847-era anti-regression).
  - id: intake_baseline_ref
    type: text
    path: "${state_dir}/intake-baseline-ref.txt"
    source: stage:intake
    required: false
  - id: design
    # carries the ```acceptance block (ADR-031); optional for backwards-compat
    type: file
    path: "${artifact_dir}/design.md"
    source: stage:design
    required: false

outputs:
  - id: test_assessment
    path: "${artifact_dir}/test-assessment.json"
    type: test-assessment.json
    required: true
    primary: true
  - id: test_assessment_md
    path: "${artifact_dir}/test-assessment.md"
    type: markdown
    required: false

state:
  persisted:
    - last_verdict
  reconstructed: []
