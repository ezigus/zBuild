id: test-author
name: Test Author
kind: agent
# #2482 (ADR-001): the ids this stage writes start with it.
id_prefix: TA
version: 0.1.0
# ADR-071: the topics of earlier stages' output its prompt's Previous work holds.
takes:
  - topic: ask
    for: "the design's requirements and test files, to write tests for"
  - topic: tests
    for: "the tests written so far, what each covers, and how they ran"
  # #2569 (ADR-071 §3): the findings a test must fix — the only ones it can.
  - topic: test-findings
    for: "what a test must change: an assertion that does not test what its requirement says, a requirement no test checks, a test that never reaches its assertion or passes on the old code, a test build says is wrong, a change to a test no requirement asks for"
description: |
  Authors the acceptance assertions from the design's SPEC sentences, in the
  target's own language, BEFORE build implements against them.

  Build used to own the assertion bodies (#1477, as a side effect of removing a
  bash stub-writer). That made the code and the assertion two artifacts of ONE
  reading of the SPEC: they agree by construction, so nothing comparing them can
  catch a misreading. Two runs shipped exactly that (ADR-036:512; #1978).

  Its ISOLATION is the mechanism, not a courtesy: this stage never sees the
  diff or the build summary. An author that can read the implementation would
  describe it, which is the original defect wearing a different hat.

  Never a mechanical stub-writer — #1477 removed one because a bash stub is
  nonsense in a pytest or Rust repo. Assertions are authored in the target's
  own language by a model.

hooks:
  run: test_author_run

requires:
  core:
    - redaction
    - event-bus
    - router

provides:
  role: test_author
  result_contract: 3
  events:
    - test_author.authored
    - test_author.committed
    - test_author.no_contract
    - test_author.result.write_failed
    - test_author.stale_tags_dropped
    - test_author.checks.failed
    # #2543 (ADR-069): a [code] requirement the old code already meets, reported
    # and its quote checked there.
    - test_author.already_done
    # #2464, #2466 (ADR-072 §4): a kept answer saved, used instead of a call,
    # or found stale and judged again — one event per item.
    - judge.kept.saved
    - judge.kept.used
    - judge.kept.stale
    # #2574 (ADR-072 §5): a part handed to another stage waits for it.
    - judge.handoff.waiting
    - judge.handoff.back
    - judge.handoff.capped
    - test_author.check.prompt_refused

config:
  tier_default: T2

# #2174: the author writes the acceptance testfiles INTO the repository.
capabilities:
  writes_repository: true

# ADR-017 §12 (#2507): every model call this stage makes, by name, with its
# tools in zbuild's words; the provider turns them into its own.
# check: does each assertion test its SPEC (ADR-072), a judge.
calls:
  main: [read-files, edit-files, run-commands, web-search, subagents, todo-list]
  check: [read-files, read-git, web-search, subagents]
# ADR-051 §2: the persona each call runs as — a call that judges work is
# not run as the persona that wrote it.
personas:
  main: test-strategist
  check: quality-assurance

outputs:
  # #2569 (ADR-071 §1): its check finds what a test must change: test-findings,
  # which only test-author takes — build may not edit a test. What only design
  # can fix reaches it through test_author_handoff below.
  - id: test_author_result
    topic: test-findings
    description: "the tests written for each requirement, with each file's fingerprint; findings: an assertion that does not test what its requirement says"
    path: "${artifact_dir}/test-author-result.json"
    type: test-author-result.json@1
    format: json
    required: true
    primary: true
  # #2565 (ADR-054 §6a, ADR-071 §1): a try that changed nothing and answered a
  # finding wrong or not mine hands it on here — a test that cannot meet its
  # SPEC is the design's to change, so design is shown it (#2569: design-findings).
  # #2569 (review): test-author writes here itself too, whenever a SPEC no test
  # can prove or a requirement the old code already meets ends its round; the
  # handoff adds to that, never in its place.
  - id: test_author_handoff
    topic: design-findings
    description: "what only design can fix: a SPEC no test can prove, a requirement the code from before this change already meets, and findings test-author's last try changed nothing for and answered wrong or not mine, with its answer"
    path: "${artifact_dir}/test-author-design-result.json"
    type: routed-findings.json@1
    format: json
    required: false
    handoff: true
  # ADR-055 §9: this stage's statement of what it DID.
  - id: test_author_summary
    topic: tests
    description: "which test covers which requirement"
    path: "${artifact_dir}/test-author-summary.md"
    type: test-author-summary.md@1
    format: markdown
    required: true
    summary: true