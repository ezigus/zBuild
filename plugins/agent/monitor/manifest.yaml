id: monitor
name: Monitor Stage
kind: agent
version: 0.1.0
description: |
  Monitor agent (kind:agent, T1). One-shot LLM health assessment (ADR-018 Pattern 1)
  over deploy artifacts already in state/artifacts/. Reads deploy-result.json (optional)
  and pr-url.txt (optional), calls route_to_model T1, and writes monitor-report.json
  (primary) with the verdict embedded (ADR-047 §3 — no separate verdict sidecar).
  ZBUILD_DRY_RUN=1 writes a mock report without calling route_to_model. Uses the shared
  llm-agent framework (ADR-028) for the OUTPUT CONTRACT + robust JSON-envelope parse;
  route_to_model owns redaction (ADR-043). Side-effecting probes (live HTTP polling,
  log tailing) are deferred to a future kind:tool plugin.
  # legacy-citation: pipeline-stages-monitor.sh:150 (stage_monitor)
  ADR-018 Pattern 1 (one-shot): assess → write report — no iteration loop.

hooks:
  run: monitor_stage_run
requires:
  core:
    - redaction
    - event-bus
    - state
    - router
  plugins: []

provides:
  role: monitor
  # ADR-001 §"Declared events" (#1717) — this plugin's own events, composed into
  # the engine's known set at load. Adding one here needs no engine-config edit.
  events:
    - monitor.alert
    - monitor.check
    - monitor.started

config:
  valid_verdicts:
    - pass
    - degraded
  tier_default: T1

inputs:
  - id: deploy_result
    required: false
  - id: pr_url
    required: false

outputs:
  - id: monitor_report
    path: "${artifact_dir}/monitor-report.json"
    type: monitor-report.json@1
    format: json
    required: true
    primary: true
  # ADR-055 §9: this stage's statement of what it DID. required:true —
  # written on every terminal verdict, so absence means something went wrong.
  - id: monitor_summary
    path: "${artifact_dir}/monitor-summary.md"
    type: monitor-summary.md@1
    format: markdown
    required: true
    summary: true

state:
  persisted: []
  reconstructed: []
