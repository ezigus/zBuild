id: review-lens
name: Review Lens (single, advisory)
kind: agent
# ADR-040 §5: convergence marker. `advisory` = NEVER blocks convergence; must
# NOT appear on a must-pass / exit_when path.
convergence: advisory
version: 0.1.0
description: |
  A single advisory review lens as its OWN isolated LLM stage (ADR-040 §3,
  EPIC #1129 C1). One isolated, redacted route_to_model call asks ONE lens's
  question over evidence it is fed, then writes a normalized lens-<name>.json
  ({name, score, findings[]}). Advisory only: it never recommends a merge
  action and never gates the pipeline — a failed or unparseable lens degrades
  to an empty result and the stage still returns 0.

  Parametrized per lens: the SAME plugin serves security / performance /
  red-team / correctness / scope etc. The lens id is read from
  ZBUILD_REVIEW_LENS_ID, else ZBUILD_CURRENT_STAGE, else config.lens. Packaged
  as a member of the ADR-039 `aggregate: advisory` lens group; the
  review-aggregator merges the per-lens results (the C3 cutover). This evolves
  ADR-038's single-stage fan-out into composable lens stages while keeping its
  evidence-fed, isolated-call contract (ADR-038 §2).

hooks:
  run: review_lens_run
  cleanup: review_lens_cleanup

requires:
  core:
    - redaction
    - event-bus
    - state
    - router
  plugins: []

# Bound by ROLE (resolver.sh reads provides.role). Deliberately NO
# provides.artifact_type: this stage is advisory, so it opts out of the blocking
# contract-violated machinery (contracts.sh). It always writes lens-<name>.json.
provides:
  role: review_lens
  schema_version: 1

config:
  tier_default: T2
  # Default lens identity when neither ZBUILD_REVIEW_LENS_ID nor
  # ZBUILD_CURRENT_STAGE is set (e.g. a bare manual invocation).
  lens: correctness

inputs:
  - id: scope_manifest
    type: file
    source: stage:intake
    required: true
  - id: diff_patch
    type: file
    path: "${artifact_dir}/diff.patch"
    source: stage:build
    required: true

outputs:
  - id: lens_result
    path: "${artifact_dir}/lens-${ZBUILD_REVIEW_LENS_ID}.json"
    type: review-lens.json
    required: true
    primary: true

state:
  persisted:
    - last_lens
    - last_score
  reconstructed: []
