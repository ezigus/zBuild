name: deferred-tracker

# Scans merged PR bodies for deferred-work signal phrases ("separate issue",
# "follow-up", "out of scope") and creates a consolidated daily triage GitHub
# issue. Operator picks which candidates to file.
#
# Triggers: 3× daily at 02:30, 10:30, 18:30 UTC — offset 30min from manifest-sync
# to prevent races on .github/issues/*.md commits.
#
# See ADR-020 for design rationale; issue #531 for implementation tracking.

on:
  schedule:
    - cron: '30 2 * * *'   # 02:30 UTC
    - cron: '30 10 * * *'  # 10:30 UTC
    - cron: '30 18 * * *'  # 18:30 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode: report (read-only) or apply (create issue + write log)'
        required: false
        default: 'apply'
        type: choice
        options:
          - report
          - apply

permissions:
  contents: write       # commit idempotency log to main
  pull-requests: read   # fetch merged PR bodies
  issues: write         # create/close triage issue

concurrency:
  group: deferred-tracker
  cancel-in-progress: false

jobs:
  scan:
    # Fork guard — don't run this workflow in forks
    if: github.repository == 'ezigus/zBuild'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run deferred-tracker
        id: scan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set +e
          MODE="${{ github.event.inputs.mode || 'apply' }}"
          bash scripts/deferred-tracker.sh --$MODE
          rc=$?
          # Exit code 10 from the script = changes applied
          if [[ $rc -eq 10 ]]; then
            echo "changes_made=true" >> "$GITHUB_OUTPUT"
            exit 0
          elif [[ $rc -ne 0 ]]; then
            exit $rc
          fi
          echo "changes_made=false" >> "$GITHUB_OUTPUT"

      - name: Commit idempotency log
        if: steps.scan.outputs.changes_made == 'true'
        run: |
          if git diff --quiet .github/issues/deferred-scanned-prs.md; then
            echo "log unchanged; nothing to commit"
            exit 0
          fi
          git add .github/issues/deferred-scanned-prs.md
          git commit -m "chore(deferred-tracker): record scanned PRs" \
                     -m "Auto-generated by .github/workflows/deferred-tracker.yml." \
                     -m "Triggered by: ${{ github.event_name }}"
          # Rebase against latest main to avoid races with manifest-sync
          # or concurrent deferred-tracker runs (review finding).
          for i in 1 2 3; do
            git pull --rebase origin main && \
              git push origin HEAD:main && break
            echo "push attempt $i failed; retrying..."
            sleep $((i * 5))
          done

      - name: Fail on unresolved drift
        run: |
          if [[ -f .deferred-drift ]]; then
            echo "deferred-tracker: multiple open deferred-candidate issues — human action required" >&2
            cat .deferred-drift >&2 2>/dev/null || true
            exit 1
          fi

      - name: Job summary
        if: always()
        run: |
          {
            echo "## deferred-tracker run"
            echo ""
            echo "- **Mode:** \`${{ github.event.inputs.mode || 'apply' }}\`"
            echo "- **Trigger:** \`${{ github.event_name }}\`"
            echo "- **Changes applied:** ${{ steps.scan.outputs.changes_made || 'no' }}"
            echo ""
            echo "Run \`bash scripts/deferred-tracker.sh --report\` locally for the full candidate list."
          } >> "$GITHUB_STEP_SUMMARY"
