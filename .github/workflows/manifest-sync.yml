name: manifest-sync

# Self-healing manifest. Catches drift caused by humans (web-UI closes,
# hand-merged PRs without linked issues, issues opened outside the manifest)
# that the local tooling can't see.
#
# Triggers: 3× daily (02:00, 10:00, 18:00 UTC). Event-based triggers (PR closed,
# issues closed, push to main) were removed — they caused cascade loops (issue #248).
# A pending-PR guard prevents duplicate auto-PRs when drift is already staged.
#
# See issue #227 for design rationale; issue #248 for noise-reduction changes.

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC
    - cron: '0 10 * * *'  # 10:00 UTC
    - cron: '0 18 * * *'  # 18:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode: report (read-only) or apply (edit manifest + PR)'
        required: false
        default: 'apply'
        type: choice
        options:
          - report
          - apply

permissions:
  contents: write       # to commit manifest changes via auto-PR
  pull-requests: write  # to open the auto-PR
  issues: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install yq
        run: |
          sudo curl -sSL "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64" -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Skip if sync PR already pending
        id: check_pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(gh pr list --label manifest-sync --state open --json number --jq 'length')
          if [[ "$count" -gt 0 ]]; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
            echo "Open manifest-sync PR already exists — skipping this run"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run manifest-sync
        id: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          MODE="${{ github.event.inputs.mode || 'apply' }}"
          bash scripts/manifest-sync.sh --$MODE
          rc=$?
          # Exit code 10 from the script = changes applied
          if [[ $rc -eq 10 ]]; then
            echo "changes_made=true" >> "$GITHUB_OUTPUT"
            exit 0
          elif [[ $rc -ne 0 ]]; then
            exit $rc
          fi
          echo "changes_made=false" >> "$GITHUB_OUTPUT"

      - name: Fail on unresolved drift
        run: |
          if [[ -f .manifest-drift ]]; then
            echo "manifest-sync: unresolved drift detected (no auto-PR created)" >&2
            cat .manifest-drift >&2
            exit 1
          fi

      - name: Finalize PR body
        if: steps.check_pending.outputs.pending == 'false' && steps.sync.outputs.changes_made == 'true'
        run: |
          sed -i \
            -e 's/%%TRIGGER%%/${{ github.event_name }}/g' \
            -e 's/%%RUN_ID%%/${{ github.run_id }}/g' \
            "${RUNNER_TEMP}/manifest-sync-pr-body.md"

      - name: Create PR with manifest changes
        if: steps.check_pending.outputs.pending == 'false' && steps.sync.outputs.changes_made == 'true'
        # Pending guard is here (not on the sync step) so report mode and drift
        # accumulation still work while a review PR is open; only PR creation is suppressed.
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            chore(manifest-sync): record drift from live issues + PRs

            Auto-generated by .github/workflows/manifest-sync.yml.
            Triggered by: ${{ github.event_name }}
          title: '[manifest-sync] Drift reconciliation'
          body-path: ${{ runner.temp }}/manifest-sync-pr-body.md
          branch: manifest-sync/auto
          delete-branch: true
          labels: |
            manifest-sync
            automated

      - name: Job summary
        if: always()
        run: |
          {
            echo "## manifest-sync run"
            echo ""
            echo "- **Mode:** \`${{ github.event.inputs.mode || 'apply' }}\`"
            echo "- **Trigger:** \`${{ github.event_name }}\`"
            echo "- **Changes applied:** ${{ steps.sync.outputs.changes_made || 'no' }}"
            echo ""
            echo "Run \`./scripts/manifest-sync.sh --report\` locally for the full drift report."
          } >> "$GITHUB_STEP_SUMMARY"
