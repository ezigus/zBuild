id: validate
name: Validate Agent
kind: agent
version: 0.1.0
description: |
  Validate agent (kind:agent, T2). Reads deploy-result.json; refuses if absent.
  Delegates to the health-check tool plugin for the actual HTTP/smoke probe.
  ZBUILD_DRY_RUN=1 writes mock validate-result.json with verdict=healthy instead.
  ADR-018 Pattern 1 (one-shot): read deploy-result → health-check probe → done.
  Health check is a single read query; no iteration loop needed (P1 rationale).
  No LLM calls (no route_to_model). kind:agent for guard/orchestration parity
  with the pr-delivery → pr-open delegation pattern (ADR-013 amendment, issue #757).
  # legacy-citation: pipeline-stages-monitor.sh:6 (stage_validate)

hooks:
  run: validate_agent_run
  cleanup: validate_agent_cleanup

requires:
  core:
    - redaction
    - event-bus
    - state
  plugins: []

provides:
  role: validate_agent
  # ADR-001 §"Declared events" (#1717) — this plugin's own events, composed into
  # the engine's known set at load. Adding one here needs no engine-config edit.
  events:
    - validate.input.missing
    - validate.probe.failed

config:
  valid_verdicts:
    - healthy
    - error
  tier_default: T2

inputs:
  - id: deploy_result
    required: true

outputs:
  - id: validate_result
    path: ${artifact_dir}/validate-result.json
    type: validate-result.json@1
    format: json
    required: true
    primary: true

state:
  persisted: []
  reconstructed: []
