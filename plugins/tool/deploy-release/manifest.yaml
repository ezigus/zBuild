id: deploy-release
name: Deploy Release Executor
kind: tool
version: 0.1.0
description: |
  Deploy-release tool executor (kind:tool, T0). Creates and pushes a git tag at
  HEAD (tag-based release) on behalf of the deploy agent — it does NOT call `gh`.
  No LLM calls. ZBUILD_DRY_RUN=1 writes a sentinel deploy-result.json without
  running git.
  Invoked by plugins/agent/deploy/plugin.sh (deploy_release_run).
  Issue #757.

hooks:
  run: deploy_release_run
  cleanup: deploy_release_cleanup

requires:
  core:
    - event-bus
    - state
  plugins: []

provides:
  role: deploy_release_executor
  # ADR-001 §"Declared events" (#1717) — this plugin's own events, composed into
  # the engine's known set at load. Adding one here needs no engine-config edit.
  events:
    - deploy.release.complete
    - deploy.release.dry_run
    - release.published
    - release.tagged

config:
  valid_verdicts:
    - deployed
    - error
  tier_default: T0

inputs:
  - id: pr_url
    required: false

outputs:
  - id: deploy_result
    path: ${artifact_dir}/deploy-result.json
    type: deploy-result.json@1
    format: json
    required: true
    primary: true

state:
  persisted: []
  reconstructed: []
