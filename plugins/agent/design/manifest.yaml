id: design
name: Design Stage
kind: agent
# #2482 (ADR-001): the ids this stage writes start with it.
id_prefix: DS
version: 0.1.0
# ADR-071: the topics of earlier stages' output its prompt's Previous work holds.
takes:
  - topic: ask
    for: "the issue and its requirements, to design against"
  - topic: requirement-findings
    for: "findings against the requirements or the design: what its acceptance contract or WIRING gets wrong"
  - topic: test-findings
    for: "what test-author's check found wrong in a test: a Given or Then no test can meet is the design's to rewrite"
description: |
  Design stage agent. Invokes the LLM (T2) to produce an ADR-style design.md
  with a ```steps block of ordered work items (#2445: the plan stage is gone)
  and the acceptance contract. It names no files (#2508): no scope block and no
  test file per requirement; a requirement it does not understand is an
  UNCLEAR line, with the assumption it went on with.
  # legacy-citation: pipeline-stages-intake.sh:1004 (stage_design)

hooks:
  run: design_stage_run
requires:
  core:
    - redaction
    - event-bus
    - state
    - router
  plugins: []

provides:
  role: designer
  result_contract: 3
  # ADR-001 §"Declared events" (#1717) — this plugin's own events, composed into
  # the engine's known set at load. Adding one here needs no engine-config edit.
  events:
    - design.stray.conflict
    - design.stray.recovered
    - design.checks.failed
    # #2464, #2466 (ADR-072 §4): a kept answer saved, used instead of a call,
    # or found stale and judged again — one event per item.
    - judge.kept.saved
    - judge.kept.used
    - judge.kept.stale
    # #2466 (ADR-072 §2): the old-code copy made, or not.
    - judge.base.created
    - judge.base.failed
    # ...and an older copy removed for a new base commit.
    - judge.base.released

config:
  tier_default: T2
  router:
    timeout_s: 600
    max_turns: 45

# ADR-017 §12 (#2507): every model call this stage makes, by name, with its
# tools in zbuild's words; the provider turns them into its own.
# coverage: the check of the design against the issue (ADR-072), a judge.
calls:
  main: [read-files, edit-files, run-commands, web-search, subagents, todo-list]
  coverage: [read-files, read-git, web-search, subagents]

outputs:
  - id: design
    topic: ask
    description: "the design: its decisions, its acceptance contract (requirements, WIRING) and the questions it could not settle"
    path: "${artifact_dir}/design.md"
    type: design.md@1
    format: markdown
    required: true
  # #2445: the design's ordered work steps, from its ```steps block — the work
  # plan build and pr-open find by what it contains (a `steps` list).
  - id: work_steps
    topic: ask
    description: "the ordered work items that deliver the change, each with the areas of the code it is about"
    path: "${artifact_dir}/design-steps.json"
    type: design-steps.json@1
    format: json
    required: false
  # ADR-068 §8: the working copy the model writes. It becomes design.md when it
  # passes design's checks; one still on disk is a try that did not pass, and
  # the next run starts from it.
  - id: design_draft
    topic: ask
    description: "design's working copy, before its checks pass"
    path: "${artifact_dir}/design-draft.md"
    type: design.md@1
    format: markdown
    required: false
  # ADR-054 §5 (#1844): the v2 result file is the primary output, so the engine
  # reads design's verdict, disposition and reason (a timed-out design is seen
  # as timed_out, not as "design.md present"). Written on every exit after
  # the model call (plugin.sh), so it is never stale.
  - id: design_result
    topic: requirement-findings
    description: "design's checks on the design; findings: a missing acceptance block, a requirement with no status, a WIRING file that is missing or is in a test folder, an issue requirement no SPEC covers, an UNCLEAR line not in its form"
    path: "${artifact_dir}/design-verdict.json"
    finding_topics: none
    type: design-verdict.json@1
    format: json
    required: true
    primary: true
  # ADR-055 §9: this stage's statement of what it DID. required:true —
  # written on every terminal verdict, so absence means something went wrong.
  - id: design_summary
    topic: requirement-findings
    description: "design's summary of the round, and what it did about each finding"
    path: "${artifact_dir}/design-summary.md"
    type: design-summary.md@1
    format: markdown
    required: true
    summary: true
state:
  persisted: []
  reconstructed: []
