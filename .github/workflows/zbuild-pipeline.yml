name: zbuild pipeline
run-name: "zbuild · issue #${{ inputs.issue_number || 'goal' }}"

# Reusable workflow: call from other workflows via `uses:` with workflow_call.
# Manual trigger available via workflow_dispatch for one-off runs.
#
# Issue #91 — stub that wires the zbuild CLI to GitHub Actions.
# Daemon-mode scheduling (#92) is separate.

on:
  workflow_call:
    inputs:
      issue_number:
        description: "GitHub issue number to run the pipeline for"
        required: true
        type: number
      goal:
        description: "Optional free-text goal (passed to --goal instead of --issue)"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Pass --dry-run to zbuild (no side effects)"
        required: false
        type: boolean
        default: false
      template:
        description: "Pipeline template id (e.g. simple, deployed). Empty = zbuild default (simple)."
        required: false
        type: string
        default: ""
    # NOTE: do not declare `secrets: GITHUB_TOKEN` here — GITHUB_TOKEN is a
    # reserved name auto-provided to every workflow. Declaring it makes the
    # workflow file invalid, which causes GitHub to emit a phantom "workflow
    # file issue" failure on every push to the default branch.

  workflow_dispatch:
    inputs:
      issue_number:
        description: "GitHub issue number to run the pipeline for"
        required: true
        type: number
      goal:
        description: "Optional free-text goal"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Dry run (no side effects)"
        required: false
        type: boolean
        default: false
      template:
        description: "Pipeline template id (e.g. simple, deployed). Empty = zbuild default (simple)."
        required: false
        type: string
        default: ""

permissions:
  contents: write # pr-open pushes the work branch (CI-3 #1002)
  issues: write
  pull-requests: write

jobs:
  pipeline:
    name: "Pipeline — issue #${{ inputs.issue_number }}"
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ZBUILD_WORKSPACE_BRANCH: zbuild/issue-${{ inputs.issue_number }}-ci
      # Model selection is governed by config/models.json + core/router — never hardcoded here.

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure git identity
        # CI-7 (#999): the build stage commits work with `git commit --author`,
        # but git ALSO needs a committer identity (user.name/user.email). A fresh
        # runner has none, so the commit fails → build.commit.skipped commit_failed
        # → the generated work is never committed and is lost. Set a bot identity.
        run: |
          git config --global user.name  "zbuild-pipeline[bot]"
          git config --global user.email "zbuild-pipeline[bot]@users.noreply.github.com"

      - name: Install Claude CLI
        # Pinned for reproducible CI (CI-2 #1001); the router shells out to `claude`.
        run: npm install -g @anthropic-ai/claude-code@2.1.183

      - name: Install zbuild engine from main (ADR-023 / #1629)
        # The engine must be STABLE for the whole run and must NOT be the tree
        # being edited. Previously this installed from the checkout and then ran
        # `bash scripts/zbuild`, so the engine WAS the branch under test: a build
        # stage editing core/ changed the machinery evaluating its own next stage
        # (#1305 never converged — same accessors moved four times in 5 iters).
        #
        # Clone main into $RUNNER_TEMP (outside the workspace, so the pipeline
        # cannot edit it) and install from there. The run step invokes the shim.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          engine_src="$RUNNER_TEMP/zbuild-engine"
          rm -rf "$engine_src"
          git clone --depth 1 --branch main \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$engine_src"
          engine_sha="$(git -C "$engine_src" rev-parse HEAD)"
          echo "::notice::engine: main@${engine_sha} (installed from $engine_src)"
          bash "$engine_src/install.sh"
          # Fail fast rather than silently falling back to the checkout copy.
          if [[ ! -x "$HOME/.local/bin/zbuild" ]]; then
            echo "::error::engine install produced no shim at \$HOME/.local/bin/zbuild"
            exit 1
          fi

      - name: Fetch prior work + state branches (ADR-050 #1581)
        # Prior-work reuse: a fresh runner's shallow checkout has neither the
        # issue's work branch (zbuild/issue-N-ci) nor its state branch
        # (zbuild/state/issue-N). Fetch both into remote-tracking refs so intake
        # can ADOPT the existing work branch (its gate checks refs/remotes/origin/…)
        # and the runner can RESTORE prior artifacts from the state branch. Guarded
        # so a first-ever run (no such branch on origin) is a clean no-op. Skipped
        # for goal-only runs (no issue number → no deterministic branch name).
        if: ${{ inputs.issue_number != '' }}
        env:
          # Pass the input through env (not inline ${{ }}) so a crafted value can
          # never be substituted into the shell before parsing (expression injection).
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          n="$ISSUE_NUMBER"
          work="zbuild/issue-${n}-ci"
          state="zbuild/state/issue-${n}"
          git fetch origin "refs/heads/${work}:refs/remotes/origin/${work}" 2>/dev/null \
            && echo "::notice::fetched prior work branch '${work}'" \
            || echo "::notice::no prior work branch '${work}' on origin (first run)"
          git fetch origin "refs/heads/${state}:refs/remotes/origin/${state}" 2>/dev/null \
            && echo "::notice::fetched prior state branch '${state}'" \
            || echo "::notice::no prior state branch '${state}' on origin (first run)"

      - name: Resolve state directory (outside the workspace)
        # #1638: state must NOT live inside the repository the run is editing.
        # CI-5 originally pinned it to ${{ github.workspace }}/state for one
        # reason: the upload step's path was workspace-relative and could not see
        # $HOME/.zbuild/state. upload-artifact accepts absolute paths, so that
        # constraint is gone — and with #1629 (engine outside) and #888 (work in
        # a per-run worktree), state was the last part of the run still inside
        # the target, which also split it from the worktree the work happens in.
        #
        # Exported via $GITHUB_ENV rather than a job-level `env:` because the
        # `runner` context is not available there. One definition, consumed by
        # both the pipeline step and the artifact upload, so the two can never
        # drift apart (tests/unit/ci-state-isolation-test.sh pins that).
        #
        # `if: always()` is load-bearing, not defensive boilerplate. A step with
        # no condition is SKIPPED once any earlier step has failed, so a failure
        # in checkout/install would leave ZBUILD_STATE_DIR unset — and the upload
        # below runs on always(), so it would receive an EMPTY `path:`. That is a
        # config error rather than "no files found", turning an early failure into
        # a second, more confusing one. This step is pure env bookkeeping with no
        # side effects, so running it unconditionally is always safe.
        if: always()
        run: |
          printf 'ZBUILD_STATE_DIR=%s\n' "$RUNNER_TEMP/zbuild-state" >> "$GITHUB_ENV"
          echo "::notice::state dir: $RUNNER_TEMP/zbuild-state (outside $GITHUB_WORKSPACE)"

      - name: Run pipeline
        # CI-2 (#1001): scope the API key to this step only (not all steps) + fail
        # fast with a clear error when the secret is missing.
        env:
          # CI-6 (#999): prefer the Claude subscription OAuth token (no per-token
          # API billing for dogfoods); fall back to a raw API key if that's all
          # that's configured. `claude setup-token` mints CLAUDE_CODE_OAUTH_TOKEN.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [[ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]]; then
            # OAuth token present → unset the API key so claude uses the
            # subscription, not pay-per-token billing (which also re-introduces
            # the "Credit balance is too low" failure mode).
            unset ANTHROPIC_API_KEY
          elif [[ -z "${ANTHROPIC_API_KEY:-}" ]]; then
            echo "::error::Neither CLAUDE_CODE_OAUTH_TOKEN nor ANTHROPIC_API_KEY is set — the LLM stages cannot authenticate. Set one in repo Settings → Secrets (run 'claude setup-token' for the OAuth token)."
            exit 1
          fi
          args=()
          if [[ -n "${{ inputs.goal }}" ]]; then
            args+=(--goal "${{ inputs.goal }}")
          else
            args+=(--issue "${{ inputs.issue_number }}")
          fi
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi
          if [[ -n "${{ inputs.template }}" ]]; then
            args+=(--template "${{ inputs.template }}")
          fi
          # ADR-023 / #1629: run the INSTALLED engine (from main), not the
          # checkout. `bash scripts/zbuild` would resolve _ZBUILD_ROOT to the
          # working tree this run is editing; the CLI now refuses that outright.
          # The target repo remains this workspace checkout, which is correct.
          "$HOME/.local/bin/zbuild" pipeline start "${args[@]}"

      - name: Push work branch (preserve work on pass OR fail)
        # CI-7 (#999): push the pipeline's work branch to origin no matter the
        # outcome, so a CI dogfood's output is never lost when the runner is torn
        # down. On failure the branch is there to inspect; on success it's ready
        # for a PR. Only pushes when the branch exists and carries commits.
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Via env (not inline ${{ }}) so a crafted value can't inject shell.
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          branch="${ZBUILD_WORKSPACE_BRANCH}"
          # Plain --force (not --force-with-lease): this is a disposable,
          # pipeline-owned branch (zbuild/issue-N-ci) that each run regenerates.
          # Last-writer-wins is the intended behavior here — the current run's
          # work is always what we want on origin (#947 CI-7 fix).
          # ADR-050 (#1581): push the STATE branch (durable prior-run artifacts:
          # design.md/plan.json/etc.) pass OR fail, so completed-stage work
          # survives the torn-down runner and the next run restores it. This
          # branch is never merged into the work branch or main (it's a sibling),
          # so it can't pollute the PR diff.
          #
          # #1878: this MUST come BEFORE the work-branch push. The work push
          # legitimately `exit 1`s on failure, and because both live in one
          # `run:` block that exit used to skip this push entirely — the opposite
          # of the "pushed independently" this comment used to claim. Observed on
          # run 31798796692: the work push was rejected under #1780 (App token
          # lacks `workflows` permission) and the whole run's artifacts were lost
          # with it. Durable state is the LAST thing that should be sacrificed to
          # a work-branch failure, so it goes first.
          if [[ -n "$ISSUE_NUMBER" ]]; then
            state_branch="zbuild/state/issue-${ISSUE_NUMBER}"
            if git rev-parse --verify --quiet "refs/heads/$state_branch" >/dev/null; then
              git push --force origin "refs/heads/$state_branch:refs/heads/$state_branch" \
                && echo "::notice::pushed state branch '$state_branch' to origin" \
                || echo "::warning::failed to push state branch '$state_branch'"
            else
              echo "::notice::no state branch '$state_branch' to push (nothing was snapshotted)"
            fi
          fi

          if ! git rev-parse --verify --quiet "refs/heads/$branch" >/dev/null; then
            echo "::warning::work branch '$branch' not found — pipeline aborted before intake created it; nothing to push"
          else
            new_commits="$(git rev-list --count "$branch" ^"${{ github.sha }}" 2>/dev/null || echo 0)"
            if [[ "$new_commits" -eq 0 ]]; then
              echo "::notice::'$branch' has no commits beyond base — build produced nothing to push"
            else
              git push --force origin "refs/heads/$branch:refs/heads/$branch" \
                && echo "::notice::pushed '$branch' ($new_commits commit(s)) to origin" \
                || { echo "::error::failed to push '$branch'"; exit 1; }
            fi
          fi

      - name: Collect claude session transcripts (diagnostics)
        # #1728: a SIGTERM'd stage emits zero bytes into stage-io, so the
        # incrementally-written session JSONL is the only evidence of what the
        # stage was doing. Collect it into the artifact tree on failure.
        #
        # These transcripts do NOT pass core/redaction/apply_scope_redaction:
        # that redactor is an awk text substitution, and JSONL is structurally
        # hostile to it — a bare-token regex misses secrets embedded mid-string
        # inside a JSON value, and a substitution that did fire would corrupt the
        # line's JSON syntax. The private-repository gate is the substituted
        # access control (CLAUDE.md's chokepoint rule is about LLM-bound text;
        # this is model *output* going to a non-public artifact store). If a
        # JSONL-aware redactor ever lands, drop the gate and wire it here.
        # Fails closed: an absent github.event.repository makes this false.
        if: failure() && github.event.repository.private
        run: |
          src="${HOME}/.claude/projects"
          dest="${ZBUILD_STATE_DIR}/claude-transcripts"
          if [[ ! -d "$src" ]]; then
            echo "::warning::no claude transcript dir at $src — nothing to collect"
            exit 0
          fi
          mkdir -p "$dest"
          # -type f excludes symlinks, so a planted link can't pull an arbitrary
          # file into the upload. Session dirs are mirrored (not flattened) so
          # two projects' identically-named sessions can't clobber each other.
          # The 6h window covers any possible run: this job sets no
          # timeout-minutes, so GitHub's 360-minute default is the hard ceiling.
          # GitHub runs `run:` under `bash -e`; one unreadable transcript must not
          # abort the loop and drop every later one, so each copy is soft-failed
          # and counted instead.
          n=0; bad=0
          while IFS= read -r f; do
            rel="${f#"$src"/}"
            if mkdir -p "$dest/$(dirname "$rel")" && cp "$f" "$dest/$rel"; then
              n=$((n + 1))
            else
              bad=$((bad + 1))
            fi
          done < <(find "$src" -type f -name '*.jsonl' -newermt '6 hours ago')
          echo "::notice::collected $n claude session transcript(s) into claude-transcripts/"
          [[ "$bad" -eq 0 ]] || echo "::warning::$bad transcript(s) could not be copied"

      - name: Upload pipeline artifacts
        # CI-5: upload on FAILURE too — a failed run is exactly when the router's
        # diagnostic stderr (route.sh:459, *.raw-claude-stderr.txt) is needed.
        # Capture the whole state tree (run dirs, events, stage-io diags), not
        # just artifacts/, so model-call failures are debuggable from CI.
        # #1638: absolute path from $GITHUB_ENV — state lives outside the
        # workspace now, so a workspace-relative `state/` would upload nothing.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: "pipeline-artifacts-issue-${{ inputs.issue_number }}-${{ github.run_id }}"
          # ADR-058 §3 (#1918): everything under the state dir EXCEPT scratch.
          # The engine now redirects TMPDIR into <state_dir>/scratch/<stage>, so
          # the whole run's throwaway working set — the test stage's rsync'd
          # staging tree, every router mktemp, and the model's own temp writes —
          # lands inside the uploaded path. Two reasons it must not ship:
          #   * volume — gigabytes per run, for files nothing diagnoses from;
          #   * disclosure — scratch holds RAW, unredacted prompts and model
          #     output. Uploading it would carry them off the machine, routing
          #     around the redaction chokepoint (ADR-004) that exists to stop
          #     exactly that. `artifacts/` and `stage-io/` stay, unchanged.
          # Both globs: `scratch/**` for the direct child the CI layout produces
          # ($RUNNER_TEMP/zbuild-state is the job folder), `**/scratch/**` for the
          # per-run `runs/<id>/` nesting the local default uses.
          path: |
            ${{ env.ZBUILD_STATE_DIR }}
            !${{ env.ZBUILD_STATE_DIR }}/scratch/**
            !${{ env.ZBUILD_STATE_DIR }}/**/scratch/**
          # `warn`, not `ignore`: the path is now computed rather than a literal,
          # so a wrong one would upload nothing and say nothing — the run would
          # look fine and the diagnostics would just be missing. warn surfaces it
          # as an annotation without failing runs that legitimately produce no
          # state (dry runs, aborts before the first stage).
          if-no-files-found: warn
