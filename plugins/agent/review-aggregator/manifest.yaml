id: review-aggregator
name: Review Aggregator (advisory merge-readiness)
kind: agent
# ADR-040 §5: convergence marker. `advisory` = NEVER blocks convergence; must
# NOT appear on a must-pass / exit_when path.
convergence: advisory
# #1986: this stage AGGREGATES the advisory stages in its flow — the advisory lenses it already merges into one merge-readiness report.
# The engine therefore ships only this aggregate downstream and
# suppresses those members' own summaries, so a prompt never carries
# a member's detail and this stage's rendering of that same detail
# (the #1979 duplication, arriving from the other side).
aggregates: advisory
version: 0.1.0
description: |
  Collapses N parallel advisory review-lens outputs into ONE advisory
  merge-readiness report (ADR-040 §3/§4, EPIC #1129 C2; evolves ADR-038).

  Reads the lens group's results from the engine-resolved `lens_result` input
  (the review_lenses map group's member paths, ADR-055 §1.4), de-dupes their findings by file + category + proximity window, carries
  the max severity + the union of contributing lenses + the union of messages,
  and renders an advisory report (review-report.json + review-report.md). The
  dedup/severity/union logic is ported verbatim from review-report's
  _rr_aggregate so the collapsed report matches the legacy single-stage fan-out.

  Does NO LLM call — it merges lens JSON only (no router, no redaction
  chokepoint traffic). Advisory only: it never recommends a merge action and
  never gates the pipeline. Every exit writes a v2 review-report.json and its
  .md summary; an empty lens set reports needs_attention (no review happened),
  never ready (#1753). rc 1 when the engine gave it no inputs or nowhere to
  write, or a signal stopped it.

  Bound by ROLE (resolver.sh reads provides.role). This stage is advisory: it
  used to opt out of contracts.sh's blocking contract-violated machinery by
  declining to declare provides.artifact_type. #1906 retired both the field and
  that check; artifact enforcement is now outputs[].required alone, which this
  stage already satisfies by always writing its first output. The C3 cutover
  wires it as the `aggregate: advisory` group's aggregator and retires
  review-report's hand-rolled fan-out.

hooks:
  run: review_aggregator_run
# hooks.cleanup is intentionally absent: this plugin holds no live resources
# that require teardown — ADR-054 §7. No router: section in config: either;
# this stage makes no LLM calls (ADR-017 §11 budget declaration not applicable).

requires:
  # `redaction` is mandatory for kind: agent (ADR-004 / validate_manifest), even
  # though this aggregator sends no text to a model — it only merges lens JSON.
  core:
    - redaction
    - event-bus
    - state
  plugins: []

provides:
  result_contract: 2
  role: review_aggregator
  # ADR-001 §"Declared events" (#1717) — this plugin's own events, composed into
  # the engine's known set at load. Adding one here needs no engine-config edit.
  events:
    - review.acceptance_coverage.gap
    - review.jq.parse_error
    - review.scope.violation
    - review.test_assessment.consumed
    - review.test_status.coerced
    - review.test_status.missing
    - review_aggregator.no_lenses

# Proximity-window de-dupe (lines): two findings on the same file+category
# within this many lines collapse to one. Controlled at runtime via the
# ZBUILD_RR_PROXIMITY_WINDOW env knob (default 10), shared with review-report
# (ADR-038). The proximity window is deliberately NOT declared in `config:` — the
# plugin reads the env directly, so declaring it here would be
# advertised-but-ignored (PR #1161 review). The `config:` block below exists only
# for `valid_verdicts`, which the engine DOES read (#1708).

config:
  # v2 verdicts: complete = aggregated; degraded = no report behind it (no
  # stage inputs, or stopped by a signal).
  # ADR-055 §4 — must be non-empty for a v2-compliant stage (#1708).
  valid_verdicts: [complete, degraded]

inputs:
  # The lens group's per-lens results: a map producer, so the engine hands over
  # the SET of member paths (ADR-055 §1.4). Required (#1842): with no lens
  # result there is nothing to aggregate, and the engine refuses the dispatch
  # rather than letting an absent review read as a clean one (#1753).
  - id: lens_result
    required: true

outputs:
  # FIRST entry — always written; keeps the stage green without opting into the
  # blocking artifact-contract (no provides.artifact_type above).
  - id: review_report
    path: "${artifact_dir}/review-report.json"
    type: review-report.json@1
    format: json
    required: true
    primary: true
  - id: review_report_md
    path: "${artifact_dir}/review-report.md"
    type: review-report.md@1
    format: markdown
    required: true
    # #1986: this stage suppresses the lens summaries it aggregates, so it MUST
    # publish one itself — otherwise the roster's findings reach no prompt at
    # all and the loss is silent. The merged merge-readiness report IS that
    # summary; it is what the lenses were rendered into.
    summary: true

state:
  persisted:
    - last_merge_readiness
    - last_lens_count
  reconstructed: []
