id: plan
name: Plan Stage
kind: agent
version: 0.1.0
description: |
  Plan stage agent (ADR-013, T2). Consumes a scope-manifest and goal text,
  routes to the T2 model tier, and produces a plan.json artifact describing
  the ordered implementation steps, file estimates, and notes.

hooks:
  run: plan_run
  cleanup: plan_cleanup

requires:
  core:
    - redaction
    - event-bus
    - state
    - router
  plugins: []

provides:
  artifact_type: plan.json
  role: planner
  schema_version: 1
  # ADR-001 §"Declared events" (#1717) — this plugin's own events, composed into
  # the engine's known set at load. Adding one here needs no engine-config edit.
  events:
    - plan.context.persisted
    - plan.context.resume_skipped
    - plan.context.resumed
    - plan.dod_violation
    - plan.envelope.recovered
    - plan.flow_wiring_missing
    - plan.scope.violation
    - plan.scope_too_large

config:
  # #1879: retry ONCE when the model runs out of turns. Worth taking only because
  # `role: checkpoint` below means attempt 2 resumes from what attempt 1 explored
  # — a retry on an empty context would just burn the budget twice (#1727).
  # Distinct from `retries`, which is timeout/rc=124-only and never fires here:
  # exhaustion surfaces as rc=1, which is why the #1708 run was never retried.
  router:
    retry_on_exhaustion: 1
  # Writes no .verdict on either verdict channel; the engine falls back to
  # pass for a well-formed primary (core/pipeline/verdict.sh). An ABSENT key
  # is a lint failure; the explicit [] is the claim (#1708).
  valid_verdicts: []
  tier_default: T2

inputs:
  - id: scope_manifest
    type: file
    source: stage:intake
    required: true
  - id: goal_string
    type: string
    source: external
    required: true

outputs:
  - id: plan
    path: ${artifact_dir}/plan.json
    type: plan.json
    required: true
    # ADR-020 amendment (#507): primary output. plan.json has no .verdict
    # field; runner falls back to pass when JSON is present and well-formed.
    primary: true
  # #1052: secondary, non-primary resumable exploration artifact. Persisted on
  # every terminal plan outcome (complete | scope_too_large) so a rerun can
  # resume from prior exploration instead of re-deriving from scratch. NOT
  # primary — plan.json stays the verdict-bearing primary (ADR-020 intact).
  # GitHub-artifact naming contract (Pillar E): when uploaded, the artifact
  # path must include <repo_id>/<scope_key>/<goal_hash> so two pipelines'
  # uploads never collide in a shared artifacts bucket.
  - id: plan-context
    path: ${artifact_dir}/plan-context.json
    type: plan-context.json
    required: false
  # #1879: the engine-generic stage checkpoint. `role: checkpoint` is what the
  # engine keys on — NOT the id, which must be unique across every stage in a
  # template (core/pipeline/contract-validator.sh raises OUTPUT_DUP on a repeat),
  # so a shared `id: checkpoint` across stages would fail validation.
  # required:false because a stage that converges early writes nothing.
  - id: plan-checkpoint
    path: ${artifact_dir}/plan-checkpoint.md
    type: checkpoint.md
    required: false
    role: checkpoint

state:
  persisted: [last_plan_steps, plan_context_status]
  reconstructed: [goal_text]
