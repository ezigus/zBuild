name: Claude Code Review

on:
  # Automatic: review every PR as it opens / updates / reopens.
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  # On-demand from the Actions tab: review a specific PR by number.
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string
  # On-demand from the PR itself: comment "/claude-review" on the pull request.
  issue_comment:
    types: [created]

jobs:
  claude-review:
    # Fire on any PR event, a manual dispatch, or a "/claude-review" comment on a
    # PR. (issue_comment fires for issues AND PRs — gate on .pull_request so plain
    # issue comments are ignored.)
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '/claude-review'))

    runs-on: ubuntu-latest
    # Review-only policy: this action MUST leave review comments for a human to
    # address — it MUST NOT commit or push code. `contents: read` is the hard
    # guarantee (the workflow token cannot push); `pull-requests`/`issues: write`
    # let it post the review + comments. Do NOT raise contents to write.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Resolve PR number
        id: pr
        env:
          # Pass event fields through the environment — never inline ${{ }} into
          # the run: body. Validate the resolved value is numeric before use.
          EVENT_NAME: ${{ github.event_name }}
          PR_FROM_PULL: ${{ github.event.pull_request.number }}
          PR_FROM_COMMENT: ${{ github.event.issue.number }}
          PR_FROM_DISPATCH: ${{ github.event.inputs.pr_number }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)      pr="$PR_FROM_PULL" ;;
            issue_comment)     pr="$PR_FROM_COMMENT" ;;
            workflow_dispatch) pr="$PR_FROM_DISPATCH" ;;
            *) echo "::error::unsupported event '$EVENT_NAME'"; exit 1 ;;
          esac
          if [[ ! "$pr" =~ ^[0-9]+$ ]]; then
            echo "::error::could not resolve a numeric PR number (got '$pr')"; exit 1
          fi
          echo "number=$pr" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # --comment makes /code-review POST its findings as inline PR comments +
          # a summary (without it the review runs but posts nothing — the cause of
          # the 0-comment runs). We deliberately do NOT pass --fix: this reviewer
          # comments only, never edits/commits (also enforced by contents: read).
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ steps.pr.outputs.number }} --comment'
          # No --allowedTools pin: the review-only guarantee is the *token*
          # (contents: read → the workflow token cannot push or commit; the prompt
          # passes no --fix), NOT a tool allowlist. A tight allowlist starved the
          # code-review plugin — it hit a permission_denial on a path it needed and
          # then posted nothing ("No buffered inline comments"), producing silent
          # 0-comment runs. Letting the plugin use its default toolset restores
          # reliable posting; the outcome-comment step below makes every run legible.
          claude_args: |
            --max-turns 30
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      - name: Post review outcome comment
        # A fresh comment on EVERY run (each push triggers a run), stamped with the
        # reviewed commit — so a clean run, a starved run, and a crashed run are
        # never indistinguishable silence. Runs even when the review step failed.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
          REVIEW_OUTCOME: ${{ steps.claude-review.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          sha="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid -q .headRefOid 2>/dev/null || echo '')"
          short="${sha:0:7}"
          # Best-effort health signals from the action's execution log.
          exec_file="${RUNNER_TEMP}/claude-execution-output.json"
          denials=0; is_error=false
          if [[ -f "$exec_file" ]]; then
            denials="$(jq -rs '[.. | objects | select(has("permission_denials_count")) | .permission_denials_count] | last // 0' "$exec_file" 2>/dev/null || echo 0)"
            is_error="$(jq -rs '[.. | objects | select(has("is_error")) | .is_error] | last // false' "$exec_file" 2>/dev/null || echo false)"
          fi
          [[ "$denials" =~ ^[0-9]+$ ]] || denials=0
          # Count inline review comments attached to THIS commit (this push's review).
          n_inline="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/comments" \
            --jq "[.[] | select(.commit_id==\"${sha}\")] | length" 2>/dev/null || echo '?')"

          if [[ "$REVIEW_OUTCOME" != "success" || "$is_error" == "true" ]]; then
            status="❌ **Claude review did not complete** for \`${short}\` — see the run log."
          elif [[ "$denials" -gt 0 ]]; then
            status="⚠️ **Claude review may be incomplete** for \`${short}\` — ${denials} tool-permission denial(s); results may be partial."
          elif [[ "$n_inline" == "0" ]]; then
            status="✅ **Claude review of \`${short}\`: no findings.**"
          else
            status="🔎 **Claude review of \`${short}\`: ${n_inline} inline comment(s) posted above.**"
          fi
          # shellcheck disable=SC2016  # backticks are literal markdown code spans, not command substitution
          printf '%s\n\n_Reviewed on push of `%s` · [run log](%s)_\n' \
            "$status" "$short" "$RUN_URL" | gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file -
