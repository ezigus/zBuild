id: cycle-resume
name: Cycle used by resume integration tests
defaults:
  strategy: fanout
stages:
  - id: build-test
    type: cycle
    stages: [build, test]
    until:
      stage: test
      field: verdict
      op: eq
      value: pass
    max_iterations: 5
    on_max: continue

stage_definitions:
  build:
    roles: [builder]
  test:
    roles: [tester]
