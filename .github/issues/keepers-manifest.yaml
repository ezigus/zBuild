    milestone: "Phase 0.5 — MVP Pipeline & Distribution"
    labels: [phase-0, foundation]
    body: |
      plugins/tool/orch-ruflo-hive/ — opt-in. Wraps ruflo hive-mind init,
      spawn, coordination, memory.

      Scope:
      - Manifest provides.role: orchestrator-backend + capabilities:
        [parallel_spawn, hive_mind, queen_collapse, shared_memory,
         distributed] + requires.bin: [ruflo]
      - Implements all three strategies natively via ruflo coordination
        orchestrate --mode <stage>
      - Per-stage namespace: stage-${stage}-${platform}-${run_id}
      - fallback_to_default_on_error: true (graceful → bash-parallel)
      - Tests with ruflo mock + degraded fallback
