id: plan
name: Plan Stage
kind: agent
version: 0.1.0
# ADR-071: the topics of earlier stages' output its prompt's Previous work holds.
takes:
  - topic: ask
    for: "the issue and its requirements, to split into work"
description: |
  Plan stage agent (ADR-013, T2). Consumes a scope-manifest and goal text,
  routes to the T2 model tier, and produces a plan.json artifact: the issue
  split into an ordered list of work items, each with the areas it touches.

hooks:
  run: plan_run
  # ADR-054 §7 (#1835): plan holds no live resources (no spawned processes, no
  # locks, no open handles beyond what atomic_write closes) and declares no cleanup hook.
requires:
  core:
    - redaction
    - event-bus
    - state
    - router
  plugins: []

provides:
  role: planner
  result_contract: 3

config:
  # #2439 (ADR-054 §6a): plan no longer repeats its own model call. A plan that
  # times out or runs out of turns says so, and the engine runs it again (the
  # template's `retry:`, else 1), resuming from the notes file every stage keeps
  # (#1727, #1879). Measured on runs 20260817184959-54622 and
  # 20260817192215-57314 (issue #1832): plan was killed at 300s mid-tool-use.
  router:
    timeout_s: 300
    max_turns: 45
  tier_default: T2

outputs:
  - id: plan
    topic: ask
    description: "the work items the issue splits into, and any open questions"
    path: ${artifact_dir}/plan.json
    type: plan.json@1
    format: json
    required: true
    # ADR-020 amendment (#507): primary output. plan.json has no .verdict
    # field; runner falls back to pass when JSON is present and well-formed.
    primary: true
  # written on every terminal verdict, so absence means something went wrong.
  - id: plan-summary.md
    topic: ask
    description: "plan's summary"
    path: "${artifact_dir}/plan-summary.md"
    type: plan-summary.md@1
    format: markdown
    required: true
    summary: true
  # ADR-060 §6: a plan that failed plan's checks, kept for the next try; a
  # valid plan clears it.
  - id: plan_rejected
    topic: ask
    description: "a plan that failed plan's checks, kept for its next try"
    path: "${artifact_dir}/plan-rejected.json"
    type: plan.json@1
    format: json
    required: false

state:
  persisted: [last_plan_steps]
  reconstructed: [goal_text]
