id: cycle-divergence
name: Cycle whose failure_count grows
defaults:
  strategy: fanout
stages:
  - id: build
    roles: [builder]
  - id: test
    roles: [tester]
cycles:
  - id: build-test
    stages: [build, test]
    until:
      stage: test
      field: verdict
      op: eq
      value: pass
    max_iterations: 6
    on_max: continue
    divergence:
      window: 2
