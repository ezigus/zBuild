name: zbuild scheduled release

# Weekly release workflow (REL-F #1357; converged onto the shared flow in #1491).
# DRY: this cron does not cut a release itself — it dispatches the shared Release
# workflow (branch → PR → publish), the ONE flow behind local/manual/cron triggers.
#
# Day-of-week configurability seam: edit the 5th field of the cron expression below.
# Current default: Mondays at 09:00 UTC ('1' = Monday in cron DOW field, 0/7 = Sunday).
#
#   ┌──────────── minute  (0)
#   │  ┌─────────── hour    (9)
#   │  │  ┌────────── day-of-month (*)
#   │  │  │  ┌─────── month       (*)
#   │  │  │  │  ┌──── day-of-week (1 = Monday)
#   0  9  *  *  1
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — print planned release, mutate nothing'
        type: boolean
        default: false
      cadence:
        description: 'Release cadence'
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

# actions:write lets this cron dispatch the shared Release workflow. The
# dispatched release.yml carries its own contents/pull-requests permissions; this
# thin trigger needs only actions:write (to dispatch) + contents:read (checkout).
permissions:
  actions: write
  contents: read

# Serialize releases: a manual dispatch must never race a scheduled run on
# version computation, git tagging, or publish. Do NOT cancel in progress — a
# half-finished release (tag created, publish pending) must run to completion.
concurrency:
  group: zbuild-release
  cancel-in-progress: false

jobs:
  trigger-release:
    runs-on: ubuntu-latest
    # Fork guard: only the canonical repo cuts releases. `if:` is a JOB-level key
    # (it is silently ignored at workflow top level), so it lives here.
    if: github.repository == 'ezigus/zBuild'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # #1491 — DRY: the weekly cron does NOT cut a release itself. It dispatches
      # the ONE shared Release flow (release.yml): open a Release PR → auto-merge
      # on green → publish on merge. skip_if_no_issues=true makes empty weeks
      # no-op (release.yml opens no PR). One flow, three triggers: local, manual
      # dispatch, and this cron. No direct release-script cut happens here anymore.
      - name: Dispatch the shared Release flow (branch → PR → publish)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pass workflow_dispatch inputs through the environment — NEVER inline
          # ${{ github.event.inputs.* }} into the run: script (that is a shell
          # injection vector; type:choice is not enforced on API dispatch).
          INPUT_CADENCE: ${{ github.event.inputs.cadence || 'patch' }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          # Validate cadence against the known enum before use — a scheduled run
          # has an empty input (defaulted to patch above); a dispatched run could
          # carry anything. Reject anything unexpected rather than trust it.
          case "$INPUT_CADENCE" in
            patch|minor|major) cadence="$INPUT_CADENCE" ;;
            *) echo "::error::invalid cadence '$INPUT_CADENCE' (want patch|minor|major)"; exit 1 ;;
          esac
          dry_run="false"
          [[ "$INPUT_DRY_RUN" == "true" ]] && dry_run="true"

          # Trigger release.yml on the default branch. skip_if_no_issues=true → the
          # flow opens no PR on an empty week; auto_merge=true → the Release PR
          # merges itself on green, and the publish job tags + publishes on merge.
          gh workflow run release.yml \
            --ref main \
            -f cadence="$cadence" \
            -f skip_if_no_issues=true \
            -f auto_merge=true \
            -f dry_run="$dry_run"
