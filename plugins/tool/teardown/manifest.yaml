id: teardown
name: Teardown Stage
kind: tool
version: 0.1.0
description: |
  Iterates over all stages that executed in the current pipeline run,
  resolves each stage's plugin directory, and calls plugin_hook_call cleanup
  with scope=release for each. Always returns 0 — cleanup failures are
  recorded via stage.cleanup.failed events, never propagated.
  Dispatched by the runner from its EXIT trap at every pipeline exit path
  (success, non-zero rc, SIGINT, SIGTERM, timeout) with scope pinned to
  release. No run path can select scope=purge: the runner exports
  release, overriding any ambient value, and an unrecognised scope
  degrades to release. purge is reachable only via clean.yaml, by an
  operator who asks for it.

hooks:
  run: teardown_run

requires:
  core:
    - event-bus
    - state
  plugins: []

provides:
  role: teardown
  result_contract: 2
  # ADR-001 §"Declared events" (#1717) — this plugin's own events, composed into
  # the engine's known set at load. Adding one here needs no engine-config edit.
  events:
    - teardown.complete
    - teardown.dry_run.would_clean
    - teardown.pgroups.killed
    - teardown.result.write_failed
    - teardown.scratch.purged
    - teardown.scope.invalid
    - teardown.start

config:
  valid_verdicts:
    - complete
    - degraded

outputs:
  - id: teardown_result
    path: "${artifact_dir}/teardown-result.json"
    type: teardown-result.json@1
    format: json
    required: true
    primary: true
  # ADR-055 §9: this stage's statement of what it DID. required:true —
  # written on every terminal verdict, so absence means something went wrong.
  - id: teardown_summary
    path: "${artifact_dir}/teardown-summary.md"
    type: teardown-summary.md@1
    format: markdown
    required: true
    summary: true
