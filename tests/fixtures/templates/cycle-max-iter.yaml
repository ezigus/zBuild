id: cycle-max-iter
name: Cycle that exhausts max_iterations
defaults:
  strategy: fanout
stages:
  - id: build-test
    type: cycle
    stages: [build, test]
    until:
      stage: test
      field: verdict
      op: eq
      value: pass
    max_iterations: 3
    on_max: continue

stage_definitions:
  build:
    roles: [builder]
  test:
    roles: [tester]
