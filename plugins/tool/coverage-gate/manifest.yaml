id: coverage-gate
name: Coverage Read-out Gate
kind: tool
# ADR-040 §5: convergence marker. `gate` = mechanical must-pass gate (dormant in
# simple.yaml's roster today; marker keeps it correct if/when reused).
convergence: gate
version: 0.1.0
description: |
  Deterministic, LLM-free T0 read-out gate (ADR-040, issue #1135, EPIC #1129).
  A THIN read-out gate: it consumes the SHARED test-framework result
  (test-results.json, produced by the test stage / #1133) and NEVER re-runs the
  coverage tool. Reads the `coverage` block and maps it to a verdict:
    - coverage.status skipped | error      → verdict=skip
    - coverage.status below_floor          → verdict=fail
    - coverage.status measured & pct<floor → verdict=fail
    - otherwise                            → verdict=pass
  Floor preference: the `floor` recorded in test-results.json wins; otherwise
  ZBUILD_COVERAGE_FLOOR (default 29). When test-results.json is absent or carries
  no `coverage` block → verdict=skip.
  Always returns rc=0; the verdict lives in coverage-result.json (ADR-040
  verdict-in-artifact convention, mirrors shape-floor).
  ADR-037 §3 invariant: T0 tool stages contain no LLM/router calls.

hooks:
  run: coverage_gate_run
  cleanup: coverage_gate_cleanup

requires:
  core:
    - event-bus
    - state
  plugins: []

provides:
  role: coverage_gate
  # ADR-001 §"Declared events" (#1717) — this plugin's own events, composed into
  # the engine's known set at load. Adding one here needs no engine-config edit.
  events:
    - coverage_gate.fail
    - coverage_gate.pass
    - coverage_gate.skip

config:
  valid_verdicts:
    - pass
    - fail
    - skip
  tier_default: T0
  coverage_floor: 29

inputs:
  - id: test_results
    required: false

outputs:
  - id: coverage_result
    path: "${artifact_dir}/coverage-result.json"
    type: coverage-result.json@1
    format: json
    required: true
    primary: true
  # #1988: the failure detail only this gate knows. It reached a prompt
  # only through the aggregator's rendering before; `summary: true` (#1976)
  # delivers it directly. required:true — ADR-055 §9: written on every
  # terminal verdict, so absence means something went wrong, full stop.
  - id: coverage_detail
    path: "${artifact_dir}/coverage-detail.md"
    type: coverage-detail.md@1
    format: markdown
    required: true
    summary: true

state:
  persisted: []
  reconstructed: []
