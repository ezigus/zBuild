name: Release

on:
  workflow_dispatch:
    inputs:
      major:
        description: "Override major (A) version component"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Dry run — compute version/notes, open no PR"
        required: false
        default: false
        type: boolean
      auto_merge:
        description: "Enable auto-merge on the Release PR when CI is green"
        required: false
        default: false
        type: boolean
      cadence:
        description: "Release cadence: minor (default) or major"
        required: false
        default: "minor"
        type: choice
        options:
          - minor
          - major
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  open-release-pr:
    name: Open Release PR
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install zbuild
        run: ./install.sh

      # Validate untrusted inputs ONCE, up front. `major` must be empty or
      # digits-only — anything else is refused before it can reach a shell.
      # We never interpolate ${{ inputs.* }} into a run: string; inputs flow
      # in through env: and are referenced as quoted shell vars.
      - name: Validate inputs
        env:
          MAJOR: ${{ inputs.major }}
          CADENCE: ${{ inputs.cadence }}
        run: |
          if [[ -n "$MAJOR" && ! "$MAJOR" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid 'major' input: must be empty or digits only (got: $MAJOR)"
            exit 1
          fi
          case "$CADENCE" in
            minor|major) ;;
            *) echo "::error::Invalid 'cadence' input: must be 'minor' or 'major' (got: $CADENCE)"; exit 1 ;;
          esac

      - name: Validate — dry-run pass
        id: validate
        env:
          MAJOR: ${{ inputs.major }}
          CADENCE: ${{ inputs.cadence }}
        run: |
          # Build args as an array — never an unquoted string — so a value can
          # neither word-split nor glob-expand into extra release.sh flags.
          args=(--dry-run)
          if [[ -n "$MAJOR" ]]; then
            args+=(--major "$MAJOR")
          fi
          args+=("--${CADENCE}")
          bash scripts/release.sh "${args[@]}" 2>&1 | tee /tmp/dry-run-out.txt
          # Capture the planned tag (vN.N…) so we can name the PR. Two lines
          # begin 'planned tag:'; only the first is a bare tag — the second
          # embeds a git command. Anchoring on a 'v' immediately after the
          # padding matches the tag line and skips the 'git tag …' line.
          # Validate its shape before it ever reaches git/gh.
          version="$(grep -oP '^planned tag:\s+\Kv[\d.]+' /tmp/dry-run-out.txt | head -1 || true)"
          if [[ -n "$version" && ! "$version" =~ ^v[0-9]+(\.[0-9]+)+$ ]]; then
            echo "::error::Refusing malformed version parsed from release.sh: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # DOC-F (#1420): regenerate the wiki pages + refresh the README docs block
      # so the regenerated docs ride THIS release PR. Regen short-circuits (no
      # model call) when every page is already current; a stale source without a
      # token fails closed, blocking the release — the correct outcome. Runs
      # BEFORE the prepare step so the (still on main, uncommitted) regenerated
      # files are swept onto the release branch by release.sh's prepare commit.
      - name: Regenerate wiki docs + refresh README (DOC-F)
        if: inputs.dry_run != true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: bash scripts/zbuild docs publish --regen-only

      - name: Prepare release branch (bump + commit on branch)
        id: apply
        if: inputs.dry_run != true
        env:
          MAJOR: ${{ inputs.major }}
          CADENCE: ${{ inputs.cadence }}
          FALLBACK_VERSION: ${{ steps.validate.outputs.version }}
        run: |
          # #1490: the PREPARE pass — NO --force. release.sh bumps VERSION+CHANGELOG,
          # regenerates docs (idempotent no-op after the step above), then creates
          # release/auto-YYYYMMDD and COMMITS the bump on that branch — never
          # mutating main in place, never tagging/publishing. Same array-quoting.
          branch="release/auto-$(date +%Y%m%d)"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          args=()
          if [[ -n "$MAJOR" ]]; then
            args+=(--major "$MAJOR")
          fi
          args+=("--${CADENCE}")
          # If release.sh exits nonzero (gate refused) we skip PR creation.
          # `skip` is ALWAYS written so the create-PR step can gate explicitly.
          # ZBUILD_RELEASE_BRANCH pins the branch release.sh creates + commits on.
          set +e
          out="$(ZBUILD_RELEASE_BRANCH="$branch" bash scripts/release.sh "${args[@]}" 2>&1)"
          rc=$?
          set -e
          echo "$out"
          if [[ $rc -ne 0 ]]; then
            echo "release.sh exited $rc — gate refused. Skipping PR creation."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Prefer the validated version from the dry-run validate step; fall back
          # to parsing the release/<version> branch line release.sh emits.
          version="$FALLBACK_VERSION"
          if [[ -z "$version" ]]; then
            ver="$(printf '%s' "$out" | grep -oP 'branch release/\K[0-9][0-9.]*' | head -1 || true)"
            [[ -n "$ver" ]] && version="v${ver}"
          fi
          if [[ -z "$version" || ! "$version" =~ ^v[0-9]+(\.[0-9]+)+$ ]]; then
            echo "::error::Refusing malformed version for PR: '$version'"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Push release branch and open PR
        if: inputs.dry_run != true && steps.apply.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.apply.outputs.version }}
          BRANCH: ${{ steps.apply.outputs.branch }}
          AUTO_MERGE: ${{ inputs.auto_merge }}
        run: |
          # #1490: release.sh (prepare) already created BRANCH and committed the
          # bump on it. Push that branch + open the PR here. VERSION + BRANCH both
          # flow in via env: and are only ever referenced as quoted vars.
          git push origin "$BRANCH"
          pr_url="$(gh pr create \
            --title "Release ${VERSION}" \
            --body "Automated Release PR for ${VERSION}. Merge to trigger publish." \
            --base main \
            --head "$BRANCH")"
          echo "PR: $pr_url"
          if [[ "$AUTO_MERGE" == "true" ]]; then
            gh pr merge --auto --squash "$pr_url"
          fi

  publish:
    name: Publish Release
    # SECURITY: publish ONLY on the workflow's OWN release branches. The
    # open-release-pr job is the sole creator of `release/auto-*` branches, so
    # gating on the merged PR's HEAD ref prevents any contributor from
    # publishing a release by merging a hand-titled "Release v…" PR.
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'release/auto-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install zbuild
        run: ./install.sh

      - name: Publish release (tag + tarball + gh release create)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Intentional post-merge --force: the PR already passed gates + review;
        # the security control is the trigger restriction above, not the flag.
        run: bash scripts/release.sh --force

      # DOC-F (#1420): the by-hand-equivalent publish step — push the (already
      # merged, already regenerated) docs/wiki/ to the project .wiki.git repo.
      # Runs over HTTPS with the Actions token; `contents: write` covers the wiki.
      - name: Publish generated docs to the wiki (DOC-F)
        env:
          ZBUILD_WIKI_REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git
        run: bash scripts/zbuild docs publish --wiki-only --version "v$(cat VERSION 2>/dev/null || echo 0.0.0)"
