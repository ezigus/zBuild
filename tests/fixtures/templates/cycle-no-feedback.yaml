id: cycle-no-feedback
name: Cycle without feedback wiring
defaults:
  strategy: fanout
stages:
  - id: build-only
    type: cycle
    stages: [build]
    until:
      stage: build
      field: verdict
      op: eq
      value: pass
    max_iterations: 2
    on_max: continue

stage_definitions:
  build:
    roles: [builder]
