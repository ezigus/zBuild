id: simple
name: Simple Pipeline
extends: null

# ADR-037 §4: per-template merge policy. Wired to runtime behavior in #975.
merge_policy: auto_unless_flagged

defaults:
  strategy: fanout

# ─── Flow ────────────────────────────────────────────────────────────────────
# Flat 8-stage simplified pipeline (ADR-037 EPIC #966 I2+I3+I4).
# Omits: impact, test_assessment, acceptance-gate, cq-* stages (targeted for
# removal in #979). Starts closer to the intended final shape so subsequent
# issues (#969-#979) can build the new pipeline here while standard.yaml
# continues to serve production.
#
# Stage order (issue #970): objective-gate moved to after test (index 5) so
# post-build artifacts (coverage report, git diff) are available for the
# coverage-floor and scope-adherence gates.
#   After test:   objective-gate (#970) then evidence-fed review stages (#972, #973, #974)
flow:
  - intake
  - plan
  - design
  - build
  - test
  - objective-gate
  # TODO #972: insert evidence-collection stage here
  - review
  - pr

# ─── intake (leaf) ───────────────────────────────────────────────────────────
intake:
  gate: auto
  roles: [intake]
  io:
    destinations: [file, stdout]
    tail_lines: 200

# ─── plan (leaf) ─────────────────────────────────────────────────────────────
plan:
  gate: auto
  roles: [planner]
  io:
    destinations: [file, stdout]
    tail_lines: 200
  router:
    timeout_s: 300
    max_turns: 25

# ─── objective-gate (leaf) ───────────────────────────────────────────────────
# T0 tool stage (ADR-013, ADR-037 §1, issue #969): runs the test suite +
# lint/shellcheck; hard-blocks on any failure; no LLM call.
objective-gate:
  gate: auto
  roles: [objective-gate]
  io:
    destinations: [file, stdout]
    tail_lines: 200

# ─── design (leaf) ───────────────────────────────────────────────────────────
design:
  gate: auto
  roles: [designer]
  io:
    destinations: [file, stdout]
    tail_lines: 200
  router:
    timeout_s: 600
    max_turns: 0

# ─── build (leaf) ────────────────────────────────────────────────────────────
build:
  gate: auto
  roles: [builder]
  io:
    destinations: [file, stdout]
    tail_lines: 200
  router:
    timeout_s: 900
    max_turns: 0

# ─── test (leaf) ─────────────────────────────────────────────────────────────
test:
  gate: auto
  roles: [tester]
  io:
    destinations: [file, stdout]
    tail_lines: 200

# ─── review (leaf) ───────────────────────────────────────────────────────────
# TODO #974: wire evidence-fed review inputs here
review:
  gate: auto
  roles: [reviewer]
  io:
    destinations: [file, stdout]
    tail_lines: 200
  router:
    timeout_s: 300
    max_turns: 25

# ─── pr (leaf) ───────────────────────────────────────────────────────────────
# T0 tool stage (ADR-013): opens the pull request; no LLM call.
pr:
  gate: auto
  roles: [pr]
  io:
    destinations: [file, stdout]
    tail_lines: 200
