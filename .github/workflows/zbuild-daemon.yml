name: zbuild daemon (label-triggered pipeline)
run-name: "zbuild · issue #${{ github.event.issue.number }} — ${{ github.event.issue.title }}"

# Daemon-in-Actions mode — issue #92.
#
# Watches for issues labeled `zbuild-run` and invokes the reusable
# zbuild-pipeline workflow automatically.  After the pipeline completes
# (success or failure) the label is removed so the issue can be re-triggered
# by adding the label again, and a comment with the run URL is posted.
#
# The trigger label is configurable via the ZBUILD_TRIGGER_LABEL env var.
# Model selection is governed by config/models.json + core/router — no model
# names are hardcoded here (ADR-003).

on:
  issues:
    types: [labeled]

env:
  ZBUILD_TRIGGER_LABEL: zbuild-run

permissions:
  contents: write # pr-open pushes the work branch (CI-3 #1002)
  issues: write
  pull-requests: write

# ─── Job 1: guard — only proceed when the correct label was applied ───────────
jobs:
  trigger:
    name: "Trigger guard — check label"
    runs-on: ubuntu-latest
    if: github.event.label.name == 'zbuild-run'
    outputs:
      issue_number: ${{ github.event.issue.number }}
    steps:
      - name: Confirm trigger label matched
        run: |
          echo "Issue #${{ github.event.issue.number }} labeled '${{ github.event.label.name }}' — proceeding."

  # ─── Job 2: run the reusable zbuild pipeline ─────────────────────────────────
  pipeline:
    name: "Pipeline — issue #${{ needs.trigger.outputs.issue_number }}"
    needs: trigger
    uses: ./.github/workflows/zbuild-pipeline.yml
    with:
      issue_number: ${{ fromJson(needs.trigger.outputs.issue_number) }}
      dry_run: false
      # Label-triggered runs use the `simple` template: it wraps build+test in
      # build_test_cycle (max_iterations:3), so a test failure (e.g. the #1015
      # SIGPIPE guard catching a generated test) feeds back to build for a fix
      # instead of aborting, and emits #972's merge-readiness report. (The old
      # `standard` template was retired; #976's objective build↔test convergence
      # landed in `simple`, so it is now the self-healing default.)
      template: simple
    secrets: inherit

  # ─── Job 3: post-run cleanup — remove label and post comment ─────────────────
  post-run:
    name: "Post-run — remove label + comment"
    needs: pipeline
    runs-on: ubuntu-latest
    # Run when the pipeline FAILED (so the label is still removed), but NOT when
    # it was SKIPPED. `always()` fires on a skipped dependency too, and this
    # workflow triggers on ANY label added to ANY issue — so every unrelated
    # label change ran this job, stripped the `zbuild-run` trigger, and commented
    # "pipeline finished with result: `skipped`" on an issue where nothing ran.
    # Observed on #1957, #1959 and #1961 (#1966 F4).
    if: always() && needs.pipeline.result != 'skipped'
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      PIPELINE_RESULT: ${{ needs.pipeline.result }}
    steps:
      - name: Remove zbuild-run label
        run: |
          gh api \
            --method DELETE \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/labels/zbuild-run" \
            || echo "Label already removed or not present — continuing."

      - name: Post run-completion comment
        run: |
          if [[ "$PIPELINE_RESULT" == "success" ]]; then
            body="**zbuild pipeline completed successfully.**  Run: ${RUN_URL}"
          else
            body="**zbuild pipeline finished with result: \`${PIPELINE_RESULT}\`.**  Run: ${RUN_URL}"
          fi
          gh issue comment "${ISSUE_NUMBER}" \
            --repo "${{ github.repository }}" \
            --body "$body"
