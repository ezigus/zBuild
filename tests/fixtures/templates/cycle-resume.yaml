id: cycle-resume
name: Cycle used by resume integration tests
defaults:
  strategy: fanout
stages:
  - id: build
    roles: [builder]
  - id: test
    roles: [tester]
cycles:
  - id: build-test
    stages: [build, test]
    until:
      stage: test
      field: verdict
      op: eq
      value: pass
    max_iterations: 5
    on_max: continue
