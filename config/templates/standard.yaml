id: standard
name: Standard Pipeline
extends: null
defaults:
  strategy: fanout

# ─── Flow ───────────────────────────────────────────────────────────────
# Top-level execution order. Per ADR-027 (recursive flow format), `flow:`
# is the single ordered stage list and every ID below resolves to a
# top-level stage section. plan is a leaf at position 2. Cycles:
# design_impact_cycle (design→impact, 3 iter, #842) at position 3 owns
# exhaustive scope enumeration + post-design consequence finding; the
# outer review_cycle (ADR-026) at position 4 absorbs build_test_cycle
# and review. All cycle members remain top-level sections below per
# ADR-027's recursive symmetry rule.
flow:
  - intake
  - plan
  - design_impact_cycle
  - review_cycle

# ─── intake (leaf) ──────────────────────────────────────────────────────
intake:
  gate: auto
  roles: [intake]
  io:
    destinations: [file, stdout]
    tail_lines: 200

# ─── design_impact_cycle (#842) ─────────────────────────────────────────
# Wraps design + impact in a 3-iter cycle. design exhaustively enumerates
# scope (```scope block per ADR-841); impact adversarially finds post-design
# CONSEQUENCES the design agent may have missed. On verdict=incomplete the
# cycle re-runs design with the prior impact gap-report wired as
# prior_impact_feedback, and design's own prior output as prior_design
# (self-feedback edge, mirrors the #773 lesson: design iter N+1 refines
# rather than re-creates). On verdict=complete OR max_iterations=3 with
# on_max=continue, exits to review_cycle.
design_impact_cycle:
  type: cycle
  description: Discover post-design consequences until impact analysis is complete
  flow:
    - design
    - impact
  exit_when:
    stage: impact
    field: verdict
    op: eq
    value: complete
  max_iterations: 3
  on_max: continue
  feedback:
    - from:
        stage: impact
        output: impact_feedback_md
      to:
        stage: design
        input: prior_impact_feedback
        required: false
    - from:
        stage: design
        output: design
      to:
        stage: design
        input: prior_design
        required: false

# ─── plan (leaf) ────────────────────────────────────────────────────────
plan:
  gate: auto
  roles: [planner]
  io:
    destinations: [file, stdout]
    tail_lines: 200
  router:
    timeout_s: 300
    max_turns: 25

# ─── impact (leaf, cycle member of design_impact_cycle) ─────────────────
# Adversarial post-design consequence-finder. Reads design.md's ```scope
# block and finds files the change touches but that design missed. Emits
# impact.json {verdict: complete|incomplete} + impact_feedback.md fed back
# into design's prior_impact_feedback on the next cycle iter.
impact:
  gate: auto
  roles: [impact_analyzer]
  io:
    destinations: [file, stdout]
    tail_lines: 200
  router:
    timeout_s: 180
    max_turns: 25

# ─── design (leaf, cycle member of design_impact_cycle) ─────────────────
# Exhaustive scope enumerator (ADR-841). Reads plan.json and actively
# searches the repo (Read/Grep/Glob) to produce design.md with a ```scope
# block covering every file the change touches, invalidates, documents, or
# assumes. The scope block is the authoritative source for build.
# legacy-citation: pipeline-stages-intake.sh:1004 / pipeline-stages.sh:38-71
design:
  gate: auto
  roles: [designer]
  io:
    destinations: [file, stdout]
    tail_lines: 200
  router:
    # #841: raised 300→600. Design now charters EXHAUSTIVE scope discovery —
    # it actively Greps the whole repo for files pinning values the change
    # invalidates (test counts, goldens, configs, docs). Repo-wide search at
    # max_turns=0 needs headroom; a 300s cap truncated the enumeration.
    timeout_s: 600
    max_turns: 0

# ─── review_cycle (outer remediation cycle, ADR-026) ────────────────────
# Outer cycle wrapping the inner build_test_cycle + the review stage. On
# review.verdict=approve, exit_when fires and control returns to the next
# sibling in the OUTER scope's flow (none — pipeline ends successfully).
# On review.verdict=block, abort_when fires (rc=6 cycle_abort, ADR-025) and
# propagates outward to terminate the pipeline. On review.verdict=
# request_changes, the cycle re-iterates: the inner build_test_cycle re-
# runs, this time with the prior review.review_md piped to build's
# prior_review_feedback input via the feedback edge below (consumed by
# plugins/agent/build whose manifest declares the matching source:
# cycle_feedback input — Wave 18-B). max_iterations: 2 caps worst-case
# remediation spend; on_max: continue matches ADR-019's fall-through to
# operator (the unconverged verdict still records, the pipeline ends with
# _RUNNER_CYCLE_UNCONVERGED set per ADR-021 v2 #527/#528). Plan is NOT
# wrapped — re-running plan on review feedback is a deferred decision
# (ADR-026 Alternative (c)).
#
# NB (Wave 18-B): the feedback `to:` MUST use block form. The Wave 17-B
# template translator (_tpl_translate_new_shape, core/pipeline/template.sh)
# handles block form of `to:` (multi-line stage/input/required) but does
# NOT yet handle the inline single-line `to: { stage, input, required }`
# form. Using inline form here would silently drop the feedback edge.
# Today's build_test_cycle below uses inline `from:` (handled) + block
# `to:` (handled); review_cycle follows the same convention.
review_cycle:
  type: cycle
  description: Code review of build output until reviewer approves
  flow:
    - build_test_cycle
    - cq-preflight
    - cq-audit-plan
    - cq-cycle
    - cq-backtrack
    - review
  exit_when:
    stage: review
    field: verdict
    op: eq
    value: approve
  abort_when:
    stage: review
    field: verdict
    op: eq
    value: block
  max_iterations: 2
  on_max: continue
  feedback:
    - from:
        stage: review
        output: review_md
      to:
        stage: build
        input: prior_review_feedback
        required: false

# ─── build_test_cycle (cycle stage with mini-flow) ──────────────────────
# ADR-021 + ADR-022 (#568): build/test/test_assessment outer cycle. The cycle
# converges on the LLM-issued test_assessment verdict (Pattern 1 stage from
# #567), not on the raw test rc. When the assessment is not `pass`, the cycle
# re-enters build with the prior assessment markdown injected as a prompt
# preamble (wired via `feedback.to.input=prior_test_assessment`, consumed by
# `plugins/agent/build` whose manifest declares the matching `source:
# cycle_feedback` input — renamed in #571). On termination via max_iterations,
# plateau, or divergence, the runner CONTINUES to review so the ADR-019
# fail-closed gate runs as the final arbiter.
# ADR-027 (#704): cycle is declared as a top-level stage section with
# `type: cycle` and its own `flow:` listing member stage IDs. Member stages
# (build, test, test_assessment) live as their own top-level sections below
# — recursive symmetry, one language. The `until:` predicate from ADR-021 v2
# is renamed `exit_when:` to make the break-out contract explicit (it ends
# THIS cycle and returns control to the next sibling in the outer `flow:`).
build_test_cycle:
  type: cycle
  description: Implement plus test loop until test_assessment passes
  flow:
    - build
    - test
    - test_assessment
  exit_when:
    stage: test_assessment
    field: verdict
    op: eq
    value: pass
  max_iterations: 3
  on_max: continue
  # ADR-030 (#840): governed scope expansion. build is the first actor with
  # ground truth (it ran the tests); when the plan's write-scope omits a file
  # whose old value the change invalidates (e.g. a test pinning the old stage
  # count), build emits a scope_expansion_request rather than silently
  # reverting. The cycle auto-grants low-risk collateral (test/config/doc files
  # that carry verified evidence of the change), escalates structural asks, and
  # — on any deny — abandons cleanly (blocked_on_scope) instead of looping to
  # max_iterations. The security floor (legacy/, secrets, out-of-repo) is core,
  # never expressible here.
  scope_policy:
    expandable: true
    auto_grant: [collateral_tests, collateral_config, collateral_docs]
    escalate: structural
    on_deny: abandon
  feedback:
    - from:
        stage: test_assessment
        output: test_assessment_md
      to:
        stage: build
        input: prior_test_assessment
        required: false

# ─── build (leaf, cycle member) ─────────────────────────────────────────
build:
  gate: auto
  roles: [builder]
  io:
    destinations: [file, stdout]
    tail_lines: 200
  router:
    timeout_s: 900
    # Build mutates files via Edit/Write/Bash; tool budget scales with the
    # plan's file count. Sentinel 0 omits --max-turns from claude argv
    # entirely (ADR-018 Wave 19-M, #762) — no cap, claude decides.
    max_turns: 0

# ─── test (leaf, cycle member) ──────────────────────────────────────────
test:
  gate: auto
  roles: [tester]
  io:
    destinations: [file, stdout]
    tail_lines: 200

# ─── test_assessment (leaf, cycle member) ───────────────────────────────
test_assessment:
  gate: auto
  roles: [test_assessment]
  io:
    destinations: [file, stdout]
    tail_lines: 200
  router:
    timeout_s: 300
    max_turns: 25

# ─── cq-preflight (leaf, cycle member) ─────────────────────────────────
# Pre-flight gates: bash-compat check, coverage floor, untested-function scan.
# Fail-fast: non-zero exit skips all remaining CQ plugins (issue #755).
# legacy-citation: pipeline-intelligence.sh:2042-2195
cq-preflight:
  gate: auto
  roles: [cq_preflight]
  io:
    destinations: [file, stdout]
    tail_lines: 200
  router:
    timeout_s: 120
    max_turns: 10

# ─── cq-audit-plan (leaf, cycle member) ─────────────────────────────────
# Selects which audit lenses run and at what intensity based on quality-score
# history. Emits audit-plan.json consumed by cq-cycle (issue #755).
# legacy-citation: pipeline-intelligence.sh:429-508
cq-audit-plan:
  gate: auto
  roles: [cq_audit_plan]
  io:
    destinations: [file, stdout]
    tail_lines: 200
  router:
    timeout_s: 120
    max_turns: 15

# ─── cq-cycle (leaf, cycle member) ──────────────────────────────────────
# Iterative audit loop: dispatches selected lens plugins, detects plateau and
# divergence, emits quality-feedback.md and review.findings.json (issue #755).
# legacy-citation: pipeline-intelligence.sh:2236-2900
cq-cycle:
  gate: auto
  roles: [cq_cycle]
  io:
    destinations: [file, stdout]
    tail_lines: 200
  router:
    timeout_s: 900
    max_turns: 0

# ─── cq-backtrack (leaf, cycle member) ──────────────────────────────────
# Reads needs_backtrack from cq-cycle findings; emits recovery.suggestion
# targeting design on architecture-class findings. Non-blocking: exhaustion
# degrades to continue-with-warning (issue #755).
# legacy-citation: pipeline-intelligence.sh:1339-1422
cq-backtrack:
  gate: auto
  roles: [cq_backtrack]
  io:
    destinations: [file, stdout]
    tail_lines: 200
  router:
    timeout_s: 120
    max_turns: 10

# ─── review (leaf) ──────────────────────────────────────────────────────
review:
  gate: auto
  roles: [reviewer]
  io:
    destinations: [file, stdout]
    tail_lines: 200
  router:
    timeout_s: 300
    max_turns: 25
