id: crash-resume-minimal
name: Crash-Resume Minimal (#1282 fixture)
extends: simple
defaults:
  strategy: fanout

# Minimal three-leaf roster used ONLY by tests/e2e/crash-resume-test.sh. The
# behavior under test — SIGKILL mid-run, then resume from the persisted state —
# is not stage-count dependent; it only needs a first stage that writes state
# before a slow body, plus a couple of trivial followers. ADR-047 §5 (#1282): the
# runner's resolvability preflight rejects at LOAD any leaf with no plugin, so
# this fixture's leaves (intake, security-lens, output) match exactly the three
# plugins the E2E harness registers. (Previously the test ran the shipped `simple`
# template against those three plugins and only survived because the old canonical
# fence never checked plugin presence — it crashed mid-run at the first missing
# leaf, after intake had written state.)
stages:
  - id: intake
    gate: auto
    roles: [intake]
  - id: security-lens
    gate: auto
    roles: [security-auditor]
  - id: output
    gate: auto
    roles: [output]
