      env-tunable but static defaults — treat as configuration, not learned params.
  - id: b-6
    title: "[B1] Scope manifest as fenced markdown in design.md (artifact-as-contract)"
    milestone: "Phase 2 — Reliability & Safety Primitives"
    labels: [phase-2, keeper, safety-primitive]
    spec_cite: "KEEPERS §B1.6"
    legacy_cite: "legacy/scripts/lib/pipeline-stages.sh:42 (_extract_scope_from_design)"
    behavior: |
      Scope manifest is a fenced markdown block in design.md. Humans edit visually;
      engine parses with awk. Already partially wired in Phase 0 (chokepoint
      reads from a manifest path); this keeper verifies the design.md
      integration end-to-end.
  - id: b-7
    title: "[B1] Three-tier memory recall (goal → issue → repo) with ruflo HNSW backing"
    milestone: "Phase 1 — Pipeline & Intelligence"
    labels: [phase-1, keeper, learning-loop]
    spec_cite: "KEEPERS §B1.7"
    legacy_cite: "legacy/scripts/lib/pipeline-stages-build.sh:209; legacy/scripts/lib/ruflo-adapter.sh:2376-2440 (HNSW)"
    behavior: |
      Goal-scoped → issue-scoped → repo-scoped cascade. Native memory is TF-IDF
      (sw-memory.sh); ruflo-adapter provides HNSW vectors via MCP under
      shipwright-repo-{hash}/issue-{N} namespaces. Carry forward as side service.
  - id: b-8
    title: "[B1] Adaptive cycle limits (convergence/divergence/plateau detection)"
    milestone: "Phase 1 — Pipeline & Intelligence"
    labels: [phase-1, keeper, learning-loop]
    spec_cite: "KEEPERS §B1.8"
    legacy_cite: "legacy/scripts/lib/pipeline-intelligence.sh:351/1604"
    behavior: |
      Convergence rate >50% extends, divergence reduces, plateau (same count
      twice) stops, budget exhaustion caps to zero. Plateau predicate is already
      a pure testable function.
  - id: b-9
    title: "[B1] Cost ledger + baselines feeding routing (--render-plain output)"
    milestone: "Phase 3 — Daemon & Autonomous Ops"
    labels: [phase-3, keeper]
    spec_cite: "KEEPERS §B1.9"
    legacy_cite: "legacy/scripts/sw-cost.sh, legacy/scripts/lib/cost/*"
    behavior: |
      Budget as routing input (downgrades to haiku at <$5 etc.), not just kill
      switch. --render-plain produces markdown-ready tables for GitHub comments.
  - id: b-10
    title: "[B1] UCB1 model router"
    milestone: "Phase 3 — Daemon & Autonomous Ops"
    labels: [phase-3, keeper, learning-loop]
    spec_cite: "KEEPERS §B1.10"
    legacy_cite: "legacy/scripts/sw-self-optimize.sh:907-955"
    behavior: |
      Correct UCB formula: mean + sqrt(2·ln(N)/n). Carry forward as the routing
      primitive. Required total_trials >= 5 graduation; SPRT-as-graduation lives
      in §L wishlist.
  - id: b-11
    title: "[B1] Thompson sampling for template selection (Beta(s+1, f+1))"
    milestone: "Phase 3 — Daemon & Autonomous Ops"
    labels: [phase-3, keeper, learning-loop]
    spec_cite: "KEEPERS §B1.11"
    legacy_cite: "legacy/scripts/sw-self-optimize.sh:851-893 (impl); :3188, daemon-triage.sh:411 (call sites)"
    behavior: |
      Pseudo-Thompson with stochastic noise; actually wired to template choice.
      Carry forward.
  - id: b-12
    title: "[B1] Quality finding classifier + architecture backtrack (6 categories)"
    milestone: "Phase 1 — Pipeline & Intelligence"
    labels: [phase-1, keeper]
    spec_cite: "KEEPERS §B1.12"
    legacy_cite: "legacy/scripts/lib/pipeline-intelligence.sh:134/1343/1745"
    behavior: |
      Six categories; security always first; architecture routes back to design
      (not just rebuild); scope-violations override everything.
  - id: b-13
    title: "[B1] Error signature persistence in SQLite (memory_failures table)"
    milestone: "Phase 3 — Daemon & Autonomous Ops"
    labels: [phase-3, keeper]
    spec_cite: "KEEPERS §B1.13"
    legacy_cite: "legacy/scripts/sw-db.sh:312-325 (schema); :1147-1167 (read/write)"
    behavior: |
      memory_failures table: error_signature TEXT keyed on (repo_hash, failure_class).
      Substrate for future AI fallback (§L wishlist item 2).

  # ─── Section C — Reliability + Safety (12 keepers) ─────────────────────
  - id: c-1
    title: "[C] Redaction chokepoint (single _apply_scope_redaction helper)"
    milestone: "Phase 2 — Reliability & Safety Primitives"
    labels: [phase-2, keeper, safety-primitive]
    spec_cite: "KEEPERS §C corrections #1"
    legacy_cite: "legacy/scripts/lib/helpers.sh:634-800 (impl); 9 call sites listed in KEEPERS §C"
    behavior: |
      ALREADY MIGRATED in Phase 0 as core/redaction/scope-redaction.sh. This
      issue tracks routing all 9 legacy call sites through the chokepoint as
      Phase 2 keepers migrate.
  - id: c-2
    title: "[C] Goal sanitization at all capture/resume/restart boundaries"
    milestone: "Phase 2 — Reliability & Safety Primitives"
    labels: [phase-2, keeper, safety-primitive]
    spec_cite: "KEEPERS §C corrections #2"
    legacy_cite: "legacy/scripts/lib/goal-sanitize.sh:11-40 (18 sentinels); legacy/scripts/sw-loop.sh:517, pipeline-state.sh:946-968, loop-restart.sh:134-143"
    behavior: |
      18 sentinel strippers. Apply at every persistence boundary: initial capture
      (sw-loop.sh:517 when LOOP_CONTEXT_FILE set), resume, restart. Verify Phase 0
      audit-flagged gap: does daemon-poll's issue-fetch path also sanitize?
  - id: c-3
    title: "[C] Admission gate (5-tier sequential, NOT independent)"
    milestone: "Phase 2 — Reliability & Safety Primitives"
    labels: [phase-2, keeper, safety-primitive]
    spec_cite: "KEEPERS §C corrections #3"
    legacy_cite: "legacy/scripts/sw-pipeline.sh:257-349 (admission gate primitives)"
    behavior: |
      Order MATTERS: reap_stale_pipeline_locks → count_active_pipeline_locks →
      memory floor → write_active_pipeline_lock → release_active_pipeline_lock.
      Lift as core/locks/. Document the dependency explicitly so future
      implementers don't 'parallelize' the tiers.
  - id: c-4
    title: "[C] CURRENT_ITERATION persistence in resume_state"
    milestone: "Phase 2 — Reliability & Safety Primitives"
    labels: [phase-2, keeper, safety-primitive]
    spec_cite: "KEEPERS §C corrections #4"
    legacy_cite: "legacy/scripts/lib/pipeline-state.sh:876-1075 (resume gap), :269 (written but not read)"
    behavior: |
      ALREADY MIGRATED in Phase 0 as core/state/resume.sh (current_iteration is
      explicitly persisted; exec-based test proves cross-process survival).
      This issue verifies it via 5-test trial.
  - id: c-5
    title: "[C] Disk-space precheck on ALL artifact writes"
    milestone: "Phase 2 — Reliability & Safety Primitives"
    labels: [phase-2, keeper, safety-primitive]
    spec_cite: "KEEPERS §C additions #1"
    legacy_cite: "legacy/scripts/lib/helpers.sh:297 (check_disk_space); only caller: legacy/scripts/lib/pipeline-state.sh:796"
    behavior: |
      Today: one caller (state save). Extend to all artifact writes
      (compound-quality findings, scope-violations.txt, plan.md, etc.).
      Phase 0 added it to core atomic_write; this issue extends coverage.
  - id: c-6
    title: "[C] JSON corruption recovery on every state read (.bak rotation)"
    milestone: "Phase 2 — Reliability & Safety Primitives"
    labels: [phase-2, keeper, safety-primitive]
    spec_cite: "KEEPERS §C additions #2"
    legacy_cite: "legacy/scripts/lib/helpers.sh:179 (validate_json); only called at daemon startup"
    behavior: |
      Mid-pipeline corruption is unrecoverable today. Wire validate_json + .bak
      rotation into every state read in core/state/. Phase 0 did this for
      core/state/atomic.sh; this issue audits remaining read sites.
  - id: c-7
    title: "[C] Atomic-append for JSONL (single-writer contract)"
    milestone: "Phase 2 — Reliability & Safety Primitives"
    labels: [phase-2, keeper, safety-primitive]
    spec_cite: "KEEPERS §C additions #3"
    legacy_cite: "legacy/scripts/lib/helpers.sh:239-272"
    behavior: |
      Distinct primitive from atomic_write; assumes no concurrent writers.
      Event-bus contract MUST specify single-writer or add multi-writer locking.
      Phase 0 implemented this with flock; this issue audits all JSONL writers
      (events.jsonl, cost.jsonl, future plugin-specific JSONL) for compliance.
  - id: c-8
    title: "[C] Scope-violation logging file (persist before crash)"
    milestone: "Phase 2 — Reliability & Safety Primitives"
    labels: [phase-2, keeper, safety-primitive]
    spec_cite: "KEEPERS §C additions #4"
    legacy_cite: "legacy/scripts/lib/helpers.sh:945-968"
    behavior: |
      scope-violations.txt is diagnostic-only; if persist_artifacts fails before
      commit, violations are invisible on resume. Ensure scope-violation writes
      go through atomic_write + survive resume via core/state/.
  - id: c-9
    title: "[C] ANSI stripping in event log emission"
    milestone: "Phase 2 — Reliability & Safety Primitives"
    labels: [phase-2, keeper, safety-primitive]
    spec_cite: "KEEPERS §C additions #5"
    legacy_cite: "legacy/scripts/lib/helpers.sh:431-437 (strip_ansi)"
    behavior: |
      Must be applied to every event payload; selective application corrupts
      JSON schema. Audit core/event-bus/ payload-building for missing strip.
  - id: c-10
    title: "[C] Git bookkeeping exclude lists (single source of truth)"
    milestone: "Phase 2 — Reliability & Safety Primitives"
    labels: [phase-2, keeper, safety-primitive]
    spec_cite: "KEEPERS §C additions #6"
    legacy_cite: "legacy/scripts/lib/helpers.sh:515-531"
    behavior: |
      Two lists today (_GIT_BOOKKEEPING_FILES committed-but-excluded,
      _GIT_RUNTIME_EXCLUDES gitignored-and-excluded). Stale lists cause scope
      false-negatives. Consolidate into one source-of-truth file.
  - id: c-11
    title: "[C] Event-log rotation race (writer-coordinated quiescence)"
    milestone: "Phase 2 — Reliability & Safety Primitives"
    labels: [phase-2, keeper, safety-primitive]
    spec_cite: "KEEPERS §C additions #7"
    legacy_cite: "legacy/scripts/lib/helpers.sh:202-213 (rotate_jsonl)"
    behavior: |
      JSONL truncation during concurrent plugin write loses recent events.
      SQLite mirror is durable. Rotation must defer to writer-coordinated
      quiescence (or rotate only when no writers active).
  - id: c-12
    title: "[C] Resume best-effort contract (explicit persisted vs. reconstructed)"
    milestone: "Phase 2 — Reliability & Safety Primitives"
    labels: [phase-2, keeper, safety-primitive]
    spec_cite: "KEEPERS §C additions #8"
    legacy_cite: "Not documented in shipwright; new contract per ADR-006"
    behavior: |
      ALREADY DOCUMENTED in docs/RESUME-CONTRACT.md + ADR-006. This issue
      tracks plugin authors declaring `state.persisted` / `state.reconstructed`
      in their manifests as plugins migrate. Phase 5 verification.

