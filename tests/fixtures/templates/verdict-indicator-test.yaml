id: verdict-indicator-test
name: Verdict Indicator — single test stage (#1095 PC2 fixture)
extends: simple
defaults:
  strategy: fanout

# Minimal single-stage roster: exercises the test verdict→indicator mapping
# without booting the full ~14-stage standard roster. Synthetic plugins return
# 0, so the verdict drives the glyph — and, since #1798, a failing verdict also
# ends the run.
stages:
  - id: test
    gate: auto
    roles: [tester]
