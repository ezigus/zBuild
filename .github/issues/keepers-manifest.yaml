        workflow files) — when each is needed
      - ANTHROPIC_API_KEY secret setup
      - Minimum required scopes per token type
      - Common failure modes (token can't add labels in fork PRs, etc.)
      - Sample secrets configuration for the consumer-repo case

      Deliverable: docs/CI-INTEGRATION.md sections covering auth, common
      setups, troubleshooting. Plus a one-page quickstart in README.
  # ─── Phase 0.5 — Claude CLI surface & Code hooks (12 issues) ───────────
