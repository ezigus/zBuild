name: Shipwright Pipeline

# Include issue number in run title so auto-retry and watchdog can find it
run-name: "Shipwright Pipeline #${{ github.event.inputs.issue_number || github.event.issue.number || '?' }}"

# Autonomous agents process labeled issues — Shipwright building itself
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to process"
        required: true
        type: number
      template:
        description: "Pipeline template (fast, standard, full, autonomous)"
        required: false
        default: "autonomous"
        type: choice
        options:
          - fast
          - standard
          - full
          - autonomous
          - cost-aware
      skip_triage:
        description: "Skip issue triage (maintainer override)"
        required: false
        default: false
        type: boolean
      max_iterations:
        description: "Max build loop iterations (0 = auto from triage)"
        required: false
        default: "0"
        type: string
      completed_stages:
        description: "Comma-separated stages to skip (for CI resume)"
        required: false
        default: ""
        type: string

# Only one pipeline per issue at a time
concurrency:
  group: shipwright-issue-${{ github.event.inputs.issue_number || github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  checks: write

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Stage 1: Triage — vet the issue and determine delivery strategy
  # ────────────────────────────────────────────────────────────────────────────
  triage:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'shipwright')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      approved: ${{ steps.skip.outputs.approved || steps.triage.outputs.approved }}
      reason: ${{ steps.skip.outputs.reason || steps.triage.outputs.reason }}
      complexity: ${{ steps.skip.outputs.complexity || steps.triage.outputs.complexity }}
      template: ${{ steps.skip.outputs.template || steps.strategy.outputs.template }}
      max_iterations: ${{ steps.skip.outputs.max_iterations || steps.strategy.outputs.max_iterations }}
      estimated_minutes: ${{ steps.skip.outputs.estimated_minutes || steps.strategy.outputs.estimated_minutes }}
      risk_level: ${{ steps.risk.outputs.risk_level }}
      risk_score: ${{ steps.risk.outputs.risk_score }}

    env:
      ISSUE_NUMBER: ${{ github.event.inputs.issue_number || github.event.issue.number }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUBTOKEN || secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Rate limit jitter
        run: |
          # Stagger API calls when multiple issues are labeled simultaneously
          # to avoid GitHub GraphQL rate limit stampede (5-50s random delay)
          JITTER=$((RANDOM % 45 + 5))
          echo "Sleeping ${JITTER}s to avoid rate limit stampede..."
          sleep "$JITTER"

      - name: Skip triage (maintainer override)
        if: github.event.inputs.skip_triage == 'true'
        id: skip
        run: |
          echo "approved=true" >> "$GITHUB_OUTPUT"
          echo "reason=Maintainer override — triage skipped" >> "$GITHUB_OUTPUT"
          echo "complexity=standard" >> "$GITHUB_OUTPUT"
          echo "template=autonomous" >> "$GITHUB_OUTPUT"
          echo "max_iterations=20" >> "$GITHUB_OUTPUT"
          echo "estimated_minutes=90" >> "$GITHUB_OUTPUT"

      - name: Fetch issue details
        if: steps.skip.conclusion == 'skipped'
        id: issue
        run: |
          ISSUE_JSON=$(gh issue view "$ISSUE_NUMBER" --json title,body,labels,author)
          TITLE=$(echo "$ISSUE_JSON" | jq -r '.title')
          BODY=$(echo "$ISSUE_JSON" | jq -r '.body // ""' | head -200)
          LABELS=$(echo "$ISSUE_JSON" | jq -r '[.labels[].name] | join(", ")')
          AUTHOR=$(echo "$ISSUE_JSON" | jq -r '.author.login')

          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "author=$AUTHOR" >> "$GITHUB_OUTPUT"
          echo "labels=$LABELS" >> "$GITHUB_OUTPUT"

          # Save body to file (too long for env var)
          echo "$BODY" > /tmp/issue-body.txt

      - name: Vet issue alignment and determine strategy
        if: steps.skip.conclusion == 'skipped'
        id: triage
        env:
          TITLE: ${{ steps.issue.outputs.title }}
          LABELS: ${{ steps.issue.outputs.labels }}
          AUTHOR: ${{ steps.issue.outputs.author }}
        run: |
          BODY=$(cat /tmp/issue-body.txt 2>/dev/null || echo "")

          # Build triage prompt with strategy engine
          cat > /tmp/triage-prompt.txt <<'TRIAGE_EOF'
          You are the triage gate for the Shipwright open-source project.

          ## Shipwright Mission
          Shipwright orchestrates autonomous Claude Code agent teams. It provides:
          - Delivery pipelines (issue -> plan -> build -> test -> review -> PR)
          - Daemon-driven issue processing with auto-scaling
          - Fleet management across multiple repos
          - Agent heartbeats, checkpoints, and fault tolerance
          - Multi-machine distributed workers
          - Real-time web dashboard with agent presence
          - Cost intelligence and budget enforcement
          - Persistent memory and failure pattern learning
          - tmux-based team sessions with templates

          ## Alignment Criteria
          An issue ALIGNS if it:
          1. Improves Shipwright's core functionality (pipelines, daemons, fleet, dashboard)
          2. Fixes bugs or improves reliability/resilience
          3. Improves developer experience (CLI, docs, templates, setup)
          4. Adds cross-platform support (Linux, macOS, WSL)
          5. Improves test coverage or CI/CD
          6. Enhances cost efficiency, metrics, or observability
          7. Improves security or error handling

          An issue DOES NOT ALIGN if it:
          1. Requests features unrelated to agent orchestration
          2. Is spam, low-effort, or unclear
          3. Requests integration with unrelated tools (unless clearly valuable)
          4. Would introduce unnecessary complexity or scope creep
          5. Duplicates existing functionality
          6. Is a support question (should be a Discussion, not Issue)

          ## Complexity and Strategy
          Evaluate the issue and recommend a delivery strategy:
          - fast: trivial fix, typo, config change (< 30 min, ~5 iterations)
          - standard: feature or bugfix touching 2-5 files (< 2 hours, ~15 iterations)
          - full: significant feature or refactor (> 2 hours, multiple subsystems, ~25 iterations)

          ## Your Task
          Evaluate the following issue. Respond with EXACTLY this format (one field per line):
          APPROVED: true|false
          COMPLEXITY: fast|standard|full
          TEMPLATE: fast|standard|full
          MAX_ITERATIONS: 5-30
          ESTIMATED_MINUTES: 15-120
          REASON: one-sentence explanation
          TRIAGE_EOF

          # Append issue details
          cat >> /tmp/triage-prompt.txt <<EOF

          ## Issue #${ISSUE_NUMBER}
          **Title**: ${TITLE}
          **Author**: ${AUTHOR}
          **Labels**: ${LABELS}
          **Body**:
          ${BODY}
          EOF

          # Call Claude via CLI for triage
          PROMPT_TEXT=$(cat /tmp/triage-prompt.txt)

          # Validate auth token exists
          if [[ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]]; then
            echo "WARNING: CLAUDE_CODE_OAUTH_TOKEN not set — using defaults"
            RESPONSE="APPROVED: true
          COMPLEXITY: standard
          TEMPLATE: standard
          MAX_ITERATIONS: 20
          ESTIMATED_MINUTES: 90
          REASON: No auth token configured — defaulting to approved"
          else
            # Install Claude Code for triage (lightweight, cached by npm)
            if ! command -v claude &>/dev/null; then
              npm install -g @anthropic-ai/claude-code 2>/dev/null || true
            fi

            RESPONSE=$(claude -p "$PROMPT_TEXT" --max-turns 1 --model claude-haiku-4-5-20251001 2>/dev/null || echo "")

            # Fail-safe: if Claude returns empty/garbage, reject (do not auto-approve)
            if [[ -z "$RESPONSE" ]]; then
              RESPONSE="APPROVED: false
          COMPLEXITY: standard
          TEMPLATE: standard
          MAX_ITERATIONS: 20
          ESTIMATED_MINUTES: 90
          REASON: Claude triage call failed or returned empty — rejecting for safety"
            fi
          fi

          # Parse response (strip leading whitespace, backticks, asterisks from Claude markdown)
          APPROVED=$(echo "$RESPONSE" | sed 's/^[ \t`*]*//' | grep -i "^APPROVED:" | head -1 | awk '{print $2}' | tr -d '`*' | tr '[:upper:]' '[:lower:]')
          COMPLEXITY=$(echo "$RESPONSE" | sed 's/^[ \t`*]*//' | grep -i "^COMPLEXITY:" | head -1 | awk '{print $2}' | tr -d '`*' | tr '[:upper:]' '[:lower:]')
          REASON=$(echo "$RESPONSE" | sed 's/^[ \t`*]*//' | grep -i "^REASON:" | head -1 | sed 's/^REASON: *//i' | tr -d '`*')

          # Fail-safe defaults: never auto-approve on parse failure
          APPROVED="${APPROVED:-false}"
          COMPLEXITY="${COMPLEXITY:-standard}"
          REASON="${REASON:-Could not parse triage response — rejecting for safety}"

          echo "approved=$APPROVED" >> "$GITHUB_OUTPUT"
          echo "complexity=$COMPLEXITY" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"

          echo "--- Triage Result ---"
          echo "Approved: $APPROVED"
          echo "Complexity: $COMPLEXITY"
          echo "Reason: $REASON"

      - name: Predictive risk assessment
        if: steps.skip.conclusion == 'skipped' && steps.triage.outputs.approved == 'true'
        id: risk
        run: |
          # Advisory only — never blocks the pipeline
          set +e

          RISK_LEVEL="unknown"
          RISK_SCORE="0"

          if [[ -f "./scripts/sw-predictive.sh" ]]; then
            RISK_OUTPUT=$(bash ./scripts/sw-predictive.sh risk --issue "$ISSUE_NUMBER" --json 2>/dev/null || echo "{}")
            # sw-predictive.sh emits overall_risk (0-100 numeric) — map to categorical level
            RISK_SCORE=$(echo "$RISK_OUTPUT" | jq -r '.overall_risk // .risk_score // 0' 2>/dev/null || echo "0")
            if [[ "$RISK_SCORE" -ge 75 ]]; then
              RISK_LEVEL="critical"
            elif [[ "$RISK_SCORE" -ge 50 ]]; then
              RISK_LEVEL="high"
            elif [[ "$RISK_SCORE" -ge 25 ]]; then
              RISK_LEVEL="medium"
            else
              RISK_LEVEL="low"
            fi

            echo "Risk assessment: level=$RISK_LEVEL score=$RISK_SCORE"
          else
            echo "Predictive script not found — skipping risk assessment"
          fi

          echo "risk_level=$RISK_LEVEL" >> "$GITHUB_OUTPUT"
          echo "risk_score=$RISK_SCORE" >> "$GITHUB_OUTPUT"

      - name: Map strategy from triage
        if: steps.skip.conclusion == 'skipped' && steps.triage.outputs.approved == 'true'
        id: strategy
        run: |
          COMPLEXITY="${{ steps.triage.outputs.complexity }}"

          # Strategy mapping — deterministic, not AI-dependent
          # Default to autonomous template for compound quality (adversarial review,
          # negative testing, e2e validation, DoD audit)
          case "$COMPLEXITY" in
            fast)
              TEMPLATE="fast"
              MAX_ITERATIONS=10
              ESTIMATED_MINUTES=45
              ;;
            full)
              TEMPLATE="autonomous"
              MAX_ITERATIONS=30
              ESTIMATED_MINUTES=120
              ;;
            *)
              TEMPLATE="autonomous"
              MAX_ITERATIONS=20
              ESTIMATED_MINUTES=90
              ;;
          esac

          # Bump strategy if predictive risk is high
          RISK_LEVEL="${{ steps.risk.outputs.risk_level }}"
          if [[ "$RISK_LEVEL" == "high" || "$RISK_LEVEL" == "critical" ]]; then
            echo "High risk detected — escalating strategy"
            TEMPLATE="autonomous"
            MAX_ITERATIONS=$((MAX_ITERATIONS + 5))
          fi

          # Allow workflow_dispatch overrides
          INPUT_TEMPLATE="${{ github.event.inputs.template }}"
          if [[ -n "$INPUT_TEMPLATE" && "$INPUT_TEMPLATE" != "autonomous" ]]; then
            TEMPLATE="$INPUT_TEMPLATE"
          fi

          INPUT_ITERATIONS="${{ github.event.inputs.max_iterations }}"
          if [[ -n "$INPUT_ITERATIONS" && "$INPUT_ITERATIONS" != "0" ]]; then
            MAX_ITERATIONS="$INPUT_ITERATIONS"
          fi

          echo "template=$TEMPLATE" >> "$GITHUB_OUTPUT"
          echo "max_iterations=$MAX_ITERATIONS" >> "$GITHUB_OUTPUT"
          echo "estimated_minutes=$ESTIMATED_MINUTES" >> "$GITHUB_OUTPUT"

          echo "--- Strategy ---"
          echo "Template: $TEMPLATE"
          echo "Max Iterations: $MAX_ITERATIONS"
          echo "Estimated Minutes: $ESTIMATED_MINUTES"

      - name: Comment on rejected issue
        if: steps.triage.outputs.approved == 'false'
        run: |
          REASON="${{ steps.triage.outputs.reason }}"
          gh issue comment "$ISSUE_NUMBER" --body "$(cat <<EOF
          ⚓ **Shipwright Triage — Issue Declined**

          This issue was reviewed by the automated triage system and does not appear to align with Shipwright's project goals.

          **Reason**: $REASON

          If you believe this is incorrect, a maintainer can override by:
          1. Running the workflow manually with "Skip triage" enabled
          2. Adding context to the issue and re-applying the \`shipwright\` label

          For questions or support, please use [Discussions](../../discussions) instead.
          EOF
          )"

      - name: Remove shipwright label from rejected issue
        if: steps.triage.outputs.approved == 'false'
        run: |
          gh issue edit "$ISSUE_NUMBER" --remove-label "shipwright" || true

  # ────────────────────────────────────────────────────────────────────────────
  # Stage 2: Pipeline — autonomous agent processes the approved issue
  # ────────────────────────────────────────────────────────────────────────────
  pipeline:
    needs: triage
    if: needs.triage.outputs.approved == 'true'
    runs-on: ubuntu-latest
    # Generous timeout — watchdog handles stuck detection via heartbeat signals
    timeout-minutes: 300

    env:
      ISSUE_NUMBER: ${{ github.event.inputs.issue_number || github.event.issue.number }}
      TEMPLATE: ${{ needs.triage.outputs.template || github.event.inputs.template || 'autonomous' }}
      MAX_ITERATIONS: ${{ needs.triage.outputs.max_iterations || '20' }}
      COMPLETED_STAGES: ${{ github.event.inputs.completed_stages || '' }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUBTOKEN: ${{ secrets.GITHUBTOKEN }}
      GH_TOKEN: ${{ secrets.GITHUBTOKEN || secrets.GITHUB_TOKEN }}
      NO_COLOR: "1"
      SHIPWRIGHT_JOB_TIMEOUT_MINUTES: "300" # MUST match timeout-minutes: 300 above
      SW_LOG_PROMPTS: "github"
      SHIPWRIGHT_RISK_LEVEL: ${{ needs.triage.outputs.risk_level || 'unknown' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "shipwright[bot]"
          git config user.email "shipwright[bot]@users.noreply.github.com"
          # Reject commits whose subject contains Anthropic/Claude API error markers.
          mkdir -p .git/hooks
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'set -e' \
            'subject=$(head -1 "$1")' \
            "if echo \"\$subject\" | grep -qiE 'Invalid API key|authentication_error|API key expired'; then" \
            '  echo "::error::commit-msg hook rejected: subject contains API error pattern"' \
            '  echo "Subject was: $subject"' \
            '  exit 1' \
            'fi' \
            > .git/hooks/commit-msg
          chmod +x .git/hooks/commit-msg

      - name: Record CI job start epoch
        run: |
          # Per-CI-job budget anchor for check_time_budget() in loop-convergence.sh.
          # Ephemeral — never written to .claude/pipeline-state.md. Replaces the
          # PIPELINE_RUN_EPOCH export from commit 591c8e8, which inadvertently used
          # a persisted field that survived across CI jobs via the WIP branch.
          echo "CI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Restore persistent state
        run: |
          mkdir -p ~/.shipwright/memory
          if git fetch origin shipwright-data 2>/dev/null; then
            echo "Restoring state from shipwright-data branch..."
            for file in events.jsonl costs.json budget.json discoveries.jsonl; do
              git show "origin/shipwright-data:${file}" > ~/.shipwright/"${file}" 2>/dev/null || true
            done
            for file in $(git ls-tree -r --name-only origin/shipwright-data -- memory/ 2>/dev/null); do
              mkdir -p ~/.shipwright/"$(dirname "$file")"
              git show "origin/shipwright-data:${file}" > ~/.shipwright/"${file}" 2>/dev/null || true
            done
            echo "State restored successfully"
          else
            echo "No shipwright-data branch found — starting fresh"
          fi

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-tools-${{ hashFiles('.github/workflows/shipwright-pipeline.yml') }}
          restore-keys: |
            ${{ runner.os }}-npm-tools-

      - name: Install Claude Code
        run: |
          npm install -g @anthropic-ai/claude-code

      - name: Pre-flight auth check
        run: |
          if [[ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]]; then
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN is not set — pipeline will be skipped"
            echo "AUTH_SKIP=true" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "Verifying Claude Code authentication..."
          if claude -p "Reply with exactly: AUTH_OK" --max-turns 1 2>/tmp/auth-check-err.log | grep -q "AUTH_OK"; then
            echo "Claude Code authentication verified"
          else
            echo "::warning::Claude Code authentication failed — check CLAUDE_CODE_OAUTH_TOKEN secret"
            echo "--- stderr ---"
            cat /tmp/auth-check-err.log 2>/dev/null || true
            echo "--- end ---"
            echo "AUTH_SKIP=true" >> "$GITHUB_ENV"
          fi

      - name: Check claim lock and pipeline start cap
        id: claim_check
        run: |
          # Load retry caps from policy.json — single source of truth
          . scripts/lib/retry-policy.sh

          CLAIMED=$(gh issue view "$ISSUE_NUMBER" --json labels \
            --jq '[.labels[].name | select(startswith("claimed:"))] | .[0] // ""' 2>/dev/null || echo "")
          if [ -n "$CLAIMED" ]; then
            echo "Issue #$ISSUE_NUMBER claimed by $CLAIMED — CI yielding to local daemon"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Pipeline start cap — prevent runaway retry loops
          PIPELINE_STARTS=$(gh issue view "$ISSUE_NUMBER" --json comments \
            --jq '[.comments[].body | select(contains("Pipeline Starting"))] | length' 2>/dev/null || echo "0")
          if [ "${PIPELINE_STARTS:-0}" -ge "${RETRY_MAX_PIPELINE_STARTS}" ]; then
            echo "Pipeline start cap reached ($PIPELINE_STARTS attempts) for issue #$ISSUE_NUMBER"
            gh issue comment "$ISSUE_NUMBER" --body "$(cat <<CAPEOF
          :stop_sign: **Shipwright Pipeline — Start Cap Reached**

          This issue has had **${PIPELINE_STARTS} pipeline attempts** — exceeding the safety cap of ${RETRY_MAX_PIPELINE_STARTS}.

          This usually means the issue cannot be solved autonomously and needs human review.
          Re-apply the \`shipwright\` label after clearing old pipeline comments to retry.
          CAPEOF
          )" 2>/dev/null || true
            gh issue edit "$ISSUE_NUMBER" --remove-label "shipwright" 2>/dev/null || true
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Pipeline starts so far: ${PIPELINE_STARTS:-0}/${RETRY_MAX_PIPELINE_STARTS}"

      - name: Install system dependencies
        if: steps.claim_check.outputs.skip != 'true' && env.AUTH_SKIP != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux jq

      - name: Install Shipwright (pinned to main snapshot)
        if: steps.claim_check.outputs.skip != 'true' && env.AUTH_SKIP != 'true'
        run: |
          git fetch --no-tags origin main

          # Materialize origin/main into a separate worktree so the global
          # `shipwright` CLI is immune to later workspace checkouts (e.g. to a
          # broken WIP branch). npm link from the workspace would let WIP code
          # drive the pipeline that is trying to fix it.
          SW_CLI_DIR="$RUNNER_TEMP/shipwright-cli-main"
          rm -rf "$SW_CLI_DIR"
          git worktree add --detach "$SW_CLI_DIR" origin/main

          (cd "$SW_CLI_DIR" && npm link)

          # sw-context.sh:17-19 honors SHIPWRIGHT_REPO_DIR — artifact reads and
          # writes land in the workspace (the WIP-checked-out tree), not in the
          # immutable CLI snapshot.
          echo "SHIPWRIGHT_REPO_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "SHIPWRIGHT_CLI_DIR=$SW_CLI_DIR"        >> "$GITHUB_ENV"

          GLOBAL_PKG="$(npm root -g)/shipwright-cli"
          REAL_TARGET="$(readlink -f "$GLOBAL_PKG" 2>/dev/null || echo "")"
          case "$REAL_TARGET" in
            "$SW_CLI_DIR"*) echo "✓ shipwright CLI pinned to $REAL_TARGET" ;;
            *)              echo "::error::CLI is $REAL_TARGET (expected under $SW_CLI_DIR)"; exit 1 ;;
          esac

      - name: Install ruflo (optional — pipeline falls back gracefully if unavailable)
        if: steps.claim_check.outputs.skip != 'true' && env.AUTH_SKIP != 'true'
        run: |
          _ruflo_install_err="$(mktemp)"
          _ruflo_doctor_err="$(mktemp)"
          # Disable the npx fallback in CI regardless of install outcome.
          # The npx path spawns a deep process tree; if ruflo_with_timeout orphans
          # any grandchildren they hold the $() pipe FD open indefinitely (#426).
          echo "RUFLO_NPX_FALLBACK=0" >> "$GITHUB_ENV"
          if ! npm install -g ruflo@latest 2>"$_ruflo_install_err"; then
            echo "::warning::Failed to install ruflo — pipeline will run without it"
            cat "$_ruflo_install_err"
            # RUFLO_FORCE_DISABLE prevents ruflo_detect() from re-enabling ruflo
            # even if a stale binary is present on PATH (#426).
            echo "RUFLO_FORCE_DISABLE=true" >> "$GITHUB_ENV"
            exit 1
          fi
          if ! ruflo doctor --fix 2>"$_ruflo_doctor_err"; then
            echo "::warning::ruflo doctor --fix failed — pipeline will run without ruflo"
            cat "$_ruflo_doctor_err"
            echo "RUFLO_FORCE_DISABLE=true" >> "$GITHUB_ENV"
            exit 1
          fi
          # Install agentic-flow for native embeddings and semantic routing
          npm install -g agentic-flow@latest 2>/dev/null || true
          # Initialize vector memory database so ruflo memory features work during the run
          ruflo memory configure --backend hybrid 2>/dev/null || true
        continue-on-error: true

      - name: Restore ruflo memory from orphan branch
        if: steps.claim_check.outputs.skip != 'true' && env.AUTH_SKIP != 'true'
        run: |
          source scripts/lib/ruflo-adapter.sh
          ruflo_detect || true
          ruflo_ci_memory_pull
        continue-on-error: true

      - name: Prepare workspace branch (resume WIP or branch from main)
        if: steps.claim_check.outputs.skip != 'true' && env.AUTH_SKIP != 'true'
        run: |
          BRANCH="shipwright/issue-${ISSUE_NUMBER}"
          USE_WIP=false

          if git ls-remote --heads --exit-code origin "$BRANCH" >/dev/null 2>&1; then
            git fetch --no-tags origin "$BRANCH" 2>/dev/null || true
            BRANCH_CONTENT=$(git log -5 --format='%s' "origin/$BRANCH" 2>/dev/null || echo "")
            # Anchor the pattern to the start of the subject line. Claude-crash commits
            # always begin with the error string; conventional-commit prefixed fixes
            # (fix:, feat:, chore:, etc.) never do — so "fix: handle rate_limit_error
            # in retry logic" no longer trips the polluted-branch deletion.
            if echo "$BRANCH_CONTENT" | grep -qiE '^[[:space:]]*(Invalid API key|authentication_error|API key expired|rate_limit_error|overloaded_error)'; then
              POLLUTED_SUBJECT=$(echo "$BRANCH_CONTENT" \
                | grep -iE '^[[:space:]]*(Invalid API key|authentication_error|API key expired|rate_limit_error|overloaded_error)' | head -1 || echo "unknown")
              echo "::warning::Partial work branch appears polluted with API errors — deleting. Trigger commit subject: ${POLLUTED_SUBJECT}"
              git push origin --delete "$BRANCH" 2>/dev/null || true
            else
              echo "::notice::WIP branch last 5 commit subjects look clean — resuming"
              USE_WIP=true
            fi
          fi

          if [[ "$USE_WIP" == "true" ]]; then
            # Copy helper from main checkout before switching to WIP branch.
            # WIP branches pre-dating this fix won't have the file; stash it
            # in RUNNER_TEMP so it survives the git checkout below.
            _RECONCILE_HELPER=""
            if [[ -f "scripts/lib/ci-reconcile-state.sh" ]]; then
              _RECONCILE_HELPER="$RUNNER_TEMP/ci-reconcile-state.sh"
              cp scripts/lib/ci-reconcile-state.sh "$_RECONCILE_HELPER"
            fi

            git checkout -B "$BRANCH" "origin/$BRANCH"
            echo "Resumed ${BRANCH} — continuing from prior work"

            # Discard state file if it belongs to a different issue (stale workspace)
            if [[ -f .claude/pipeline-state.md ]]; then
              _state_issue=$(awk '/^issue:/{gsub(/^issue:[[:space:]]*/,""); print; exit}' .claude/pipeline-state.md 2>/dev/null || echo "")
              if [[ -n "$_state_issue" && "$_state_issue" != "#${ISSUE_NUMBER}" ]]; then
                echo "::warning::Branch $BRANCH has state for $_state_issue (expected #${ISSUE_NUMBER}). Discarding stale state."
                rm -f .claude/pipeline-state.md
              fi
            fi

            # Reconcile stale 'running'/'paused' state from a killed prior CI job.
            # Helper handles both the atomic rewrite and the log-stage extraction.
            # NOTE: "Verify merged artifacts" later restores pipeline-state.md from the
            # issue-N/ snapshot if the live file is missing, so it runs the reconciler
            # again post-restore. Without that second pass, a deleted live file + a
            # snapshot still holding status:running would skip reconcile here and trip
            # the "pipeline already in progress" guard on `shipwright pipeline start`.
            if [[ -f ".claude/pipeline-state.md" ]] && [[ -n "$_RECONCILE_HELPER" ]]; then
              source "$_RECONCILE_HELPER"
              RECONCILED_STAGES="$(ci_reconcile_state .claude/pipeline-state.md)"
              if [[ -n "$RECONCILED_STAGES" ]]; then
                echo "::notice::Reconciled stale CI pipeline state to 'interrupted'; completed stages from log: ${RECONCILED_STAGES}"
                echo "PIPELINE_LOG_COMPLETED_STAGES=${RECONCILED_STAGES}" >> "$GITHUB_ENV"
                echo "PIPELINE_WIP_RESUME=true" >> "$GITHUB_ENV"
              elif grep -q '^status: interrupted$' .claude/pipeline-state.md 2>/dev/null && \
                   ! git diff --quiet HEAD -- .claude/pipeline-state.md 2>/dev/null; then
                # Helper rewrote the status but found no completed stages in the log.
                echo "::warning::Stale state reconciled to 'interrupted', but no completed stages parsed from log — pipeline will resume from scratch"
                echo "PIPELINE_WIP_RESUME=true" >> "$GITHUB_ENV"
              fi
            fi
          else
            # Unified path: create the WIP branch from origin/main so downstream
            # stages always see a consistent workspace state regardless of whether
            # prior work existed. Push immediately so a pre-stage crash still
            # leaves a resumable branch on origin.
            git checkout -B "$BRANCH" origin/main
            # Defense-in-depth: a fresh issue has no prior state; any root state file
            # present after checkout from main is definitionally stale (leaked via git add -f).
            rm -f .claude/pipeline-state.md .claude/pipeline-status.json
            echo "Cleared any stale pipeline state from origin/main"
            if [[ "$BRANCH" =~ ^shipwright/issue-([0-9]+)$ ]] && [[ "${BASH_REMATCH[1]}" != "${ISSUE_NUMBER}" ]]; then
              echo "::error::push-guard: target branch $BRANCH does not match active issue $ISSUE_NUMBER"; exit 87
            fi
            git push -u origin "$BRANCH" 2>/dev/null || \
              echo "::warning::Could not pre-push ${BRANCH} — first persist_artifacts will create it"
            echo "Created fresh ${BRANCH} from origin/main"
          fi

          echo "GIT_BRANCH=${BRANCH}"        >> "$GITHUB_ENV"
          echo "WORKSPACE_BRANCH=${BRANCH}"  >> "$GITHUB_ENV"

      - name: Re-export workspace branch (idempotent on retry)
        if: always() && env.ISSUE_NUMBER != ''
        shell: bash
        run: |
          BRANCH="shipwright/issue-${ISSUE_NUMBER}"
          if [[ "${WORKSPACE_BRANCH:-}" != "$BRANCH" ]]; then
            echo "WORKSPACE_BRANCH=$BRANCH" >> "$GITHUB_ENV"
            echo "GIT_BRANCH=$BRANCH"       >> "$GITHUB_ENV"
            echo "Re-exported WORKSPACE_BRANCH=$BRANCH (was: ${WORKSPACE_BRANCH:-<unset>})"
          fi

      - name: Verify CLI still pinned to main snapshot
        if: steps.claim_check.outputs.skip != 'true' && env.AUTH_SKIP != 'true'
        run: |
          GLOBAL_PKG="$(npm root -g)/shipwright-cli"
          REAL_TARGET="$(readlink -f "$GLOBAL_PKG" 2>/dev/null || echo "")"
          if [[ "$REAL_TARGET" != "$SHIPWRIGHT_CLI_DIR"* ]]; then
            echo "::error::shipwright CLI drifted to $REAL_TARGET (expected under $SHIPWRIGHT_CLI_DIR)"
            exit 1
          fi
          echo "✓ CLI pinned to main; workspace on $(git rev-parse --abbrev-ref HEAD)"

      - name: Verify merged artifacts
        run: |
          echo "--- Recovered Artifacts ---"
          RECOVERED=0
          SNAP_DIR=".claude/pipeline-artifacts/issue-${ISSUE_NUMBER}"
          mkdir -p ".claude/pipeline-artifacts"
          # Restore all artifacts from the issue-scoped snapshot directory in one shot.
          # Using a directory copy means new artifact types added by future stages
          # restore automatically without requiring a workflow edit.
          if [[ -d "$SNAP_DIR" ]]; then
            cp -r "$SNAP_DIR/." .claude/pipeline-artifacts/
            echo "  ↩ Restored all artifacts from issue-${ISSUE_NUMBER} snapshot"
            RECOVERED=$(find "$SNAP_DIR" -type f | wc -l | tr -d ' ')
          fi
          # Restore canonical state files to their expected locations outside pipeline-artifacts/
          for pair in \
            "pipeline-state.md:.claude/pipeline-state.md" \
            "pipeline-status.json:.claude/pipeline-status.json"; do
            src="$SNAP_DIR/${pair%%:*}"
            dst="${pair##*:}"
            mkdir -p "$(dirname "$dst")"
            if [[ -s "$src" && ! -s "$dst" ]]; then
              cp "$src" "$dst"
              echo "  ↩ ${pair%%:*}: restored to $(dirname "$dst")/"
            elif [[ -s "$dst" ]]; then
              echo "  ✓ ${pair%%:*}: present"
            fi
          done
          echo "Recovered ${RECOVERED} artifact file(s) from partial work branch"

          # Re-reconcile pipeline-state.md if it was just restored from the
          # issue-N/ snapshot. The snapshot is committed mid-run and can hold
          # status:running from a killed CI job; without this pass, the next
          # step's `shipwright pipeline start` would refuse to start with
          # "A pipeline is already in progress". Mirrors the logic in the
          # "Prepare workspace branch" step; the helper was copied to
          # $RUNNER_TEMP/ci-reconcile-state.sh there and survives across steps.
          _RECONCILE_HELPER="${RUNNER_TEMP}/ci-reconcile-state.sh"
          if [[ -f ".claude/pipeline-state.md" ]] && [[ -f "$_RECONCILE_HELPER" ]] \
             && [[ "${PIPELINE_WIP_RESUME:-}" != "true" ]]; then
            # shellcheck disable=SC1090
            source "$_RECONCILE_HELPER"
            RECONCILED_STAGES="$(ci_reconcile_state .claude/pipeline-state.md)"
            if [[ -n "$RECONCILED_STAGES" ]]; then
              echo "::notice::Reconciled restored pipeline-state.md to 'interrupted'; completed stages from log: ${RECONCILED_STAGES}"
              echo "PIPELINE_LOG_COMPLETED_STAGES=${RECONCILED_STAGES}" >> "$GITHUB_ENV"
              echo "PIPELINE_WIP_RESUME=true" >> "$GITHUB_ENV"
            elif grep -q '^status: interrupted$' .claude/pipeline-state.md 2>/dev/null; then
              echo "::warning::Restored state reconciled to 'interrupted', but no completed stages parsed from log — pipeline will resume from scratch"
              echo "PIPELINE_WIP_RESUME=true" >> "$GITHUB_ENV"
            fi
          fi

      - name: Validate setup
        if: steps.claim_check.outputs.skip != 'true' && env.AUTH_SKIP != 'true'
        run: |
          echo "--- Environment ---"
          echo "Issue: #$ISSUE_NUMBER"
          echo "Template: $TEMPLATE"
          echo "Max Iterations: $MAX_ITERATIONS"
          echo "Completed Stages: ${COMPLETED_STAGES:-none}"
          echo "Triage: ${{ needs.triage.outputs.reason }}"
          echo "Runner: $(uname -s) $(uname -m)"
          echo ""

          # Verify CLAUDE.md is present for build agent context
          if [[ -f ".claude/CLAUDE.md" ]]; then
            echo "CLAUDE.md: present ($(wc -l < .claude/CLAUDE.md) lines)"
          else
            echo "WARNING: .claude/CLAUDE.md not found — build agent will lack project context"
          fi

          # Verify claude-code can find the project
          echo "Working directory: $(pwd)"
          echo "Git branch: $(git branch --show-current)"
          echo ""
          shipwright doctor || true

      - name: Comment on issue — pipeline starting
        if: steps.claim_check.outputs.skip != 'true' && env.AUTH_SKIP != 'true'
        run: |
          RESUME_NOTE=""
          if [[ -n "$COMPLETED_STAGES" ]]; then
            RESUME_NOTE="| Resume | Skipping: \`$COMPLETED_STAGES\` |"
          fi

          gh issue comment "$ISSUE_NUMBER" --body "$(cat <<EOF
          ⚓ **Shipwright Pipeline Starting**

          | Field | Value |
          |-------|-------|
          | Template | \`$TEMPLATE\` |
          | Complexity | \`${{ needs.triage.outputs.complexity }}\` |
          | Max Iterations | \`$MAX_ITERATIONS\` |
          | Triage | ${{ needs.triage.outputs.reason }} |
          | Runner | \`ubuntu-latest\` |
          | Risk Level | \`${{ needs.triage.outputs.risk_level || 'N/A' }}\` |
          | Workflow | [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
          ${RESUME_NOTE}

          The autonomous pipeline is processing this issue. Updates will be posted as stages complete.
          <!-- SHIPWRIGHT-RUN-ID: ${{ github.run_id }} -->
          EOF
          )"

      - name: Notify dashboard — pipeline starting
        if: steps.claim_check.outputs.skip != 'true' && env.AUTH_SKIP != 'true'
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        run: |
          if [ -n "${DASHBOARD_URL:-}" ]; then
            curl -s --max-time 5 -X POST "${DASHBOARD_URL}/api/webhook/ci" \
              -H "Content-Type: application/json" \
              -d "{\"type\":\"ci.pipeline_started\",\"issue\":${ISSUE_NUMBER},\"run_id\":\"${{ github.run_id }}\",\"template\":\"${TEMPLATE}\"}" \
              2>/dev/null || true
          fi

      - name: Run Shipwright pipeline
        if: steps.claim_check.outputs.skip != 'true' && env.AUTH_SKIP != 'true'
        id: pipeline
        run: |
          set +e  # Don't abort on failure — we capture the exit code

          PIPELINE_ARGS=(
            --issue "$ISSUE_NUMBER"
            --template "$TEMPLATE"
            --no-github-label
            --skip-gates
            --ci
          )

          # Pass max iterations if set
          if [[ "$MAX_ITERATIONS" != "0" && -n "$MAX_ITERATIONS" ]]; then
            PIPELINE_ARGS+=(--max-iterations "$MAX_ITERATIONS")
          fi

          # Compute effective completed-stages: operator input + log-derived stages, deduped.
          # Single computation before append — no strip-and-re-append needed.
          EFFECTIVE_COMPLETED_STAGES=""
          if [[ -n "${COMPLETED_STAGES:-}" || -n "${PIPELINE_LOG_COMPLETED_STAGES:-}" ]]; then
            EFFECTIVE_COMPLETED_STAGES="$(printf '%s\n%s\n' "${COMPLETED_STAGES:-}" "${PIPELINE_LOG_COMPLETED_STAGES:-}" \
              | tr ',' '\n' | awk 'NF && !seen[$0]++' | paste -sd ',' -)"
          fi
          if [[ -n "$EFFECTIVE_COMPLETED_STAGES" ]]; then
            PIPELINE_ARGS+=(--completed-stages "$EFFECTIVE_COMPLETED_STAGES")
            echo "Effective completed-stages: $EFFECTIVE_COMPLETED_STAGES"
          fi

          # Auto-resume when WIP branch had a stale running/paused state.
          if [[ "${PIPELINE_WIP_RESUME:-}" == "true" ]]; then
            PIPELINE_ARGS+=(--resume)
          fi

          # Heartbeat: post progress marker every 10 minutes so watchdog knows we're alive.
          # Visible body first so subscribers see content; HTML comment retained for
          # watchdog parsing (shipwright-watchdog.yml uses `contains("SHIPWRIGHT-HEARTBEAT")`).
          (_HB_COUNT=0; sleep_pid=""; trap 'if [[ -n "${sleep_pid:-}" ]]; then kill "$sleep_pid" 2>/dev/null || true; fi; exit 0' TERM; while true; do
            sleep 600 &
            sleep_pid=$!
            wait "$sleep_pid"
            sleep_pid=""
            _HB_COUNT=$((_HB_COUNT + 1))
            _HB_MINS=$((_HB_COUNT * 10))
            _HB_HH=$((_HB_MINS / 60))
            _HB_MM=$((_HB_MINS % 60))
            _HB_DISPLAY=$(printf "%02d:%02d" "$_HB_HH" "$_HB_MM")
            _HB_TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            _HB_BODY="⏳ Pipeline still running — ${_HB_DISPLAY} elapsed"$'\n'"<!-- SHIPWRIGHT-HEARTBEAT: ${_HB_TS}:running -->"
            gh issue comment "$ISSUE_NUMBER" --body "$_HB_BODY" 2>/dev/null || true
          done) &
          HEARTBEAT_PID=$!

          # Run pipeline writing directly to log file — avoids pipe-lifetime hang.
          # Any background grandchildren that hold the write FD open cannot block
          # us because we wait on the PID, not on pipe EOF. (#426, #484)
          > /tmp/pipeline.log
          shipwright pipeline start "${PIPELINE_ARGS[@]}" >> /tmp/pipeline.log 2>&1 &
          PIPELINE_PID=$!

          # Stream full log to GHA stdout for real-time step visibility.
          # -n +1 starts from line 1 so no startup lines are missed even if the
          # pipeline wrote before tail began following.  --pid exits tail
          # automatically when the pipeline process exits — no sleep needed.
          tail -n +1 --pid="$PIPELINE_PID" -f /tmp/pipeline.log &
          TAIL_PID=$!

          wait $PIPELINE_PID
          PIPELINE_EXIT=$?

          # Stop heartbeat; tail exits automatically via --pid.
          kill $HEARTBEAT_PID 2>/dev/null || true
          wait $HEARTBEAT_PID 2>/dev/null || true
          wait $TAIL_PID 2>/dev/null || true

          echo "exit_code=$PIPELINE_EXIT" >> "$GITHUB_OUTPUT"

          # Double-check: if state file says failed but exit code is 0, override
          if [[ "$PIPELINE_EXIT" -eq 0 && -f ".claude/pipeline-state.md" ]]; then
            STATE_STATUS=$(grep "^status:" ".claude/pipeline-state.md" 2>/dev/null | awk '{print $2}' || true)
            if [[ "$STATE_STATUS" == "failed" ]]; then
              echo "WARNING: Pipeline exited 0 but state says failed — overriding to exit 1"
              echo "exit_code=1" >> "$GITHUB_OUTPUT"
              PIPELINE_EXIT=1
            fi
          fi

          exit $PIPELINE_EXIT

      - name: Pipeline vitals health check
        if: always() && steps.claim_check.outputs.skip != 'true' && steps.pipeline.outputs.exit_code == '0'
        id: vitals
        run: |
          set +e

          HEALTH_SCORE="N/A"
          HEALTH_VERDICT="unknown"

          if [[ -f "./scripts/sw-pipeline-vitals.sh" ]]; then
            VITALS_OUTPUT=$(bash ./scripts/sw-pipeline-vitals.sh --issue "$ISSUE_NUMBER" --json 2>/dev/null || echo "{}")
            HEALTH_SCORE=$(echo "$VITALS_OUTPUT" | jq -r '.health_score // "N/A"' 2>/dev/null || echo "N/A")
            HEALTH_VERDICT=$(echo "$VITALS_OUTPUT" | jq -r '.verdict // "unknown"' 2>/dev/null || echo "unknown")

            echo "Vitals: score=$HEALTH_SCORE verdict=$HEALTH_VERDICT"
          else
            echo "Vitals script not found — skipping health check"
          fi

          echo "health_score=$HEALTH_SCORE" >> "$GITHUB_OUTPUT"
          echo "health_verdict=$HEALTH_VERDICT" >> "$GITHUB_OUTPUT"

      - name: Comment on issue — pipeline result
        if: always() && steps.claim_check.outputs.skip != 'true'
        run: |
          EXIT_CODE="${{ steps.pipeline.outputs.exit_code }}"

          # Extract current/failed stage from pipeline state
          LAST_STAGE=""
          STATE_STATUS=""
          if [[ -f ".claude/pipeline-state.md" ]]; then
            LAST_STAGE=$(grep "current_stage:" ".claude/pipeline-state.md" 2>/dev/null | awk '{print $2}' || true)
            STATE_STATUS=$(grep "^status:" ".claude/pipeline-state.md" 2>/dev/null | awk '{print $2}' || true)
          fi

          # Gatekeeper: state file is the source of truth
          # If exit_code is empty/unreliable, use the state file
          if [[ -z "$EXIT_CODE" ]]; then
            if [[ "$STATE_STATUS" == "complete" ]]; then
              EXIT_CODE="0"
            else
              EXIT_CODE="1"
            fi
          fi

          # Double-check: never report success if state says failed
          if [[ "$EXIT_CODE" == "0" && "$STATE_STATUS" == "failed" ]]; then
            echo "GATEKEEPER: exit_code=0 but state=failed — overriding to failure"
            EXIT_CODE="1"
          fi

          # Build stage timeline from SHIPWRIGHT-STAGE comments on the issue
          STAGE_TIMELINE=""
          COMPLETED_LIST=""
          STAGE_COMMENTS=$(gh issue view "$ISSUE_NUMBER" --json comments --jq '.comments[].body' 2>/dev/null | grep "SHIPWRIGHT-STAGE:" || true)
          if [[ -n "$STAGE_COMMENTS" ]]; then
            STAGE_TIMELINE="### Stage Timeline"$'\n'"| Stage | Status | Duration |"$'\n'"| ----- | ------ | -------- |"
            while IFS= read -r line; do
              # Format: <!-- SHIPWRIGHT-STAGE: stage:status:elapsed -->
              STAGE_DATA=$(echo "$line" | sed 's/.*SHIPWRIGHT-STAGE: //;s/ *-->.*//')
              STAGE_NAME=$(echo "$STAGE_DATA" | cut -d: -f1)
              STAGE_STATUS=$(echo "$STAGE_DATA" | cut -d: -f2)
              STAGE_ELAPSED=$(echo "$STAGE_DATA" | cut -d: -f3)
              if [[ "$STAGE_STATUS" == "complete" || "$STAGE_STATUS" == "completed" ]]; then
                ICON="✅"
                if [[ -n "$COMPLETED_LIST" ]]; then
                  COMPLETED_LIST="${COMPLETED_LIST}, ${STAGE_NAME}"
                else
                  COMPLETED_LIST="$STAGE_NAME"
                fi
              elif [[ "$STAGE_STATUS" == "failed" ]]; then
                ICON="❌"
              elif [[ "$STAGE_STATUS" == "skipped" ]]; then
                ICON="⏭️"
              else
                ICON="🔄"
              fi
              STAGE_TIMELINE="${STAGE_TIMELINE}"$'\n'"| ${STAGE_NAME} | ${ICON} | ${STAGE_ELAPSED:-—} |"
            done <<< "$STAGE_COMMENTS"
          fi

          # Read vitals output
          HEALTH_SCORE="${{ steps.vitals.outputs.health_score }}"
          HEALTH_VERDICT="${{ steps.vitals.outputs.health_verdict }}"
          HEALTH_SCORE="${HEALTH_SCORE:-N/A}"
          HEALTH_VERDICT="${HEALTH_VERDICT:-unknown}"

          if [[ "$EXIT_CODE" == "0" ]]; then
            # --- Success comment ---
            gh issue comment "$ISSUE_NUMBER" --body "$(cat <<EOF
          ✅ **Pipeline Completed Successfully**

          ${STAGE_TIMELINE}

          | Health Score | ${HEALTH_SCORE} / 100 (${HEALTH_VERDICT}) |

          [View full run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          <!-- SHIPWRIGHT-RESULT: 0:${LAST_STAGE}:${{ github.run_id }} -->
          EOF
          )"
          else
            # --- Failure comment with structured analysis ---

            # Classify error type from log tail
            ERROR_TYPE="unknown"
            LOG_TAIL=""
            if [[ -f /tmp/pipeline.log ]]; then
              LOG_TAIL=$(tail -20 /tmp/pipeline.log 2>/dev/null || echo "")
              LOG_TAIL=$(printf '%s' "$LOG_TAIL" \
                | sed 's/x-access-token:[^[:space:]@]*/x-access-token:***/g' \
                | sed 's/GITHUBTOKEN=[^[:space:]]*/GITHUBTOKEN=***/g' \
                | sed 's/CLAUDECODEOAUTHTOKEN=[^[:space:]]*/CLAUDECODEOAUTHTOKEN=***/g' \
                || true)
              if echo "$LOG_TAIL" | grep -qi "test.*fail\|assertion.*fail\|FAIL\|jest\|pytest"; then
                ERROR_TYPE="test_failure"
              elif echo "$LOG_TAIL" | grep -qi "build.*error\|compile.*error\|syntax.*error\|tsc"; then
                ERROR_TYPE="build_error"
              elif echo "$LOG_TAIL" | grep -qi "timeout\|timed out\|exceeded.*time"; then
                ERROR_TYPE="timeout"
              elif echo "$LOG_TAIL" | grep -qi "rate.*limit\|quota\|429\|503\|ECONNREFUSED"; then
                ERROR_TYPE="infra"
              fi
            fi

            gh issue comment "$ISSUE_NUMBER" --body "$(cat <<EOF
          ❌ **Pipeline Failed** (exit code: $EXIT_CODE)

          ### Failure Analysis
          | Field | Value |
          | ----- | ----- |
          | Failed Stage | \`${LAST_STAGE:-unknown}\` |
          | Error Type | \`${ERROR_TYPE}\` |
          | Completed | ${COMPLETED_LIST:-none} |

          ${STAGE_TIMELINE}

          <details><summary>Last 20 lines of log</summary>

          \`\`\`
          ${LOG_TAIL}
          \`\`\`
          </details>

          [View full run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          <!-- SHIPWRIGHT-RESULT: ${EXIT_CODE}:${LAST_STAGE}:${{ github.run_id }} -->
          <!-- SHIPWRIGHT-FAILURE-ANALYSIS: stage=${LAST_STAGE:-unknown}:type=${ERROR_TYPE}:completed=${COMPLETED_LIST:-none} -->
          EOF
          )"
          fi

      - name: Push WIP branch code commits (always)
        if: always() && steps.claim_check.outputs.skip != 'true'
        run: |
          if [[ -z "${WORKSPACE_BRANCH:-}" ]]; then
            echo "::error::WORKSPACE_BRANCH is unset in post-step (retry lost it). Cannot push — set WORKSPACE_BRANCH before this step."
            exit 1
          fi
          BRANCH="$WORKSPACE_BRANCH"

          # Guard: only push when HEAD is on the WIP branch.
          # If "Prepare workspace branch" was skipped or cancelled before completing,
          # HEAD will be on main/default — no WIP code commits exist here.
          CURRENT_BRANCH="$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "")"
          if [[ "$CURRENT_BRANCH" != "$BRANCH" ]]; then
            echo "HEAD is on '${CURRENT_BRANCH}', not '${BRANCH}' — no WIP code commits to push (snapshot step will attempt checkout-then-skip)"
            exit 0
          fi

          # Fetch so we can compute what is unpushed
          git fetch --no-tags origin "$BRANCH" 2>/dev/null || true

          UNPUSHED=$(git log --oneline "origin/${BRANCH}..HEAD" 2>/dev/null || true)
          if [[ -z "$UNPUSHED" ]]; then
            echo "No new commits on ${BRANCH} ahead of origin — nothing to push here"
            exit 0
          fi

          echo "=== Unpushed WIP commits ==="
          echo "$UNPUSHED"
          echo "=== Files changed in unpushed commits ==="
          git diff --name-status "origin/${BRANCH}..HEAD" 2>/dev/null | head -40 || true
          echo "==========================="

          # Auth: use GITHUBTOKEN (PAT with workflow scope) when available.
          # Clear the extraheader set by actions/checkout before embedding credentials.
          if [[ -n "${GITHUBTOKEN:-}" ]]; then
            git config --unset-all "http.https://github.com/.extraheader" 2>/dev/null || true
            git remote set-url origin "https://x-access-token:${GITHUBTOKEN}@github.com/${{ github.repository }}.git"
          fi

          # Push with --force-with-lease only. If a concurrent run already pushed
          # something, lease failure is expected — log it and let the snapshot step
          # serve as the safety-net fallback. No --force here to avoid clobbering.
          if timeout 60 git push origin "HEAD:refs/heads/${BRANCH}" --force-with-lease 2>&1; then
            echo "✓ WIP code commits pushed to ${BRANCH}"
            WIP_PUSH_STATUS="success"
          else
            echo "::warning::WIP code push failed with --force-with-lease — snapshot step push will attempt as fallback (also skips on HEAD drift)"
            WIP_PUSH_STATUS="failed"
          fi

          # Scrub PAT from remote URL
          git remote set-url origin "https://github.com/${{ github.repository }}.git" 2>/dev/null || true

          # Post or update a single deduped issue comment showing what was pushed.
          # Uses PATCH on existing SHIPWRIGHT-WIP-PUSH comment to avoid flooding.
          if [[ "$WIP_PUSH_STATUS" == "success" ]] && [[ -n "${ISSUE_NUMBER:-}" ]]; then
            _head_sha=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
            _head_msg=$(git log -1 --format='%s' HEAD 2>/dev/null || echo "")
            _changed=$(git diff --name-status "origin/${BRANCH}..HEAD" 2>/dev/null \
              | grep -v '^[[:space:]]*$' | head -25 || true)

            _comment_body="$(cat <<EOF
          🔀 **WIP branch updated** — \`${BRANCH}\` @ \`${_head_sha}\`

          **Latest commit:** ${_head_msg}

          **Files pushed:**
          \`\`\`
          ${_changed:-no source file changes (artifact-only)}
          \`\`\`

          <!-- SHIPWRIGHT-WIP-PUSH run_id=${{ github.run_id }} branch=${BRANCH} -->
          EOF
          )"

            _existing_id=$(gh api \
              "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/comments" \
              --paginate \
              --jq '.[] | select(.body | contains("SHIPWRIGHT-WIP-PUSH")) | .id' \
              2>/dev/null | tail -1 || true)

            if [[ -n "$_existing_id" ]]; then
              gh api -X PATCH \
                "repos/${{ github.repository }}/issues/comments/${_existing_id}" \
                -f body="$_comment_body" 2>/dev/null \
                && echo "Updated WIP-push comment ${_existing_id}" \
                || echo "::warning::Could not update WIP-push comment (non-fatal)"
            else
              gh issue comment "$ISSUE_NUMBER" --body "$_comment_body" 2>/dev/null \
                || echo "::warning::Could not post WIP-push comment (non-fatal)"
            fi
          fi

      - name: Reset stale blocking status before snapshot
        if: always() && steps.claim_check.outputs.skip != 'true'
        run: |
          # A crashed pipeline leaves .claude/pipeline-state.md with status
          # `running` / `paused` / `interrupted`. The snapshot step below
          # copies that file into issue-${ISSUE_NUMBER}/ and pushes; on the
          # next CI run "Verify merged artifacts" restores it back, and the
          # in-shell guard at sw-pipeline.sh:3189-3198 then refuses to start
          # ("A pipeline is already in progress"). Rewrite blocking statuses
          # to `failed` here so the snapshot step persists a non-blocking
          # value. No-op if the script is missing (WIP branch predates this
          # fix), if the state file is missing, or if status is already
          # non-blocking.
          if [[ ! -x scripts/sw-ci-reset-stale-state.sh ]]; then
            echo "Helper not present on this WIP branch — skipping reset"
            exit 0
          fi
          prev=$(bash scripts/sw-ci-reset-stale-state.sh .claude/pipeline-state.md || echo "")
          if [[ -n "$prev" ]]; then
            echo "::notice::Pipeline ended with stale '$prev' status — rewrote pipeline-state.md status to 'failed' so the next CI run is not blocked"
          else
            echo "No stale blocking status to reset."
          fi

      - name: Snapshot resume-essentials to WIP branch (always)
        if: always() && steps.claim_check.outputs.skip != 'true'
        run: |
          if [[ -z "${WORKSPACE_BRANCH:-}" ]]; then
            echo "::error::WORKSPACE_BRANCH is unset in post-step (retry lost it). Cannot push — set WORKSPACE_BRANCH before this step."
            exit 1
          fi
          BRANCH="$WORKSPACE_BRANCH"
          OUTCOME="${{ job.status }}"

          # Mirror canonical artifacts into issue-N/ and stage only that directory.
          # Source-code edits belong in git_auto_commit commits, not here.
          # The .gitignore uses contents-form exclusion (pipeline-artifacts/*) with
          # two negation lines for issue-*/ so no -f flag is needed.

          # Restore HEAD to WIP branch if a build agent left it on a temp branch
          # (e.g. ci/feature-branch created during implementation). Safe in the
          # post-PR-#594 architecture: we stage only issue-N/ artifacts (not all
          # working-tree files), so no wrong-branch source files are staged even
          # if checkout updates the working tree.
          git checkout "$BRANCH" 2>&1 || true

          # Safety: skip snapshot if HEAD is still not on the WIP branch after restore
          # attempt. Use exit 0 (not exit 1) — this is a defensive guard, not a pipeline
          # failure; marking CI failed when the pipeline itself succeeded is misleading.
          # Consistent with the WIP push step above which also exits 0 on HEAD drift.
          _snap_branch=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "DETACHED")
          if [[ "$_snap_branch" != "$BRANCH" ]]; then
            echo "::warning::HEAD is on '${_snap_branch}', expected '${BRANCH}' — skipping artifact snapshot to prevent cross-branch pollution" >&2
            exit 0
          fi

          ISSUE_DIR=".claude/pipeline-artifacts/issue-${ISSUE_NUMBER}"
          mkdir -p "$ISSUE_DIR"

          for rel in plan.md dod.md context-bundle.md design.md composed-pipeline.json; do
            src=".claude/pipeline-artifacts/$rel"
            [[ -s "$src" ]] && cp "$src" "$ISSUE_DIR/$rel"
          done

          # State files live at .claude/, one level above pipeline-artifacts/
          [[ -s .claude/pipeline-state.md    ]] && cp .claude/pipeline-state.md    "$ISSUE_DIR/pipeline-state.md"
          [[ -s .claude/pipeline-status.json ]] && cp .claude/pipeline-status.json "$ISSUE_DIR/pipeline-status.json"

          git add "$ISSUE_DIR"

          # Safety net: unstage sensitive files that should never be committed.
          # One pathspec per call — git restore --staged aborts the entire call when
          # any single pattern matches nothing, so combining them would leave real
          # sensitive files staged if another pattern happens to be absent.
          git restore --staged '*.env'                      2>/dev/null || true
          git restore --staged '.env*'                      2>/dev/null || true
          git restore --staged '*credentials*'              2>/dev/null || true
          git restore --staged '*secret*'                   2>/dev/null || true
          git restore --staged '*.pem'                      2>/dev/null || true
          git restore --staged '*.key'                      2>/dev/null || true
          git restore --staged '.claude/pipeline-state.md'  2>/dev/null || true
          git restore --staged '.claude/pipeline-status.json' 2>/dev/null || true

          # Diagnostic: show exactly what will be committed (key signal for debugging)
          _staged_files=$(git diff --cached --name-status 2>/dev/null || true)
          if [[ -n "$_staged_files" ]]; then
            echo "=== Artifact snapshot will commit ==="
            echo "$_staged_files"
            echo "====================================="
          else
            echo "No artifacts to stage — snapshot push will carry any prior git_auto_commit commits"
          fi

          # Write a failure note so the reason is visible on the branch and in artifacts.
          # Placed before the diff check so it guarantees staged content on failure,
          # ensuring the push always carries context about what went wrong.
          EXIT_CODE="${{ steps.pipeline.outputs.exit_code }}"
          # Guard: only write a failure note when the pipeline actually ran and failed.
          # An empty EXIT_CODE means the pipeline step was skipped (e.g. AUTH_SKIP=true);
          # treating that as failure would create misleading snapshot commits.
          if [[ -n "${EXIT_CODE}" && "${EXIT_CODE}" != "0" ]]; then
            LAST_STAGE=$(grep -m1 '^current_stage:' .claude/pipeline-state.md 2>/dev/null | awk '{print $2}' || echo "unknown")
            LOG_SNIP=$(tail -20 /tmp/pipeline.log 2>/dev/null | grep -iE "error|fail|assert" | head -5 || echo "(see pipeline log)")
            mkdir -p .claude/pipeline-artifacts
            printf '# Pipeline Failure Note\nRun: %s\nStage: %s\nLog:\n%s\n' \
              "${{ github.run_id }}" "$LAST_STAGE" "$LOG_SNIP" \
              > .claude/pipeline-artifacts/failure-note.md
            cp .claude/pipeline-artifacts/failure-note.md "$ISSUE_DIR/failure-note.md"
            git add "$ISSUE_DIR/failure-note.md" 2>/dev/null || true
          fi

          # Decouple "nothing new to commit" from "nothing to push": when the build
          # loop's git_auto_commit succeeded, the working tree is clean and there is
          # nothing new to stage — but local implementation commits still exist on the
          # branch and must reach GitHub. Skipping the push here (the old exit 0) meant
          # those commits were lost when the fresh runner exited.
          SKIP_COMMIT=false
          if git diff --cached --quiet 2>/dev/null; then
            echo "No resume-essentials to commit — will still push any local commits"
            SKIP_COMMIT=true
          fi

          if [[ "$SKIP_COMMIT" == "false" ]]; then
            git -c user.email=shipwright-bot@users.noreply.github.com \
                -c user.name='shipwright-bot' \
                commit -m "chore: resume snapshot for #${ISSUE_NUMBER} (run ${{ github.run_id }}, pipeline=${OUTCOME}) [skip ci]" \
                --no-verify || echo "::warning::snapshot commit failed (non-fatal)"
          fi

          # Use GITHUBTOKEN (PAT with workflow scope) when available so pushes
          # that include workflow file changes are not rejected by the default
          # GITHUB_TOKEN, which cannot be granted workflows permission.
          # actions/checkout persists an Authorization extraheader that takes
          # precedence over URL-embedded credentials, so we must clear it first.
          if [[ -n "${GITHUBTOKEN:-}" ]]; then
            git config --unset-all "http.https://github.com/.extraheader" 2>/dev/null || true
            git remote set-url origin "https://x-access-token:${GITHUBTOKEN}@github.com/${{ github.repository }}.git"
          else
            echo "INFO: GITHUBTOKEN secret is not set — push will fail if this branch modifies workflow files (add the secret to fix this)"
          fi

          if timeout 120 git push origin "HEAD:refs/heads/${BRANCH}" --force-with-lease 2>/dev/null; then
            echo "✓ Resume snapshot pushed to ${BRANCH} (pipeline=${OUTCOME})"
          else
            echo "WARN: resume snapshot push timed out or failed (non-fatal)"
          fi

          # Scrub PAT from remote URL immediately after push
          git remote set-url origin "https://github.com/${{ github.repository }}.git" 2>/dev/null || true

      - name: Diagnose exit signals (issue #463)
        if: always() && steps.claim_check.outputs.skip != 'true'
        run: |
          echo "job.status: ${{ job.status }}"
          echo "Branch on origin: $(git ls-remote --heads origin "shipwright/issue-${ISSUE_NUMBER}" 2>/dev/null || echo none)"

      - name: Persist state to shipwright-data branch
        if: always() && steps.claim_check.outputs.skip != 'true'
        run: |
          SW_STATE_DIR=$(mktemp -d)
          cd "$SW_STATE_DIR"
          git init
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          if git fetch origin shipwright-data 2>/dev/null; then
            git checkout -b shipwright-data origin/shipwright-data
          else
            git checkout --orphan shipwright-data
            echo "# Shipwright Persistent State" > README.md
          fi
          cp ~/.shipwright/events.jsonl . 2>/dev/null || true
          cp ~/.shipwright/costs.json . 2>/dev/null || true
          cp ~/.shipwright/budget.json . 2>/dev/null || true
          cp ~/.shipwright/discoveries.jsonl . 2>/dev/null || true
          if [[ -d ~/.shipwright/memory ]]; then
            cp -r ~/.shipwright/memory . 2>/dev/null || true
          fi
          git config user.name "shipwright[bot]"
          git config user.email "shipwright[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet 2>/dev/null; then
            echo "No state changes to persist"
          else
            git commit -m "chore: persist pipeline state [skip ci]"
            # Retry with jitter — concurrent pipelines race on this branch
            PUSHED=false
            for ATTEMPT in 1 2 3 4 5; do
              if git push origin shipwright-data 2>/dev/null; then
                PUSHED=true
                break
              fi
              JITTER=$((RANDOM % 10 + 2))
              echo "Push attempt $ATTEMPT failed — retrying in ${JITTER}s..."
              sleep "$JITTER"
              # Re-fetch, rebase, and retry
              git fetch origin shipwright-data 2>/dev/null || true
              git rebase origin/shipwright-data 2>/dev/null || {
                echo "Rebase conflict — force pushing"
                git rebase --abort 2>/dev/null || true
                git push origin shipwright-data --force 2>/dev/null && PUSHED=true && break
              }
            done
            if [ "$PUSHED" = "true" ]; then
              echo "State persisted to shipwright-data branch"
            else
              echo "WARNING: Failed to persist state after 5 attempts — non-fatal, continuing"
            fi
          fi

      - name: Notify dashboard — pipeline result
        if: always() && steps.claim_check.outputs.skip != 'true'
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        run: |
          if [ -n "${DASHBOARD_URL:-}" ]; then
            EXIT_CODE="${{ steps.pipeline.outputs.exit_code }}"
            RESULT="success"
            if [ "${EXIT_CODE:-1}" != "0" ]; then RESULT="failure"; fi
            curl -s --max-time 5 -X POST "${DASHBOARD_URL}/api/webhook/ci" \
              -H "Content-Type: application/json" \
              -d "{\"type\":\"ci.pipeline_completed\",\"issue\":${ISSUE_NUMBER},\"run_id\":\"${{ github.run_id }}\",\"result\":\"${RESULT}\",\"template\":\"${TEMPLATE}\"}" \
              2>/dev/null || true
          fi

      - name: Persist ruflo memory to orphan branch
        if: always() && steps.claim_check.outputs.skip != 'true'
        run: |
          source scripts/lib/ruflo-adapter.sh
          ruflo_detect || true
          ruflo_ci_memory_push
        continue-on-error: true

      - name: Upload pipeline logs and artifacts (always)
        if: always() && steps.claim_check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs-issue-${{ github.event.inputs.issue_number || github.event.issue.number }}-run-${{ github.run_id }}
          path: |
            /tmp/pipeline.log
            .claude/pipeline-artifacts/
            ~/.shipwright/events.jsonl
          retention-days: 7
          if-no-files-found: warn
        continue-on-error: true

      # Issue #460 — dedicated cost-breakdown.json artifact so the
      # shipwright-optimize workflow can discover and fold cross-machine cost
      # data into the shared rolling baseline without re-downloading the entire
      # log bundle. See docs/cost-sharing.md for the artifact-name contract.
      - name: Upload cost breakdown (always)
        if: always() && steps.claim_check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cost-breakdown-issue-${{ github.event.inputs.issue_number || github.event.issue.number }}-run-${{ github.run_id }}
          path: .claude/pipeline-artifacts/cost-breakdown.json
          retention-days: 30
          if-no-files-found: ignore
        continue-on-error: true

      # Gatekeeper: ensure job fails if pipeline failed (triggers auto-retry)
      - name: Propagate pipeline exit code
        if: always() && steps.claim_check.outputs.skip != 'true'
        run: |
          EXIT_CODE="${{ steps.pipeline.outputs.exit_code }}"
          if [[ -n "$EXIT_CODE" && "$EXIT_CODE" != "0" ]]; then
            echo "Pipeline failed with exit code $EXIT_CODE — failing job to trigger auto-retry"
            exit 1
          fi
          # Final check: state file says failed?
          if [[ -f ".claude/pipeline-state.md" ]]; then
            STATUS=$(grep "^status:" ".claude/pipeline-state.md" 2>/dev/null | awk '{print $2}' || true)
            if [[ "$STATUS" == "failed" ]]; then
              echo "GATEKEEPER: state file says failed — failing job"
              exit 1
            fi
          fi
