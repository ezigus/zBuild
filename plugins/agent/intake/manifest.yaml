id: intake
name: Intake Stage
kind: agent
version: 0.1.0
description: |
  First stage of every pipeline run. Captures the goal, strips synthesized
  pipeline context (sentinel-based sanitization), reads state/platforms.json
  for platform-aware scope defaults, and writes state/scope-manifest.md +
  state/intake.md. For an issue run it writes the issue's requirement list
  with a model call and checks it with a second (#2445, ADR-070 §1).

  Note on `requires.core: [redaction]`: its requirement-list calls go
  through the router, which redacts every prompt (ADR-043).

# ADR-071: intake is the first stage that calls a model; it reads the issue it
# fetches itself, and takes only what its own run left (#2445).
takes:
  - topic: ask
    for: "its own latest output, when it runs again"

hooks:
  run: intake_run
  # ADR-054 §7: intake holds no live resources (no spawned processes, no locks,
  # no open handles beyond what atomic_write closes) and declares no cleanup hook.

requires:
  core:
    - router
    - redaction
    - event-bus
    - state

outputs:
  # ADR-055 v2: JSON result file — verdict-bearing primary output.
  - id: intake_result
    topic: ask
    description: "intake's result: the goal it took in"
    path: "${artifact_dir}/intake-result.json"
    type: intake-result.json@1
    format: json
    required: true
    primary: true
  - id: scope_manifest
    topic: ask
    description: "the files the issue names, as a starting scope"
    path: ${state_dir}/scope-manifest.md
    type: scope-manifest.md@1
    format: markdown
    required: true
    # ADR-020 amendment (#507): non-JSON secondary output. Under v2, primary
    # is intake-result.json; scope_manifest is the downstream-consumed artifact.
  - id: intake_goal
    topic: ask
    description: "the issue's goal, as written"
    path: ${state_dir}/intake.md
    type: intake.md@1
    format: markdown
    required: true
  # #2306 (ADR-070 §1): the issue's requirements, numbered R-1, R-2, … by the
  # engine. Written only for an issue run (a --goal run has no issue), so
  # required:false; design and issue-acceptance
  # read it as their `requirements` input.
  - id: requirements
    topic: ask
    description: "the issue's numbered requirements (R-1, R-2, …)"
    path: "${artifact_dir}/requirements.json"
    type: requirements.json@1
    format: json
    primary: false
    required: false
  # ADR-055 §9: this stage's statement of what it DID. required:true —
  # written on every terminal verdict, so absence means something went wrong.
  - id: intake_summary
    topic: ask
    description: "intake's summary"
    path: "${artifact_dir}/intake-summary.md"
    type: intake-summary.md@1
    format: markdown
    required: true
    summary: true

provides:
  result_contract: 3
  role: intake
  # ADR-001 §"Declared events" (#1717) — this plugin's own events, composed into
  # the engine's known set at load. Adding one here needs no engine-config edit.
  events:
    - intake.override.closed_issue_allowed
    - intake.refused.issue_closed

# ADR-047 §6: after this stage completes, the runner merges the operator's
# --scope override (scope-override.md) into this stage's scope-manifest.md. The
# runner keys on this capability flag, not the stage name (mechanics name no stage).
capabilities:
  merges_scope_override: true

config:
  tier_default: T1
  # ADR-017 §11 (#1816): declared so the template override wins. #2445: each
  # of intake's two model calls has one turn — it answers from the issue it is
  # given. #2448: and no tools, so it cannot open the code or spend its turn on
  # a tool call.
  router:
    timeout_s: 120
    max_turns: 1
    tools: none
